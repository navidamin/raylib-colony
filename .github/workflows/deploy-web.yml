name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    # PAUSED: this branch was listed so the /lunarmap/ playtest could be
    # opened on a phone before merge. The excavation branch needs the site
    # for its own sandbox, and one repo has one Pages site -- with both
    # branches listed, whichever pushed last cancelled the other's build
    # (concurrency group "pages", cancel-in-progress). Nothing else this
    # branch does depends on Pages. Put it back when the site is free:
    #   branches: [main, master, claude/lunar-elevation-lola-dem-1dcdtj]
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.64
        actions-cache-folder: 'emsdk-cache'

    - name: Configure with CMake (Emscripten)
      run: emcmake cmake -B build -DPLATFORM=Web -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build

    - name: Prepare deployment directory
      run: |
        mkdir -p deploy
        cp build/src/colony_game.html deploy/index.html
        cp build/src/colony_game.js deploy/colony_game.js
        cp build/src/colony_game.wasm deploy/colony_game.wasm
        # .data file contains preloaded assets
        if [ -f build/src/colony_game.data ]; then
          cp build/src/colony_game.data deploy/colony_game.data
        fi
        # View-ladder playtest at /viewtest/ (annotated Orbital->Sect walk)
        mkdir -p deploy/viewtest
        cp build/src/colony_viewtest.html deploy/viewtest/index.html
        cp build/src/colony_viewtest.js deploy/viewtest/colony_viewtest.js
        cp build/src/colony_viewtest.wasm deploy/viewtest/colony_viewtest.wasm
        if [ -f build/src/colony_viewtest.data ]; then
          cp build/src/colony_viewtest.data deploy/viewtest/colony_viewtest.data
        fi
        # Real-elevation lunar map (LOLA DEM) at /lunarmap/
        mkdir -p deploy/lunarmap
        cp build/src/lunar_map.html deploy/lunarmap/index.html
        cp build/src/lunar_map.js deploy/lunarmap/lunar_map.js
        cp build/src/lunar_map.wasm deploy/lunarmap/lunar_map.wasm
        # .data file preloads the LOLA DEM and WAC albedo
        if [ -f build/src/lunar_map.data ]; then
          cp build/src/lunar_map.data deploy/lunarmap/lunar_map.data
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
