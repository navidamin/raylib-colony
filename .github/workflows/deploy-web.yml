name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    # One repo has one Pages site, and the excavation branch deploys to it
    # too. Whichever branch pushes last owns the site until the other one
    # pushes again -- the builds also cancel each other (concurrency group
    # "pages", cancel-in-progress). This branch is listed while the
    # site-selection playtest at /lunarmap/ is being tried on a phone.
    # Drop it from this list again once that is done. The DomeForge sect
    # view is listed for the same reason, at /sectview/?sect -- and adds
    # only that directory (see "Start from the live site").
    branches: [main, master, claude/lunar-elevation-lola-dem-1dcdtj, claude/lunarmap-wiring-site-selection-b9lwaw, claude/sect-view-domeforge]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - 'tools/playtest/**'
      - 'prototypes/planet_visuals/regolith_*'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read       # to download the other branch's Pages artifact

concurrency:
  group: "pages"
  # Queue, do not cancel. Two branches deploy to the one Pages site, and
  # with cancel-in-progress they killed each other's runs instead of
  # taking turns: runs 75 and 77 on this branch were both cancelled by
  # excavation-branch pushes, so neither the four-level ladder nor the
  # window cache ever reached the site. Queuing costs a few minutes of
  # waiting; cancelling costs the deploy entirely.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.64
        actions-cache-folder: 'emsdk-cache'

    - name: Configure with CMake (Emscripten)
      run: emcmake cmake -B build -DPLATFORM=Web -DCMAKE_BUILD_TYPE=Release

    # Only the view test: this branch adds one directory to the site.
    - name: Build
      run: cmake --build build --target colony_viewtest

    # Three branches share one Pages site and every deploy replaces all of
    # it. The excavation and lola-dem branches carry each other's
    # directories; this branch must not replace either, so it starts from
    # the newest successful deploy of theirs -- the site as it stands --
    # and only adds /sectview/. Their deploys do not carry /sectview/, so
    # it lasts until the next push from either; re-run this workflow then.
    - name: Start from the live site
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-web.yml \
                 --status success --limit 30 --json databaseId,headBranch \
                 --jq '[.[] | select(.headBranch != "claude/sect-view-domeforge")][0].databaseId')
        if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
          echo "no live site to start from -- refusing to deploy alone"; exit 1
        fi
        echo "starting from run $RUN_ID"
        mkdir -p _live deploy
        gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n github-pages -D _live
        tar -xf _live/artifact.tar -C deploy
        rm -rf _live
        ls deploy

    # The DomeForge sect view at /sectview/ (the view test; ?sect opens it
    # straight in the Sect view).
    - name: Add /sectview/
      run: |
        rm -rf deploy/sectview
        mkdir -p deploy/sectview
        cp build/src/colony_viewtest.html deploy/sectview/index.html
        cp build/src/colony_viewtest.js   deploy/sectview/colony_viewtest.js
        cp build/src/colony_viewtest.wasm deploy/sectview/colony_viewtest.wasm
        if [ -f build/src/colony_viewtest.data ]; then
          cp build/src/colony_viewtest.data deploy/sectview/colony_viewtest.data
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: deploy
        # Long enough for the other branch's overlay to still find this
        # artifact after a quiet spell; the default 1 day made the union
        # decay whenever one branch stopped pushing.
        retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
