name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    # TEMPORARY: the excavation branch deploys so the extraction sandbox can be
    # played on a phone before it merges. Remove this branch when it lands, or
    # every push to it replaces the live site.
    #
    # One repo has one Pages site and every deploy replaces ALL of it. The
    # lunar-elevation branch is actively deploying its own site (/, /viewtest/,
    # /lunarmap/ -- no /playtest/, no /extraction/), so each branch's push was
    # 404ing the other branch's sandboxes within minutes.
    #
    # The truce: the "Overlay other branches' sandboxes" step below downloads
    # the latest successful Pages artifact from the OTHER active branch and
    # copies in any top-level directory this deploy does not itself provide.
    # A deploy from THIS branch therefore serves the union. Pushes from the
    # other branch still clobber /playtest/ and /extraction/ until it adopts
    # the same step -- copy it verbatim into its own deploy-web.yml. MAIN
    # replaces the site too on every merge; the only real end to the
    # ping-pong is merging the branches.
    branches: [main, master, claude/excavation-module-design-jhp3v1]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'tools/playtest/**'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read       # to download the other branch's Pages artifact

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.64
        actions-cache-folder: 'emsdk-cache'

    - name: Configure with CMake (Emscripten)
      run: emcmake cmake -B build -DPLATFORM=Web -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build

    - name: Prepare deployment directory
      run: |
        mkdir -p deploy
        cp build/src/colony_game.html deploy/index.html
        cp build/src/colony_game.js deploy/colony_game.js
        cp build/src/colony_game.wasm deploy/colony_game.wasm
        # .data file contains preloaded assets
        if [ -f build/src/colony_game.data ]; then
          cp build/src/colony_game.data deploy/colony_game.data
        fi

        # Prospecting playtest sandbox at /playtest/
        mkdir -p deploy/playtest
        cp build/src/colony_playtest.html deploy/playtest/index.html
        cp build/src/colony_playtest.js deploy/playtest/colony_playtest.js
        cp build/src/colony_playtest.wasm deploy/playtest/colony_playtest.wasm
        if [ -f build/src/colony_playtest.data ]; then
          cp build/src/colony_playtest.data deploy/playtest/colony_playtest.data
        fi

        # Whole extraction unit sandbox at /extraction/
        mkdir -p deploy/extraction
        cp build/src/colony_extraction.html deploy/extraction/index.html
        cp build/src/colony_extraction.js deploy/extraction/colony_extraction.js
        cp build/src/colony_extraction.wasm deploy/extraction/colony_extraction.wasm
        if [ -f build/src/colony_extraction.data ]; then
          cp build/src/colony_extraction.data deploy/extraction/colony_extraction.data
        fi

    # See the note at the top: pull the other active branch's latest site and
    # keep any sandbox it has that this deploy does not. Never fails the build
    # -- a missing or expired artifact just means this deploy ships alone.
    - name: Overlay other branches' sandboxes
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e
        for BR in claude/lunar-elevation-lola-dem-1dcdtj; do
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-web.yml \
                   --branch "$BR" --status success --limit 1 \
                   --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "no successful run on $BR -- skipping"; continue
          fi
          rm -rf _other _other_x && mkdir -p _other _other_x
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
             -n github-pages -D _other || { echo "artifact gone on $BR"; continue; }
          tar -xf _other/artifact.tar -C _other_x || continue
          for d in _other_x/*/; do
            name=$(basename "$d")
            if [ ! -e "deploy/$name" ]; then
              echo "carrying /$name/ from $BR"
              cp -r "$d" "deploy/$name"
            fi
          done
        done
        rm -rf _other _other_x
        true

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
