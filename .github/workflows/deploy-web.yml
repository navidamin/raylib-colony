name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    # One repo has one Pages site, and the excavation branch deploys to it
    # too; every deploy publishes the WHOLE site, and each branch carries
    # the other's folders from its last good deploy. What this branch
    # publishes:
    #   /           an index of the playtests (tools/pages/index.html)
    #   /ladder/    the game; /ladder/walk/ the game with notes
    #   /lunarmap/  /regolith/
    # and carries the excavation branch's /playtest/ and /extraction/.
    # /viewtest/ is retired (2026-09-24): it was /ladder/walk/ twice over.
    #
    # STILL CONTESTED: the excavation branch builds its own month-old game
    # at / and its old Planet-view walk at /viewtest/, so after one of its
    # deploys those two addresses are its build, not this one's -- a
    # playtest of this branch's ladder on 2026-09-24 turned out to be
    # that. /ladder/ is never contested (no other branch builds one), and
    # every page names its build in its tab title. Ending it needs that
    # branch's deploy changed, or the branches merged.
    # This branch is listed while the site-selection playtest is being
    # tried on a phone. (lunarmap-wiring-site-selection was merged into it
    # on 2026-09-23 and is no longer listed.)
    branches: [main, master, claude/lunar-elevation-lola-dem-1dcdtj]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - 'tools/playtest/**'
      - 'prototypes/planet_visuals/regolith_*'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read       # to download the other branch's Pages artifact

concurrency:
  group: "pages"
  # Queue, do not cancel. Two branches deploy to the one Pages site, and
  # with cancel-in-progress they killed each other's runs instead of
  # taking turns: runs 75 and 77 on this branch were both cancelled by
  # excavation-branch pushes, so neither the four-level ladder nor the
  # window cache ever reached the site. Queuing costs a few minutes of
  # waiting; cancelling costs the deploy entirely.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.64
        actions-cache-folder: 'emsdk-cache'

    # The Pages site is shared, so every page says which build it is: on
    # the game's title screen (COLONY_BUILD_STAMP, src/build_stamp.h) and
    # in the browser-tab title (written into each index.html below).
    - name: Build stamp
      run: echo "STAMP=${GITHUB_REF_NAME} $(git rev-parse --short HEAD) $(date -u '+%Y-%m-%d %H:%M') UTC" >> "$GITHUB_ENV"

    - name: Configure with CMake (Emscripten)
      run: emcmake cmake -B build -DPLATFORM=Web -DCMAKE_BUILD_TYPE=Release "-DCOLONY_BUILD_STAMP=${STAMP}"

    - name: Build
      run: cmake --build build

    # The site level must have its ground on it, in a browser, at a big
    # window. On 2026-09-23 the deployed site level came up flat grey --
    # the page asked the CPU for a chain it could never finish -- and
    # every other check was green, because nothing ran the web build at a
    # real desktop size. This does, with SwiftShader standing in for a
    # machine with no usable GPU (the path that broke), and a failure here
    # stops the deploy rather than publishing a grey site level.
    #
    # The game gets the same walk twice: as SwiftShader runs it (the CPU
    # path), and with ?terrain=gpu, the path a device with a real GPU takes
    # -- where WebGL1 cannot draw the regolith and the site level came up
    # smooth and craterless the day the ladder went into the game.
    # See tools/lunarmap/web_site_level_test.mjs.
    - name: Site level has its ground (browser, 1656x960)
      run: |
        npm install --no-save --no-audit --no-fund playwright@1.56.1
        npx playwright install --with-deps chromium
        node tools/lunarmap/web_site_level_test.mjs build/src lunar_map
        node tools/lunarmap/web_site_level_test.mjs build/src colony_game
        node tools/lunarmap/web_site_level_test.mjs build/src colony_game gpu

    - name: Prepare deployment directory
      run: |
        mkdir -p deploy
        # / is the index of the playtests: what each address is and which
        # branch builds it. Not a game -- / is the address another branch's
        # deploy can replace, so a game there is the sign that it has.
        cp tools/pages/index.html deploy/index.html
        sed -i -e "s|BUILD_STAMP|${STAMP}|g" -e "s|BUILD_SHA|$(git rev-parse --short HEAD)|g" deploy/index.html
        grep -q "BUILD_STAMP\|BUILD_SHA" deploy/index.html && { echo "index not stamped"; exit 1; } || true
        # The game at /ladder/, its walk at /ladder/walk/. No other branch
        # builds a /ladder/, so their deploys carry this one instead of
        # overwriting it. The address for playtesting the ladder.
        mkdir -p deploy/ladder/walk
        cp build/src/colony_game.html deploy/ladder/index.html
        cp build/src/colony_game.js build/src/colony_game.wasm build/src/colony_game.data deploy/ladder/
        cp build/src/colony_viewtest.html deploy/ladder/walk/index.html
        cp build/src/colony_viewtest.js build/src/colony_viewtest.wasm build/src/colony_viewtest.data deploy/ladder/walk/
        # Real-elevation lunar map (LOLA DEM) at /lunarmap/
        mkdir -p deploy/lunarmap
        cp build/src/lunar_map.html deploy/lunarmap/index.html
        cp build/src/lunar_map.js deploy/lunarmap/lunar_map.js
        cp build/src/lunar_map.wasm deploy/lunarmap/lunar_map.wasm
        # .data file preloads the LOLA DEM and WAC albedo
        if [ -f build/src/lunar_map.data ]; then
          cp build/src/lunar_map.data deploy/lunarmap/lunar_map.data
        fi
        # The terrain-synthesis bench at /regolith/. Plain JS -- the chain is
        # a port of src/TerrainGen/terrain_synthesis.cpp and the imagery
        # travels inside regolith_blocks.js -- so there is nothing to build
        # and nothing to fetch at runtime. It is a design bench with a free
        # zoom, NOT a level ladder: the page says so at the top. (A second
        # page here used to walk its own 50 km -> 1 km descent; it was a
        # third ladder beside the game's and lunar_map's, and it went --
        # graveyard 10.)
        mkdir -p deploy/regolith
        cp prototypes/planet_visuals/regolith_craters.html  deploy/regolith/index.html
        cp prototypes/planet_visuals/regolith_chain.js      deploy/regolith/
        cp prototypes/planet_visuals/regolith_blocks.js     deploy/regolith/
        # Stamp the build into the page. Without it there is no telling a
        # stale tab from a deploy that has not landed.
        sed -i "s|BUILD_STAMP|${STAMP}|" deploy/regolith/index.html
        grep -q BUILD_STAMP deploy/regolith/index.html && { echo "stamp not applied"; exit 1; } || true
        # And into every built page's tab title, so the tab says whose build
        # it is before the page has even loaded. The names are the window
        # titles: once a page starts, its window title replaces the tab
        # title, stamped the same way (StampedTitle, src/build_stamp.h).
        # (The index at / carries the stamp in its own title already.)
        for page in ladder/index.html ladder/walk/index.html lunarmap/index.html; do
          name=$(case "$page" in
            ladder/index.html) echo "Colony - Planet Colonization Game";;
            ladder/walk/index.html) echo "Colony - Game Walk";;
            lunarmap/index.html) echo "lunar_map - LOLA elevation";; esac)
          sed -i "s|<title>[^<]*</title>|<title>${name} - ${STAMP}</title>|" "deploy/$page"
          grep -q "<title>${name} - ${STAMP}</title>" "deploy/$page" || { echo "title stamp not applied to $page"; exit 1; }
        done

    # One repo has one Pages site and every deploy replaces ALL of it. The
    # excavation branch serves /playtest/ and /extraction/; this step pulls
    # its latest successful Pages artifact and keeps any top-level directory
    # this deploy does not itself provide, so a deploy from THIS branch
    # serves the union instead of 404ing the other branch's sandboxes.
    # The excavation branch carries the mirror of this step, naming this
    # branch. Never fails the build: no artifact just means shipping alone.
    - name: Overlay other branches' sandboxes
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e
        for BR in claude/excavation-module-design-jhp3v1; do
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-web.yml \
                   --branch "$BR" --status success --limit 1 \
                   --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "no successful run on $BR -- skipping"; continue
          fi
          rm -rf _other _other_x && mkdir -p _other _other_x
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
             -n github-pages -D _other || { echo "artifact gone on $BR"; continue; }
          tar -xf _other/artifact.tar -C _other_x || continue
          for d in _other_x/*/; do
            name=$(basename "$d")
            # Retired here, so not taken back from the other branch either:
            # a folder one branch stops publishing otherwise returns from
            # the other's last deploy, which carried it from this one.
            case "$name" in
              viewtest) echo "not carrying /$name/ (retired: use /ladder/walk/)"; continue;;
            esac
            if [ ! -e "deploy/$name" ]; then
              echo "carrying /$name/ from $BR"
              cp -r "$d" "deploy/$name"
            fi
          done
        done
        rm -rf _other _other_x
        true
        # NOTE: this branch must NOT build or copy its own /playtest/ or
        # /extraction/ -- the excavation branch owns those and the loop
        # above carries its build. A copy block appended here once
        # clobbered the carried /playtest/ with this branch's stale
        # compile of it, silently serving the old module.

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: deploy
        # Long enough for the other branch's overlay to still find this
        # artifact after a quiet spell; the default 1 day made the union
        # decay whenever one branch stopped pushing.
        retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
