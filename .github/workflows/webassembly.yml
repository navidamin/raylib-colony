name: WebAssembly

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/webassembly.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write       # for actions/upload-release-asset to upload release asset
    runs-on: ubuntu-latest

    env:
      PROJECT_NAME: ${{ github.event.repository.name }}
      PROJECT_RELEASE_PATH: ${{ github.event.repository.name }}_dev_wasm

    steps:
    - name: Checkout this repo
      uses: actions/checkout@v4

    - name: Setup emsdk
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.64
        actions-cache-folder: 'emsdk-cache'

    - name: Setup Release Paths
      run: |
        echo "PROJECT_RELEASE_PATH=${{ env.PROJECT_NAME }}_v${{ github.event.release.tag_name }}_wasm" >> $GITHUB_ENV
      if: github.event_name == 'release' && github.event.action == 'published'

    - name: Configure with CMake (Emscripten)
      run: emcmake cmake -B build -DPLATFORM=Web -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build

    - name: Generate Artifacts
      run: |
        mkdir -p ${{ env.PROJECT_RELEASE_PATH }}
        cp build/src/colony_game.html ${{ env.PROJECT_RELEASE_PATH }}/index.html
        cp build/src/colony_game.js ${{ env.PROJECT_RELEASE_PATH }}/colony_game.js
        cp build/src/colony_game.wasm ${{ env.PROJECT_RELEASE_PATH }}/colony_game.wasm
        if [ -f build/src/colony_game.data ]; then
          cp build/src/colony_game.data ${{ env.PROJECT_RELEASE_PATH }}/colony_game.data
        fi
        cp README.md ${{ env.PROJECT_RELEASE_PATH }}/README.md
        cp LICENSE ${{ env.PROJECT_RELEASE_PATH }}/LICENSE
        ls -la ${{ env.PROJECT_RELEASE_PATH }}
        cd ${{ env.PROJECT_RELEASE_PATH }} && zip -r ../${{ env.PROJECT_RELEASE_PATH }}.zip .

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PROJECT_RELEASE_PATH }}.zip
        path: ./${{ env.PROJECT_RELEASE_PATH }}.zip

    - name: Upload Artifact to Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.PROJECT_RELEASE_PATH }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: github.event_name == 'release' && github.event.action == 'published'
