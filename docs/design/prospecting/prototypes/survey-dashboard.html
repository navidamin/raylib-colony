    if (Math.abs(p.t - want) < 0.002) p.t = want;
  }
}

/* =====================================================================
   5. THE FRAME
   ===================================================================== */
function DrawModuleBar(ctx) {
  const b = LT.bar, n = LT.MODULES.length, tw = b.w / n;
  panel(ctx, b.x, b.y, b.w, b.h, { r: 8, leg: 18 });
  for (let i = 0; i < n; i++) {
    const x = b.x + i * tw, on = i === ui.module;
    if (on) {
      rrect(ctx, x + 3, b.y + 3, tw - 6, b.h - 6, 6);
      ctx.fillStyle = 'rgba(53,216,238,0.09)'; ctx.fill();
      ctx.strokeStyle = C.accent; ctx.lineWidth = 1.2; ctx.stroke();
    }
    // condensed to fit its own share of the bar, so five full names survive
    // the phone width instead of being abbreviated into initials
    font(ctx, LT.tabSize, on ? 700 : 500);
    const wide = ctx.measureText(LT.MODULES[i]).width;
    const sx = Math.min(1, (tw - 16) / wide);
    condensed(ctx, LT.MODULES[i], x + tw * 0.5 - wide * sx * 0.5, b.y + b.h * 0.5 + LT.tabSize * 0.36,
              { size: LT.tabSize, sx, font: MONO, weight: on ? 700 : 500, color: on ? C.accent : C.dim });
    if (i) { ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, b.y + 9); ctx.lineTo(x, b.y + b.h - 9); ctx.stroke(); }
  }
}
/* A panel with its title, and nothing in it yet. `hint` names what will be
   here, in the dimmest ink the palette has -- an empty console should say
   which console it is, not pretend to be finished. */
function Shell(ctx, r, name, o = {}) {
  if (!r) return;
  panel(ctx, r.x, r.y, r.w, r.h, o);
  if (name) title(ctx, name, r.x + (o.pad ?? 33), r.y + (o.ty ?? 38), { size: o.size || 27, underline: o.underline || 46 });
  if (o.hint) {
    ctx.textAlign = 'center';
    label(ctx, o.hint, r.x + r.w * 0.5, r.y + r.h * 0.5, 12, 'rgba(95,122,150,0.55)');
    ctx.textAlign = 'left';
  }
}
function DrawStatic(ctx) {
  ctx.fillStyle = C.bgEdge; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = C.bg;
  rrect(ctx, 6, 6, W - 12, H - 12, 16); ctx.fill();
  DrawModuleBar(ctx);

  // the middle column is on both layouts and is never transient
  Shell(ctx, LT.layers, 'LAYERS', LT.mode === 'desk'
    ? {}
    : { pad: 18, ty: 32, size: 20, underline: 34 });
  if (LT.mode === 'desk') {
    const L = LT.layers;
    // One verb, one line. The dashboard's mock offered two -- peel and
    // isolate -- and peel was cut (design doc, decision 3).
    label(ctx, 'Tap a bed to lift it out of the stack; everything else ghosts.',
          L.x + 33, L.y + 90, 16, C.body, { sans: true });
    // the hexagon vignette that frames the block without boxing it
    const h = LT.block, hex = Array.from({ length: 6 }, (_, k) => {
      const a = -Math.PI / 2 + k * Math.PI / 3; return [h.cx + Math.cos(a) * h.r, h.cy + Math.sin(a) * h.r]; });
    rpoly(ctx, hex); ctx.strokeStyle = C.hex; ctx.lineWidth = 1.5; ctx.stroke();
  }
  LogBox(ctx, LT.log);
  ConfidenceRow(ctx);

  if (LT.mode === 'desk') {
    Shell(ctx, LT.survey, 'SURVEY TOOLS', { hint: 'stage 4 — the rack' });
    connector(ctx, LT.stats.branchX, LT.stats.branchFrom, LT.stats.y);
    Shell(ctx, LT.stats, 'TOOL STATS', { ty: 34, size: 22, underline: 38, hint: 'stage 7' });
    Shell(ctx, LT.drill, 'DRILL BAR', { hint: 'stage 6 — the rig' });
    connector(ctx, LT.dstats.branchX, LT.dstats.branchFrom, LT.dstats.y);
    Shell(ctx, LT.dstats, 'DRILL STATS', { ty: 34, size: 22, underline: 38, hint: 'stage 7' });
  }
}
function LogBox(ctx, r) {
  if (!r) return;
  if (r.nested) {
    rrect(ctx, r.x, r.y, r.w, r.h, 10); ctx.fillStyle = C.boxFill; ctx.fill();
    ctx.strokeStyle = C.boxEdge; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.strokeStyle = C.accent; ctx.lineWidth = 2;
    [[r.x, r.y, 1, 1], [r.x + r.w, r.y, -1, 1], [r.x, r.y + r.h, 1, -1], [r.x + r.w, r.y + r.h, -1, -1]]
      .forEach(([cx, cy, dx, dy]) => { ctx.beginPath(); ctx.moveTo(cx, cy + dy * 18); ctx.lineTo(cx, cy + dy * 9); ctx.moveTo(cx + dx * 9, cy); ctx.lineTo(cx + dx * 18, cy); ctx.stroke(); });
  } else {
    Shell(ctx, r, 'SURVEY LOG', { ty: 32, size: 20, underline: 34 });
  }
  ctx.textAlign = 'center';
  label(ctx, 'stage 7 — the log', r.x + r.w * 0.5, r.y + r.h * 0.5, 12, 'rgba(95,122,150,0.55)');
  ctx.textAlign = 'left';
}
function ConfidenceRow(ctx) {
  const c = LT.conf; if (!c) return;
  label(ctx, 'CONFIDENCE', c.x, c.y + 14, LT.mode === 'desk' ? 17 : 13, C.title, { weight: 700 });
  // an empty track for now: the value is Delineation(), and it arrives in stage 5
  rrect(ctx, c.barX, c.y, c.w, c.h, 3); ctx.fillStyle = C.track; ctx.fill();
  ctx.strokeStyle = C.barEdge; ctx.lineWidth = 1; ctx.stroke();
  label(ctx, '—', c.barX + c.w + 18, c.y + 14, LT.mode === 'desk' ? 18 : 14, C.depth);
}

/* The two transient panels, drawn live because they move. Each slides off
   its own edge by its open fraction and dims what is behind it. */
function DrawTransient(ctx) {
  if (LT.mode === 'desk') return;
  Sheet(ctx, ui.rack.t, LT.drawer, () => {
    Shell(ctx, LT.survey, 'SURVEY TOOLS', { ty: 32, size: 20, underline: 34, hint: 'stage 4 — the rack', fill: C.bg });
    connector(ctx, LT.stats.branchX, LT.stats.branchFrom, LT.stats.y);
    Shell(ctx, LT.stats, 'TOOL STATS', { ty: 28, size: 17, underline: 30, hint: 'stage 7', fill: C.bg });
  });
  Sheet(ctx, ui.sheet.t, LT.sheet, () => {
    Shell(ctx, LT.drill, 'DRILL BAR', { ty: 32, size: 20, underline: 34, hint: 'stage 6 — the rig', fill: C.bg });
    connector(ctx, LT.dstats.branchX, LT.dstats.branchFrom, LT.dstats.y);
    Shell(ctx, LT.dstats, 'DRILL STATS', { ty: 28, size: 17, underline: 30, hint: 'stage 7', fill: C.bg });
  });
  // last, so a sheet can never bury its own toggle
  for (const tb of LT.tabs || []) {
    const on = ui[tb.key].open;
    rrect(ctx, tb.x, tb.y, tb.w, tb.h, 6);
    ctx.fillStyle = on ? 'rgba(53,216,238,0.16)' : 'rgba(5,24,38,0.92)'; ctx.fill();
    ctx.strokeStyle = on ? C.accent : C.btnEdge; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.textAlign = 'center';
    label(ctx, on ? 'CLOSE' : tb.name, tb.x + tb.w * 0.5, tb.y + tb.h * 0.5 + 4, 11,
          on ? C.accent : C.btnText, { weight: 700 });
    ctx.textAlign = 'left';
  }
}
function Sheet(ctx, t, r, draw) {
  if (!r || t <= 0.002) return;
  const dx = r.from === 'left' ? -(r.x + r.w) * (1 - t) : 0;
  const dy = r.from === 'top' ? -(r.y + r.h) * (1 - t) : 0;
  ctx.save();
  ctx.fillStyle = `rgba(2,11,19,${0.62 * t})`; ctx.fillRect(0, 0, W, H);   // everything behind it dims
  ctx.translate(dx, dy);
  draw();
  ctx.restore();
}

/* =====================================================================
   8. THE GROUND -- generated, not measured
   ---------------------------------------------------------------------
   Ported from layer-block.html, which is the model of record for what the
   ground IS. Holo3D's six measured edge profiles are a LOOK, not a model,
   and they are gone: what feeds the renderer is this.

   Four beds on an N x N lattice. SURF[L][j * STRIDE + i] is the depth in
   METRES of interface L at that node -- 0 is the ground you stand on, 4 is
   the base of the surveyed column, which is a depth somebody chose rather
   than a bed.

   Not here yet, and deliberately: the error model (stage 3 turns it on with
   fog), holes and scour (stage 2), and the real LOLA ground (the bench,
   stage 8). Confidence() returns 1 for now, which switches the error off
   without removing the arithmetic that will carry it.
   ===================================================================== */
const P = {
  lattice: 28,
  relief: 93, feature: 3.5, detail: 3, conform: 0.62, damp: 0.55,
  dip: 67, dipAz: 25, dipSpread: 0.35, grain: 0.25,
  t0: 200, t1: 400, t2: 550, t3: 850,
  crater: 1, craterN: 3, craterSize: 1.0, craterDepth: 90, craterLayer: 0,
  craterRim: 0.34, craterInfill: 0.55,
};
const SEED_SHARED = 0x51ed, SEED_OWN = 0x9e37;
let N = P.lattice, STRIDE = N + 1;
let SURF = [], TOPS = [0, 0, 0, 0], COLUMN_M = 2000;

function Mix(a){
  a = a >>> 0;
  a ^= a >>> 16; a = Math.imul(a, 0x7feb352d) >>> 0;
  a ^= a >>> 15; a = Math.imul(a, 0x846ca68b) >>> 0;
  a ^= a >>> 16;
  return a >>> 0;
}
function Hash2(x, y, seed){
  const v = ((Math.imul(x >>> 0, 374761393) >>> 0) +
             (Math.imul(y >>> 0, 668265263) >>> 0) + (seed >>> 0)) >>> 0;
  return Mix(v) / 4294967295.0;
}
const Smooth = t => t * t * (3.0 - 2.0 * t);
/* Value noise on a lattice of `period` cells that WRAPS. */
function ValueNoise(u, v, period, seed){
  const fx = u * period, fy = v * period;
  let x0 = Math.floor(fx), y0 = Math.floor(fy);
  const tx = Smooth(fx - x0), ty = Smooth(fy - y0);
  const x1 = (x0 + 1) % period, y1 = (y0 + 1) % period;
  x0 = ((x0 % period) + period) % period;
  y0 = ((y0 % period) + period) % period;
  const a = Hash2(x0, y0, seed), b = Hash2(x1, y0, seed);
  const c = Hash2(x0, y1, seed), d = Hash2(x1, y1, seed);
  const ab = a + (b - a) * tx, cd = c + (d - c) * tx;
  return ab + (cd - ab) * ty;
}
function Fbm(u, v, basePeriod, octaves, seed){
  let sum = 0.0, amp = 1.0, norm = 0.0, period = basePeriod;
  for (let o = 0; o < octaves; o++){
    sum += ValueNoise(u, v, period, (seed + o * 7919) >>> 0) * amp;
    norm += amp; amp *= 0.5; period *= 2;
  }
  return sum / norm;
}

/* A few small craters, hashed so they are the same every load, and each
   nudged off the middle -- a crater under the sect is not a crater, it is a
   mistake. */
const CRATER_SEED = 0x6d2b;
const CRATERS = [];
function BuildCraters(){
  CRATERS.length = 0;
  const n = Math.round(clamp(P.craterN, 0, 6));
  for (let k = 0; k < n; k++){
    const h = i => Hash2(k * 31 + i, 3, CRATER_SEED);
    let x = 0, y = 0;
    for (let t = 0; t < 14; t++){
      x = 0.10 + h(1 + t * 5) * 0.80;
      y = 0.10 + h(2 + t * 5) * 0.80;
      if (Math.hypot(x - 0.5, y - 0.5) > 0.17) break;
    }
    CRATERS.push({ x, y, r: (0.028 + h(3) * 0.042) * clamp(P.craterSize, 0.2, 3),
                   d: 0.55 + h(4) * 0.9 });
  }
}
/* Summed, so two that overlap merge the way two that overlap would. */
function Bowl(u, v){
  let s = 0;
  for (const c of CRATERS){
    const r = Math.hypot(u - c.x, v - c.y) / Math.max(c.r, 0.006);
    if (r > 2.0) continue;
    const floor = r < 1 ? -(1 - r * r) : 0;
    const rim = P.craterRim * Math.exp(-((r - 1) * (r - 1)) / (2 * 0.20 * 0.20));
    s += (floor + rim) * c.d;
  }
  return s;
}
/* Which interfaces a crater reaches: it was cut into interface k, so below is
   undisturbed and above is the same bowl progressively filled in -- which is
   what "buried crater" means. */
function CraterAmp(L){
  if (!P.crater) return 0;
  const k = P.craterLayer;
  if (L > k) return 0;
  return P.craterDepth * Math.pow(P.craterInfill, k - L);
}

/* How wrong an interface is allowed to be before any of it is known. Scaled by
   the thinner of the two beds it separates, so a thin bed is never given an
   error that would swallow it, and drawn from a fixed hash so the wrongness is
   a property of this block rather than of this frame. Inert until stage 3
   gives Confidence() something to say. */
const ERR_SEED = 0x3c9d;
function ErrParams(L, edge){
  const span = Math.max(2, Math.min(edge[L] - edge[L - 1], edge[L + 1] - edge[L]));
  const h = k => Hash2(L * 37 + k, 11, ERR_SEED);
  const ta = h(2) * 6.2832;
  return {
    bulk: (h(1) - 0.5) * 2 * 0.30 * span,
    tilt: (0.15 + h(3) * 0.45) * span,
    tca: Math.cos(ta), tsa: Math.sin(ta),
    amp: (0.22 + h(4) * 0.30) * span,
    p1: 2 + Math.round(h(5) * 2), p2: 5 + Math.round(h(6) * 4),
    s1: (ERR_SEED + L * 7919) >>> 0, s2: (ERR_SEED + L * 104729 + 17) >>> 0
  };
}
const Confidence = () => 1;                    // stage 3 replaces this

function BuildHeights(){
  N = Math.max(4, Math.round(P.lattice)); STRIDE = N + 1;
  BuildCraters();
  TOPS = [0, P.t0, P.t0 + P.t1, P.t0 + P.t1 + P.t2];
  COLUMN_M = TOPS[3] + P.t3;
  const edge = [TOPS[0], TOPS[1], TOPS[2], TOPS[3], COLUMN_M];

  const az = P.dipAz * Math.PI / 180, ca = Math.cos(az), sa = Math.sin(az);
  const period = Math.max(1, Math.round(P.feature));
  const oct = Math.max(1, Math.round(P.detail));
  const ky = 1 - 0.85 * P.grain;               // squash the noise domain: mottle becomes ridges

  SURF = [];
  for (let L = 0; L <= 4; L++){
    const d = new Float32Array(STRIDE * STRIDE);
    const amp = P.relief * Math.pow(P.damp, L);
    /* Topography is a surface fact. Beds inherit some of it near the top and
       less with depth; the BASE inherits none -- letting the terrain warp it
       turns a block diagram into a drape. */
    const realW = L === 4 ? 0 : 1;
    const dip = P.dip * (1 + P.dipSpread * L);
    const cr  = CraterAmp(L);
    const ep = (L >= 1 && L <= 3) ? ErrParams(L, edge) : null;
    for (let j = 0; j <= N; j++)
      for (let i = 0; i <= N; i++){
        const u = i / N, v = j / N, vv = 0.5 + (v - 0.5) * ky;
        const shared = (Fbm(u, vv, period, oct, SEED_SHARED) - 0.5) * realW;
        const own    = Fbm(u, vv, period, oct, (SEED_OWN + L * 7919) >>> 0) - 0.5;
        let h = amp * 2 * (P.conform * shared + (1 - P.conform) * own);
        h += dip * ((u - 0.5) * ca + (v - 0.5) * sa);
        if (cr !== 0) h += cr * Bowl(u, v);
        let z = edge[L] - h;                   // h is up-positive, z is depth
        if (ep){
          const e = ep.bulk
                  + ep.tilt * ((u - 0.5) * ep.tca + (v - 0.5) * ep.tsa)
                  + ep.amp * ((Fbm(u, v, ep.p1, 2, ep.s1) - 0.5) * 1.30
                            + (Fbm(u, v, ep.p2, 2, ep.s2) - 0.5) * 0.70);
          z += e * (1 - Confidence());
        }
        d[j * STRIDE + i] = z;
      }
    SURF.push(d);
  }
  /* No interface may pass through the one below it. A deep crater bottoming
     out on a harder unit is the interesting case this keeps legal: the floor
     flattens against the bed beneath instead of turning the block inside out. */
  for (let L = 1; L <= 4; L++){
    const above = SURF[L - 1], here = SURF[L];
    const minTh = Math.max(0.4, (edge[L] - edge[L - 1]) * 0.12);
    for (let k = 0; k < here.length; k++) here[k] = Math.max(here[k], above[k] + minTh);
  }
}

/* =====================================================================
   9. THE BLOCK IN THE PANEL
   ---------------------------------------------------------------------
   Holo3D consumes a model of the shape its own build() returns; ours is
   filled from SURF instead of from the six measured profiles, which are
   thereby retired. Its y axis is up-negative and scaled to the model's
   depth D, so a depth in metres becomes -(m / COLUMN_M) * D.

   Five boundaries, four beds. The upstream module ships six and five --
   its fifth bed is everything below 2 km, which our column does not
   survey. `layers.length` drives the loop and `pts` is one longer, so
   four beds is simply a shorter table.
   ===================================================================== */
const MODEL_W = 740, MODEL_D = 700;
const BEDS = Holo3D.LAYERS.slice(0, 4).map(l => ({ ...l }));
const mk = v => Math.abs(v) >= 1000 ? (v / 1000).toFixed(2) + ' km' : Math.round(v) + ' m';
let model = null;

function BuildModel(){
  BuildHeights();
  const edge = [TOPS[0], TOPS[1], TOPS[2], TOPS[3], COLUMN_M];
  BEDS.forEach((b, k) => { b.range = mk(edge[k]) + ' – ' + mk(edge[k + 1]); });
  const yOf = m => -(m / COLUMN_M) * MODEL_D;
  const pts = SURF.map(d => {
    const g = [];
    for (let i = 0; i <= N; i++){
      g.push([]);
      for (let j = 0; j <= N; j++)
        g[i].push([(i / N - 0.5) * MODEL_W, yOf(d[j * STRIDE + i]), (j / N - 0.5) * MODEL_W]);
    }
    return g;
  });
  /* The HUD samples the ground as a continuous field (the reticle sits on the
     surface at a fractional cell). Bilinear over the same lattice, returned as
     Holo3D's fraction-of-depth so nothing downstream knows the difference. */
  const fields = SURF.map(d => (x, z) => {
    const fx = clamp(x, 0, 1) * N, fz = clamp(z, 0, 1) * N;
    const i0 = Math.min(N - 1, Math.floor(fx)), j0 = Math.min(N - 1, Math.floor(fz));
    const tx = fx - i0, tz = fz - j0;
    const at = (i, j) => d[j * STRIDE + i];
    const a = lerp(at(i0, j0), at(i0 + 1, j0), tx), b = lerp(at(i0, j0 + 1), at(i0 + 1, j0 + 1), tx);
    return lerp(a, b, tz) / COLUMN_M;
  });
  model = { W: MODEL_W, D: MODEL_D, NX: N, NZ: N, pts, fields, layers: BEDS, hits: [], seed: 11 };
  return model;
}

/* THE BLOCK IS DRAWN STRAIGHT INTO THE CONSOLE, not through a cache.
   ---------------------------------------------------------------------
   A cached block layer was tried first and dropped: it buys nothing, because
   the block changes whenever the camera does, and it costs a second canvas.

   MEASURING THIS IS ITS OWN TRAP, and the trap cost an hour. Canvas 2D
   defers rasterisation, so `performance.now()` either side of a draw call
   measures the JS, not the pixels. Timing the frame's steps individually
   produced "the block's blit costs 22 ms and the console's costs 0.04" --
   which is nonsense, and was really one flush landing on whichever call
   happened to force a sync. THE ONLY NUMBER THAT MEANS ANYTHING HERE IS THE
   FRAME INTERVAL. Measured that way, 28 x 28 lattice, 1536 x 1044:

                        dpr 2     dpr 1.5
       block hidden      16.7       16.7      (vsync -- the floor)
       still, full       32.4        --       <-- redrawing a block that
       spinning, full    30.6       24.0          is not moving
       spinning, fast    25.4       19.6

   Two things follow, and both are in the code below. The block is drawn
   only when something has actually changed -- a still console is free, and
   a still console is what this one mostly is. And dpr is capped at 1.5, as
   the dashboard and the Holo3D demo both cap it: the top row costs 6.6
   megapixels a frame to buy a sharpness nobody is looking for on an
   instrument panel.

   What is left is ~20 ms while the camera is actually being dragged, with
   `fast` dropping the scatter and the bloom for the duration. Over budget by
   a fifth, during motion only. Stage 3 adds fog to this and will have to
   look again. */
let blockCtl = null;

/* THE BASE RING, drawn here rather than by the vendored HUD.
   ---------------------------------------------------------------------
   Holo3D's own base ring is clipped INSIDE OUT. It means to clip to
   everything outside the block's convex hull, and writes:

       ctx.beginPath(); ctx.rect(-1e5, -1e5, 2e5, 2e5);
       path(model.hull); ctx.closePath(); ctx.clip('evenodd');

   -- but its `path` helper starts with its own `beginPath()`, which
   throws the enclosing rect away. What survives is the hull alone, so
   the ring is clipped to the INSIDE of the block and draws a dashed arc
   straight across the beds. Visible in the upstream demo too, once you
   know to look.

   Reported rather than patched: holo3d.js stays byte-for-byte vendored
   so re-syncing an upstream revision is a copy. This is the same ring
   with the rect appended to the same path instead of starting a new one. */
function DrawBaseRing(ctx, view) {
  const cam = model.cam; if (!cam || !model.hull) return;
  const s = Math.min(1.4, view.zoom / 0.94);
  const yb = -model.D + model.offY(model.layers.length - 1) - 40, r = model.W * 0.78;
  const ring = a => cam.project([Math.cos(a) * r, yb, Math.sin(a) * r]);
  ctx.save();
  ctx.beginPath();
  ctx.rect(-1e5, -1e5, 2e5, 2e5);
  model.hull.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
  ctx.clip('evenodd');
  const path = pts => { ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); };
  ctx.strokeStyle = 'rgba(95,240,255,0.35)'; ctx.lineWidth = 1.2; ctx.setLineDash([8 * s, 6 * s]);
  path(Array.from({ length: 73 }, (_, i) => ring(i / 72 * TAU))); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(95,240,255,0.5)';
  for (let k = 0; k < 36; k++) {
    const a = k * TAU / 36, r1 = k % 9 === 0 ? 1.1 : 1.04;
    const p = ring(a), q = cam.project([Math.cos(a) * r * r1, yb, Math.sin(a) * r * r1]);
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke();
  }
  ctx.restore();
}
function BlockView() {
  const b = LT.block;
  return { cx: b.cx, cy: b.cy, zoom: b.zoom };
}
function DrawBlock(ctx) { Holo3D.render(ctx, model, blockCtl.state, BlockView()); }

/* =====================================================================
   6. THE TWO CANVASES
   ---------------------------------------------------------------------
   The frame is static between layout and module changes and is cached;
   only the transient panels are drawn every frame. Same pattern the
   dashboard uses, and the same one the block will use in stage 1.
   ===================================================================== */
const CV = document.getElementById('cv'), CTX = CV.getContext('2d');
const CACHE = document.createElement('canvas'), CCTX = CACHE.getContext('2d');
let staticKey = '';

function Resize() {
  const cssW = document.getElementById('wrap').clientWidth || 1536;
  const next = Layout(cssW);
  const changed = next.mode !== LT.mode;
  LT = next; W = LT.W; H = LT.H;
  dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  for (const c of [CV, CACHE]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  if (changed) {
    const pinned = LT.mode === 'desk' ? 1 : 0;
    ui.rack.open = ui.rack.t = pinned;
    ui.sheet.open = ui.sheet.t = pinned;
  }
  staticKey = ''; frameKey = '';
}
let fullBlit = true;                 // the cached console must reach the canvas again
function EnsureStatic() {
  const key = [LT.mode, W, H, ui.module].join('|');
  if (key === staticKey) return;
  staticKey = key; fullBlit = true;
  CCTX.setTransform(dpr, 0, 0, dpr, 0, 0);
  CCTX.clearRect(0, 0, W, H);
  DrawStatic(CCTX);
}
let last = performance.now(), frameKey = '';
/* Everything the live layer's appearance depends on. If none of it moved,
   the canvas already holds the right pixels and the frame is skipped. */
function FrameKey() {
  const st = blockCtl.state;
  return [staticKey, st.yaw.toFixed(4), st.pitch.toFixed(4), st.explode.toFixed(3),
          st.selected, st.fast, ui.rack.t.toFixed(3), ui.sheet.t.toFixed(3)].join('|');
}
function Frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  StepUi(dt);
  blockCtl.tick(now);
  EnsureStatic();
  const fk = FrameKey();
  if (fk === frameKey) { requestAnimationFrame(Frame); return; }
  frameKey = fk;
  /* Only the part of the frame the live layer dirties is restored. Blitting
     the whole cached console every frame is 6.7 megapixels at dpr 2 and it
     was costing more than rendering the block did -- 47.7 ms a frame against
     the block's own 4.3. The live layer is the block, its HUD, and (on the
     phone, while one is moving) a sheet over everything. */
  const c = LT.block.canvas;
  const sheetMoving = LT.mode === 'phone' && (ui.rack.t > 0.002 || ui.sheet.t > 0.002);
  /* The dirty rect is the block and its HUD -- except when the cached console
     itself has just been rebuilt, or a sheet is sliding over everything, in
     which case the whole canvas is restored. Getting this wrong is quiet: the
     parts of the console outside the rect simply never arrive, and a still
     screenshot of the first frame looks fine. */
  const dirty = (fullBlit || sheetMoving)
    ? [0, 0, W, H]
    : [c[0] - 24, c[1] - 24, c[2] - c[0] + 48, c[3] - c[1] + 48];
  fullBlit = false;
  CTX.setTransform(1, 0, 0, 1, 0, 0);
  const D0 = dirty.map(v => Math.round(v * dpr));
  CTX.clearRect(D0[0], D0[1], D0[2], D0[3]);
  CTX.drawImage(CACHE, D0[0], D0[1], D0[2], D0[3], D0[0], D0[1], D0[2], D0[3]);
  CTX.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!window.__blockOff) DrawBlock(CTX);   // __blockOff: the harness's A/B for what the block costs
  // brackets and the base ring only: the reticle belongs to the drill (stage 2)
  // and the callouts to the ruler (stage 5)
  const view = BlockView();
  Holo3D.drawHud(CTX, model, blockCtl.state, view, { reticle: false, callouts: false, base: false });
  DrawBaseRing(CTX, view);
  DrawTransient(CTX);
  requestAnimationFrame(Frame);
}

/* =====================================================================
   7. INPUT
   ===================================================================== */
const inBox = (b, x, y) => b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
function At(e) {
  const r = CV.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}
const InBlock = p => {
  const g = LT.block.grab;
  return p[0] >= g[0] && p[0] <= g[2] && p[1] >= g[1] && p[1] <= g[3]
      && !(LT.mode === 'phone' && (ui.rack.t > 0.02 || ui.sheet.t > 0.02));
};
CV.addEventListener('pointerdown', e => {
  const [x, y] = At(e);
  if (InBlock([x, y])) return;                 // Holo3D's own listener has it
  const b = LT.bar;
  if (inBox(b, x, y)) {
    const i = Math.floor((x - b.x) / (b.w / LT.MODULES.length));
    if (i >= 0 && i < LT.MODULES.length) { ui.module = i; staticKey = ''; }
    return;
  }
  for (const tb of LT.tabs || []) if (inBox(tb, x, y)) {
    const p = ui[tb.key];
    p.open = p.open ? 0 : 1;
    if (p.open) for (const k of ['rack', 'sheet']) if (k !== tb.key) ui[k].open = 0;   // one at a time
    return;
  }
  // a tap on the dimmed ground closes whatever is open
  if (LT.mode === 'phone' && (ui.rack.open || ui.sheet.open)) { ui.rack.open = 0; ui.sheet.open = 0; }
});
window.addEventListener('resize', Resize);

/* the harness reads this rather than guessing at geometry */
window.__L = () => ({ mode: LT.mode, W, H, dpr, module: ui.module,
  block: blockCtl ? { yaw: +blockCtl.state.yaw.toFixed(3), pitch: +blockCtl.state.pitch.toFixed(3),
                      sel: blockCtl.state.selected, explode: +blockCtl.state.explode.toFixed(3),
                      auto: blockCtl.state.auto, lattice: N, beds: model ? model.layers.length : 0,
                      grab: LT.block.grab } : null,
  rack: { open: ui.rack.open, t: +ui.rack.t.toFixed(3) },
  sheet: { open: ui.sheet.open, t: +ui.sheet.t.toFixed(3) },
  rects: { bar: LT.bar, survey: LT.survey, stats: LT.stats, layers: LT.layers,
           log: LT.log, drill: LT.drill, dstats: LT.dstats, drawer: LT.drawer, sheetR: LT.sheet },
  tabs: LT.tabs || [] });
window.__blk = () => blockCtl.state;
window.__lattice = n => { P.lattice = n; BuildModel(); return N; };
window.__model = () => model; window.__view = () => BlockView(); window.__render = Holo3D.render;
/* profiling seams -- each step of the frame, callable on its own */
window.__renderInto = () => DrawBlock(CTX);
window.__blitCache = () => { const c = LT.block.canvas;
  const D = [c[0]-24, c[1]-24, c[2]-c[0]+48, c[3]-c[1]+48].map(v => Math.round(v*dpr));
  CTX.setTransform(1,0,0,1,0,0); CTX.clearRect(D[0],D[1],D[2],D[3]);
  CTX.drawImage(CACHE, D[0],D[1],D[2],D[3], D[0],D[1],D[2],D[3]); };
window.__blitBlock = () => {};
window.__hud = () => { CTX.setTransform(dpr,0,0,dpr,0,0); const v = BlockView();
  Holo3D.drawHud(CTX, model, blockCtl.state, v, { reticle:false, callouts:false, base:false });
  DrawBaseRing(CTX, v); };
window.__bounds = () => model.bounds && model.bounds.map(v => Math.round(v));
/* Does the block still fit the canvas it is rendered into? A block that grows
   past its own buffer is clipped, and a clipped block at an extreme camera is
   exactly the thing a still frame does not show you. */
window.__fits = () => { const c = LT.block.canvas, b = model.bounds;
  return !b ? null : { fits: b[0] >= c[0] && b[1] >= c[1] && b[2] <= c[2] && b[3] <= c[3],
                       bounds: b.map(Math.round), canvas: c }; };

Resize();
BuildModel();
/* Holo3D.setCanvasFactory is the seam a host without `document` uses for the
   two ghost buffers -- and the one the C++ port will use for render targets.
   Wired now, while it costs nothing, rather than discovered at stage 5. */
Holo3D.setCanvasFactory((w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; });
blockCtl = Holo3D.attach(CV, {
  get width(){ return W; }, get height(){ return H; },   // the design size moves with the breakpoint
  inside: InBlock, keys: false,
  hit: p => Holo3D.hit(model, p[0], p[1]),
  // Still until it is touched. The upstream demo idles by turning the block
  // slowly, which is charming on a demo page and wrong on an instrument: it
  // spends a fifth of the frame budget, forever, saying nothing.
  state: { auto: false },
});
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { staticKey = ''; requestAnimationFrame(Frame); });
})();
</script>
</body>
</html>
