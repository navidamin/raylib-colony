      ['C', [0, 0, 1], k => Array.from({ length: NX + 1 }, (_, i) => pts[k][i][NZ])],

    const paintLayer = (ctx, k) => {

  sheet: { open: 1, t: 1 },
};
const OPEN_TAU = 0.085;                         // seconds to 1/e -- a panel, not a sprite
let LT = deskLayout(), dpr = 1, W = 1536, H = 1044;

function StepUi(dt) {
  const k = 1 - Math.exp(-dt / OPEN_TAU);
  for (const p of [ui.rack, ui.sheet]) {
    const want = LT.mode === 'desk' ? 1 : p.open;
    p.t += (want - p.t) * k;
    if (Math.abs(p.t - want) < 0.002) p.t = want;
  }
}

/* =====================================================================

function DrawModuleBar(ctx) {

/* A panel with its title, and nothing in it yet. `hint` names what will be
   here, in the dimmest ink the palette has -- an empty console should say
   which console it is, not pretend to be finished. */
function Shell(ctx, r, name, o = {}) {

/* The two transient panels, drawn live because they move. Each slides off

function DrawTransient(ctx) {
  if (LT.mode === 'desk') return;

function Sheet(ctx, t, r, draw) {
  if (!r || t <= 0.002) return;
  const dx = r.from === 'left' ? -(r.x + r.w) * (1 - t) : 0;
  const dy = r.from === 'top' ? -(r.y + r.h) * (1 - t) : 0;
  ctx.save();
  ctx.fillStyle = `rgba(2,11,19,${0.62 * t})`; ctx.fillRect(0, 0, W, H);   // everything behind it dims

/* =====================================================================
   8. THE GROUND -- generated, not measured
   ---------------------------------------------------------------------
   Ported from layer-block.html, which is the model of record for what the
   ground IS. Holo3D's six measured edge profiles are a LOOK, not a model,
   and they are gone: what feeds the renderer is this.

   Four beds on an N x N lattice. SURF[L][j * STRIDE + i] is the depth in
   METRES of interface L at that node -- 0 is the ground you stand on, 4 is
   the base of the surveyed column, which is a depth somebody chose rather
   than a bed.

   Not here yet, and deliberately: the real LOLA ground (the bench, stage 8).
   The error model IS here -- each interface carries a wrongness that shrinks
   as the confidence at that node rises, which is what makes the beds re-fit
   visibly as holes are drilled.
   ===================================================================== */
const P = {
  lattice: 28,
  relief: 93, feature: 3.5, detail: 3, conform: 0.62, damp: 0.55,
  dip: 67, dipAz: 25, dipSpread: 0.35, grain: 0.25,
  t0: 200, t1: 400, t2: 550, t3: 850,
  crater: 1, craterN: 3, craterSize: 1.0, craterDepth: 90, craterLayer: 0,
  craterRim: 0.34, craterInfill: 0.55,
};
const SEED_SHARED = 0x51ed, SEED_OWN = 0x9e37;
let N = P.lattice, STRIDE = N + 1;
let SURF = [], TOPS = [0, 0, 0, 0], COLUMN_M = 2000;
let EDGE = [0, 0, 0, 0, 2000];   // the five interface depths, in metres

function Mix(a){
  a = a >>> 0;
  a ^= a >>> 16; a = Math.imul(a, 0x7feb352d) >>> 0;
  a ^= a >>> 15; a = Math.imul(a, 0x846ca68b) >>> 0;
  a ^= a >>> 16;
  return a >>> 0;
}
function Hash2(x, y, seed){
  const v = ((Math.imul(x >>> 0, 374761393) >>> 0) +
             (Math.imul(y >>> 0, 668265263) >>> 0) + (seed >>> 0)) >>> 0;
  return Mix(v) / 4294967295.0;
}
const Smooth = t => t * t * (3.0 - 2.0 * t);
/* Value noise on a lattice of `period` cells that WRAPS. */
function ValueNoise(u, v, period, seed){
  const fx = u * period, fy = v * period;
  let x0 = Math.floor(fx), y0 = Math.floor(fy);
  const tx = Smooth(fx - x0), ty = Smooth(fy - y0);
  const x1 = (x0 + 1) % period, y1 = (y0 + 1) % period;
  x0 = ((x0 % period) + period) % period;
  y0 = ((y0 % period) + period) % period;
  const a = Hash2(x0, y0, seed), b = Hash2(x1, y0, seed);
  const c = Hash2(x0, y1, seed), d = Hash2(x1, y1, seed);
  const ab = a + (b - a) * tx, cd = c + (d - c) * tx;
  return ab + (cd - ab) * ty;
}
function Fbm(u, v, basePeriod, octaves, seed){
  let sum = 0.0, amp = 1.0, norm = 0.0, period = basePeriod;
  for (let o = 0; o < octaves; o++){
    sum += ValueNoise(u, v, period, (seed + o * 7919) >>> 0) * amp;
    norm += amp; amp *= 0.5; period *= 2;
  }
  return sum / norm;
}

/* A few small craters, hashed so they are the same every load, and each
   nudged off the middle -- a crater under the sect is not a crater, it is a
   mistake. */
const CRATER_SEED = 0x6d2b;
const CRATERS = [];
function BuildCraters(){
  CRATERS.length = 0;
  const n = Math.round(clamp(P.craterN, 0, 6));
  for (let k = 0; k < n; k++){
    const h = i => Hash2(k * 31 + i, 3, CRATER_SEED);
    let x = 0, y = 0;
    for (let t = 0; t < 14; t++){
      x = 0.10 + h(1 + t * 5) * 0.80;
      y = 0.10 + h(2 + t * 5) * 0.80;
      if (Math.hypot(x - 0.5, y - 0.5) > 0.17) break;
    }
    CRATERS.push({ x, y, r: (0.028 + h(3) * 0.042) * clamp(P.craterSize, 0.2, 3),
                   d: 0.55 + h(4) * 0.9 });
  }
}
/* Summed, so two that overlap merge the way two that overlap would. */
function Bowl(u, v){
  let s = 0;
  for (const c of CRATERS){
    const r = Math.hypot(u - c.x, v - c.y) / Math.max(c.r, 0.006);
    if (r > 2.0) continue;
    const floor = r < 1 ? -(1 - r * r) : 0;
    const rim = P.craterRim * Math.exp(-((r - 1) * (r - 1)) / (2 * 0.20 * 0.20));
    s += (floor + rim) * c.d;
  }
  return s;
}
/* Which interfaces a crater reaches: it was cut into interface k, so below is
   undisturbed and above is the same bowl progressively filled in -- which is
   what "buried crater" means. */
function CraterAmp(L){
  if (!P.crater) return 0;
  const k = P.craterLayer;
  if (L > k) return 0;
  return P.craterDepth * Math.pow(P.craterInfill, k - L);
}

/* How wrong an interface is allowed to be before any of it is known. Scaled by
   the thinner of the two beds it separates, so a thin bed is never given an
   error that would swallow it, and drawn from a fixed hash so the wrongness is
   a property of this block rather than of this frame. Scaled at build time by
   1 - confidence, so an interface is drawn where the drilling says it is and
   drifts back toward its own wrongness wherever the drilling has not reached. */
const ERR_SEED = 0x3c9d;
function ErrParams(L, edge){
  const span = Math.max(2, Math.min(edge[L] - edge[L - 1], edge[L + 1] - edge[L]));
  const h = k => Hash2(L * 37 + k, 11, ERR_SEED);
  const ta = h(2) * 6.2832;
  return {
    bulk: (h(1) - 0.5) * 2 * 0.30 * span,
    tilt: (0.15 + h(3) * 0.45) * span,
    tca: Math.cos(ta), tsa: Math.sin(ta),
    amp: (0.22 + h(4) * 0.30) * span,
    p1: 2 + Math.round(h(5) * 2), p2: 5 + Math.round(h(6) * 4),
    s1: (ERR_SEED + L * 7919) >>> 0, s2: (ERR_SEED + L * 104729 + 17) >>> 0
  };
}
/* =====================================================================
   8b. WHAT THE CONSOLE KNOWS
   ---------------------------------------------------------------------
   Ported whole from layer-block.html, which is where the argument was
   had. A borehole does not light a stripe and it does not illuminate: it
   constrains a MODEL, and a model is one object, so drilling anywhere
   makes every section you can see better. The fog therefore has no shape
   of its own at all --

       fog = 1 - known                 (see KnowAt)

   -- and what it hides is not the truth but the current ESTIMATE of it.

   The surface is the one thing known for free, because you can see it.
   ===================================================================== */
const K_NEAR = 0.68;           // what one hole settles right where it stands
const K_FAR  = 0.15;           // and what it still says from anywhere at all
const K_R    = 9.0;            // cells over which the near term falls away
const K_BELOW = 0.20;          // how much it says about ground it never reached
const K_SKIRT_M = 230;         // over what depth it drops to that
const K_FULL = 0.95;           // fog at 5% is confidence 1: the model stops here
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a || 1e-6), 0, 1); return t * t * (3 - 2 * t); };

/* Holes multiply their MISSES, not their hits:

       miss = product of (1 - k_n)        known = 1 - miss

   which is what makes three mediocre holes worth more than one good one,
   and what stops any single hole ever settling the block on its own.

   Depth is the one hard edge. A hole that stopped at 300 m has seen
   nothing at 1 km, so its weight decays to a fifth below its own bottom
   -- a fifth and not zero, because beds continue, and that is an
   inference the panel is entitled to make. */
function KnowAt(i, j, m){
  let miss = 1;
  for (let n = 0; n < reveals.length; n++){
    const h = reveals[n];
    const dx = i - h.i, dy = j - h.j;
    const u = (dx * dx + dy * dy) / (K_R * K_R);
    const near = K_NEAR * Math.exp(-u * 0.72);
    const dep = lerp(1, K_BELOW, smoothstep(h.m, h.m + K_SKIRT_M, m));
    miss *= 1 - Math.min((near + K_FAR) * dep, 0.985);
  }
  return 1 - miss;
}
/* Confidence is knowledge, rescaled so that the last 5% of fog is not worth
   arguing about: once the fog is that thin the model is called settled and
   stops moving. Without a ceiling the interfaces would keep creeping for ever
   by amounts too small to see and too large to ignore. */
const Confidence = k => clamp(k / K_FULL, 0, 1);

/* DELINEATION -- the one number for "how well is this block known". Mean
   confidence over the block's VOLUME, on a coarse grid, in exactly the units
   the fog is drawn from, so the bar and the picture can never disagree.

   The tiers are the industry's own and worth borrowing whole: a resource is
   INFERRED while its shape is a guess, INDICATED once drilling constrains it,
   and MEASURED only when the drilling is dense enough to bet on. About seven
   well-spread full-depth holes clear 95%; a 3x3 grid reaches 99.8%; shallow
   holes alone plateau, which is correct, since nothing has been established
   about the bottom half of the column.

   The gate it feeds -- isolate, which is a MEASURED-only act -- is stage 5.
   What it does HERE is tell the frame whether the cage is still crawling. */
const DELIN_GATE = 0.95;
let DELIN = 0, delinRev = -1;
function Delineation(){
  if (delinRev === revealRev) return DELIN;
  delinRev = revealRev;
  if (!reveals.length){ DELIN = 0; return 0; }
  let sum = 0, n = 0;
  for (let a = 0; a <= 8; a++)
    for (let b = 0; b <= 8; b++)
      for (let d = 0; d < 7; d++){
        sum += Confidence(KnowAt(a / 8 * N, b / 8 * N, (d + 0.5) / 7 * COLUMN_M));
        n++;
      }
  DELIN = sum / n;
  return DELIN;
}
const DelinTier = () => DELIN >= DELIN_GATE ? 'MEASURED'
                      : DELIN >= 0.40 ? 'INDICATED' : 'INFERRED';

/* The two readings the renderer actually takes, each at the depth the thing
   being drawn is a picture of: an interface at its own depth, a bed's wall at
   the middle of the bed. Interface 0 is the ground you are standing on. */
const IfaceKnow = (k, i, j) => k === 0 ? 1 : Confidence(KnowAt(i, j, EDGE[k]));
const BedKnow = (k, i, j) => Confidence(KnowAt(i, j, (EDGE[k] + EDGE[k + 1]) * 0.5));

function BuildHeights(){
  N = Math.max(4, Math.round(P.lattice)); STRIDE = N + 1;
  BuildCraters();
  TOPS = [0, P.t0, P.t0 + P.t1, P.t0 + P.t1 + P.t2];
  COLUMN_M = TOPS[3] + P.t3;
  const edge = [TOPS[0], TOPS[1], TOPS[2], TOPS[3], COLUMN_M];
  EDGE = edge;

  const az = P.dipAz * Math.PI / 180, ca = Math.cos(az), sa = Math.sin(az);
  const period = Math.max(1, Math.round(P.feature));
  const oct = Math.max(1, Math.round(P.detail));
  const ky = 1 - 0.85 * P.grain;               // squash the noise domain: mottle becomes ridges

  SURF = [];
  for (let L = 0; L <= 4; L++){
    const d = new Float32Array(STRIDE * STRIDE);
    const amp = P.relief * Math.pow(P.damp, L);
    /* Topography is a surface fact. Beds inherit some of it near the top and
       less with depth; the BASE inherits none -- letting the terrain warp it
       turns a block diagram into a drape. */
    const realW = L === 4 ? 0 : 1;
    const dip = P.dip * (1 + P.dipSpread * L);
    const cr  = CraterAmp(L);
    const ep = (L >= 1 && L <= 3) ? ErrParams(L, edge) : null;
    for (let j = 0; j <= N; j++)
      for (let i = 0; i <= N; i++){
        const u = i / N, v = j / N, vv = 0.5 + (v - 0.5) * ky;
        const shared = (Fbm(u, vv, period, oct, SEED_SHARED) - 0.5) * realW;
        const own    = Fbm(u, vv, period, oct, (SEED_OWN + L * 7919) >>> 0) - 0.5;
        let h = amp * 2 * (P.conform * shared + (1 - P.conform) * own);
        h += dip * ((u - 0.5) * ca + (v - 0.5) * sa);
        if (cr !== 0) h += cr * Bowl(u, v);
        let z = edge[L] - h;                   // h is up-positive, z is depth
        if (ep){
          const e = ep.bulk
                  + ep.tilt * ((u - 0.5) * ep.tca + (v - 0.5) * ep.tsa)
                  + ep.amp * ((Fbm(u, v, ep.p1, 2, ep.s1) - 0.5) * 1.30
                            + (Fbm(u, v, ep.p2, 2, ep.s2) - 0.5) * 0.70);
          z += e * (1 - Confidence(KnowAt(i, j, edge[L])));
        }
        d[j * STRIDE + i] = z;
      }
    SURF.push(d);
  }
  /* Denudation. The scour is not a decal on the surface, it is the surface:
     a bowl driven into interface 0 with the spoil heaped in a ring outside it.
     Because it deforms the height field the block already draws, the shading,
     the silhouette and the walls all pick it up for free. */
  if (holes.length){
    const d0 = SURF[0];
    for (const h of holes){
      if (h.k <= 0.001) continue;
      for (let j = 0; j <= N; j++)
        for (let i = 0; i <= N; i++){
          const dd = Math.hypot(i - h.i, j - h.j);
          if (dd > SCOUR_R * 2.1) continue;
          const u = dd / SCOUR_R;
          const bowl = u < 1 ? (1 - u * u) * (1 - u * u) : 0;
          const sg = (dd - SCOUR_R * 1.25) / (SCOUR_R * 0.62);
          const ring = Math.exp(-sg * sg * 0.5);
          d0[j * STRIDE + i] += (bowl * SCOUR_DEEP_M - ring * SCOUR_RIM_M) * h.k;
        }
    }
  }

  /* No interface may pass through the one below it. A deep crater bottoming
     out on a harder unit is the interesting case this keeps legal: the floor
     flattens against the bed beneath instead of turning the block inside out. */
  for (let L = 1; L <= 4; L++){
    const above = SURF[L - 1], here = SURF[L];
    const minTh = Math.max(0.4, (edge[L] - edge[L - 1]) * 0.12);
    for (let k = 0; k < here.length; k++) here[k] = Math.max(here[k], above[k] + minTh);
  }
}

/* =====================================================================
   9. THE BLOCK IN THE PANEL
   ---------------------------------------------------------------------
   Holo3D consumes a model of the shape its own build() returns; ours is
   filled from SURF instead of from the six measured profiles, which are
   thereby retired. Its y axis is up-negative and scaled to the model's
   depth D, so a depth in metres becomes -(m / COLUMN_M) * D.

   Five boundaries, four beds. The upstream module ships six and five --
   its fifth bed is everything below 2 km, which our column does not
   survey. `layers.length` drives the loop and `pts` is one longer, so
   four beds is simply a shorter table.
   ===================================================================== */
const MODEL_W = 740, MODEL_D = 700;
const BEDS = Holo3D.LAYERS.slice(0, 4).map(l => ({ ...l }));
const mk = v => Math.abs(v) >= 1000 ? (v / 1000).toFixed(2) + ' km' : Math.round(v) + ' m';
let model = null;

function BuildModel(){
  BuildHeights();
  const edge = [TOPS[0], TOPS[1], TOPS[2], TOPS[3], COLUMN_M];

  if (!model._buf || model._buf[0].canvas.width !== w || model._buf[0].canvas.height !== h) {
    const mk2 = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c.getContext('2d'); };
    model._buf = [mk2(), mk2()];
  }
  const t = ctx.getTransform ? ctx.getTransform() : null;
  model._buf.forEach(g => { if (t) g.setTransform(t.a, t.b, t.c, t.d, t.e, t.f); else g.setTransform(1, 0, 0, 1, 0, 0); });
  return model._buf;
}

/* =====================================================================
   9c. THE WIRE CAGE -- what is drawn where nothing has been measured
   ---------------------------------------------------------------------
   Unknown volume gets no fill and no boundaries. What is left is the grid
   the instrument works ON: a column line every few lattice nodes, a depth
   ring every 250 m, and a slow crawl through the rings, so an undrilled
   block reads as LIVE BUT UNRESOLVED rather than as a page that failed to
   load. The surface stays where it is, because you can see the ground.

   Its alpha is exactly 1 - confidence, so it retreats from the parts of
   the block that have been drilled and is gone by the time the block is
   called MEASURED. And it fades out with explode: the cage is the shape
   of one solid volume, and a block taken apart is not one.
   ===================================================================== */
const CAGE_STEP = 4;         // lattice nodes between column lines
const CAGE_RING_M = 250;     // metres between depth rings
const CAGE_A = 0.30;
let crawlT = 0;
function DrawCage(ctx, cam) {
  const e = blockCtl.state.explode || 0;
  const fade = 1 - Math.min(1, e * 1.6);
  if (fade <= 0.01 || !model) return;
  const { NX, NZ, pts } = model;
  const WALLS = BlockWalls(NX, NZ);
  const yOf = m => -(m / COLUMN_M) * MODEL_D;
  const proj = p => cam.project(p);
  const ticks = [];
  for (let t = 0; t <= NX; t += CAGE_STEP) ticks.push(t);
  if (ticks[ticks.length - 1] !== NX) ticks.push(NX);
  ctx.save(); ctx.lineCap = 'round'; ctx.lineWidth = 1;
  WALLS.forEach(([name, n, NT, node]) => {
    if (!cam.facing(n)) return;
    const tk = ticks.filter(t => t <= NT);
    if (tk[tk.length - 1] !== NT) tk.push(NT);
    // columns: from the ground you can see down to the base of the survey
    for (const t of tk) {
      const [i, j] = node(t), p = pts[0][i][j];
      const a = CAGE_A * fade * (1 - Confidence(KnowAt(i, j, COLUMN_M * 0.5)));
      if (a <= 0.006) continue;
      const b = proj([p[0], yOf(COLUMN_M), p[2]]);
      ctx.strokeStyle = `rgba(110,190,225,${a})`;
      ctx.beginPath(); const q = proj(p); ctx.moveTo(q[0], q[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
    // rings: one crawling wave of depth, the cheapest honest sign of life
    for (let m = CAGE_RING_M; m <= COLUMN_M + 1; m += CAGE_RING_M) {
      const y = yOf(Math.min(m, COLUMN_M));
      const w = 0.55 + 0.45 * Math.sin(m / 170 - crawlT * 1.6);
      for (let s = 0; s < tk.length - 1; s++) {
        const [i0, j0] = node(tk[s]), [i1, j1] = node(tk[s + 1]);
        const a = CAGE_A * fade * w * (1 - Confidence(KnowAt((i0 + i1) / 2, (j0 + j1) / 2, m)));
        if (a <= 0.006) continue;
        const p = proj([pts[0][i0][j0][0], y, pts[0][i0][j0][2]]);
        const q = proj([pts[0][i1][j1][0], y, pts[0][i1][j1][2]]);
        ctx.strokeStyle = `rgba(110,190,225,${a})`;
        ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke();
      }
    }
  });
  ctx.restore();
}

function DrawBlock(ctx) {
  const view = BlockView(), cam = Holo3D.camera(blockCtl.state, view);
  DrawCage(ctx, cam);                // behind the beds: it is what they are drawn ON
  RenderBlock(ctx, model, blockCtl.state, view);
}

/* =====================================================================
   10. THE DRILL
   ---------------------------------------------------------------------
   Ported from layer-block.html and KEPT: the glyph, the cursor, the
   planted rig, the cycle, the spatter, the bore markers. The design is
   settled (design doc section 5) and this stage does not restyle any of
   it -- it makes it work on a camera that can pitch.

   THE ONE THING THAT MATTERED, settled by arithmetic before any of it
   was written. The drill is not a 3D object; it is a 2D drawing that
   stands vertically in screen space at a projected point. That was safe
   under a fixed isometric camera because world-vertical landed on
   screen-vertical. Under Holo3D's camera:

       h       = p.x*f0 + p.z*f1
       screenX = (p.x*r0 + p.z*r1) * zoom + cx          <- no p.y term
       screenY = (-(p.y - centerY)*cp - h*sp) * zoom + cy

   Two points differing only in world height share `h`, so they share
   screenX exactly, and their screenY differs by -dy*cos(pitch)*zoom. A
   vertical world segment projects to a vertical screen segment at every
   yaw and every pitch. THE RIG STAYS UPRIGHT AND IS NOT REDRAWN. It only
   foreshortens.

   So what this stage actually is:

     * PX_PER_M stops being a lever and becomes a reading of the camera,
       recomputed each frame. Every consumer -- SpudM, the sink travel,
       the spatter's unit split -- is untouched, because it stays a
       variable rather than becoming a function call.
     * The rig's SIZE does not follow pitch, only its travel. It is
       pixel art on a whole-pixel grid and cos(pitch) would mush it.
     * Placing a hole is an inverse projection onto the top surface,
       where it used to be a lattice hit in a fixed iso.
   ===================================================================== */

/* The names the ported drill expects, supplied rather than rewritten.
   Its dark outline is Dark Plating's near-black; on the console's navy it
   still reads as an outline, which is all it was ever doing. */
const OUT = "#0a0e14";
const CY = [80, 225, 255], AMBER = [244, 198, 106];   // G_STANDBY comes with the glyph
const rgb = (c, a) => a === undefined ? `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`
                                      : `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const scalec = (c, f) => [Math.min(255, c[0] * f), Math.min(255, c[1] * f), Math.min(255, c[2] * f)];
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const st = { t: 0, vx: -1, vy: -1, mx: -1, my: -1, depth: 0, sel: -1 };
const drill = { armed: 0, mode: "aim", t: 0, phase: 0, i: 0, j: 0,
                spud: 0, sink: 0, feed: 0, fade: 0, depthM: 0, curM: 0,
                cutT: 1, sink0: 0, canPlace: 0, onCanvas: 0 };
const holes = [];              // {i, j, k} -- k is how far the scour has got
const bores = [];              // {i, j, m} -- finished holes, and how deep
const spatter = [];            // ejecta, in lattice units with a height in m
/* The rig is an instrument symbol, not a scale model -- at 6 km across, a
   drill drawn true would be invisible. But it must not tower over the block
   either, or it takes the scale away again. */
const DRILL_S = 0.78;
const SCOUR_R = 1.5;          // scour radius, lattice cells -- about 320 m
const SCOUR_DEEP_M = 45;      // how far the bowl is driven down, metres
const SCOUR_RIM_M = 18;       // how high the spoil rim stands, metres
const EJECTA_G_PX = 300;      // ejecta gravity, screen px/s^2
const SPUD_T = 0.85, OUT_T = 0.9, HOLD_T = 1.0, FADE_T = 0.3;
const reveals = [];            // {i, j, m} -- what stage 3 re-fits the model on
let revealRev = 0, grainSeed = 1, lockFlash = 0;

/* PIXELS PER METRE OF DEPTH, read off the camera.
   A point at depth m sits at model y = -(m/COLUMN_M)*D, and screenY carries
   -y*cos(pitch)*zoom, so d(screenY)/dm is exactly this. It was a slider; it
   is now a consequence, and it changes every time the camera does. */
let PX_PER_M = 0.2, TX = 6;
function ReadCamera() {
  const cam = model && model.cam; if (!cam) return;
  PX_PER_M = MODEL_D * cam.cp * cam.zoom / Math.max(COLUMN_M, 1);
  TX = MODEL_W / N * cam.zoom;          // one lattice cell across, in screen px
}
/* A lattice node at a depth, projected. The drill asks for this the way it
   used to ask SPX/SPY, so every call site is unchanged. */
function Proj(i, j, m) {
  return model.cam.project([(i / N - 0.5) * MODEL_W,
                            -(m / COLUMN_M) * MODEL_D + model.offY(0),
                            (j / N - 0.5) * MODEL_W]);
}
function BedColour(m) {
  let k = 0; const e = [TOPS[1], TOPS[2], TOPS[3]];
  while (k < 3 && m > e[k]) k++;
  return hex2rgb(model.layers[k].neon);
}
const CLIP_TOP = () => LT.block.canvas[1] - 40;
/* The ported crumbs and the spatter want the rock's own colour and the old
   panel's texture gain and grain PRNG. On the console the beds ARE the
   palette, so the surface bed's neon stands in for the regolith tone, the
   gain is 1 (there is no texture lever to read) and the PRNG comes across
   verbatim so a hole's grain is the same grain every frame rather than
   boiling. */
const ROCK_COL = [hex2rgb(Holo3D.LAYERS[0].neon)];
const TexGain = () => 1;
const P_TEX = 0;
function rnd(){ grainSeed = (grainSeed * 16807) % 2147483647; return grainSeed / 2147483647; }

/* WHERE THE POINTER IS ON THE GROUND -- a ray march, not an iteration.
   ---------------------------------------------------------------------
   Screen x and y give two equations and the unknown third is the surface's
   own height, which depends on where you land. The obvious answer -- guess a
   height, solve, resample, repeat -- WORKS AT STEEP PITCH AND DIVERGES AT
   SHALLOW, and it took a render to notice because it fails silently by
   clamping to the block's edge. The amplification per pass is cot(pitch):
   0.36 at pitch 1.2, 2.1 at 0.45, 4.9 at 0.2. Above about 45 degrees the
   iteration contracts; below it, it runs away.

   So the honest thing, which has no such regime. Every world point that
   projects to (sx, sy) lies on one line. Writing `a` for the across-screen
   coordinate and `h` for depth along the view axis, both fixed by the
   projection:

       a = (sx - cx)/zoom = x*r0 + z*r1          -- constant along the ray
       y*cp + h*sp = -(sy - cy)/zoom             -- so y is a function of h

   and [r, f] is orthonormal (r = [f1, -f0]), so (x, z) comes straight back
   from (a, h) by the transpose. March h from near to far, find the first
   place the ray crosses the height field, bisect it. First crossing, not
   nearest: at a grazing camera a ray really can cross the terrain more than
   once, and the one you mean is the one in front. */
function PickGround(sx, sy) {
  const cam = model.cam; if (!cam) return null;
  const v = BlockView(), cy0 = v.centerY == null ? -MODEL_D / 2 : v.centerY;
  const a = (sx - v.cx) / v.zoom, B = -(sy - v.cy) / v.zoom;
  const off = model.offY(0), R = MODEL_W * 0.78;      // the block's half-diagonal, generously
  const at = h => {
    const x =  a * cam.f[1] + h * cam.f[0];
    const z = -a * cam.f[0] + h * cam.f[1];
    const u = x / MODEL_W + 0.5, w = z / MODEL_W + 0.5;
    const inside = u >= -1e-9 && u <= 1 + 1e-9 && w >= -1e-9 && w <= 1 + 1e-9;
    if (!inside) return { u, w, inside };
    const yRay = (B - h * cam.sp) / cam.cp;
    const ySurf = -model.fields[0](u, w) * MODEL_D + off - cy0;
    return { u, w, inside, d: yRay - ySurf };
  };
  const STEPS = 80;
  let prev = null, lo = null, hi = null;
  for (let k = 0; k <= STEPS; k++) {
    const h = -R + 2 * R * k / STEPS, q = at(h);
    if (!q.inside) { prev = null; continue; }
    if (Math.abs(q.d) < 1e-9) { lo = hi = h; break; }
    if (prev && (prev.q.d < 0) !== (q.d < 0)) { lo = prev.h; hi = h; break; }
    prev = { h, q };
  }
  if (lo === null) {
    // the ray never meets the cap: off the block, or looking at it edge-on
    const q = at(0);
    return { i: clamp(Math.round(q.u * N), 0, N), j: clamp(Math.round(q.w * N), 0, N),
             u: q.u, w: q.w, on: false };
  }
  for (let k = 0; k < 22; k++) {                     // bisect to well under a cell
    const m = (lo + hi) / 2, q = at(m);
    if (!q.inside) break;
    const s0 = at(lo);
    if ((s0.d < 0) !== (q.d < 0)) hi = m; else lo = m;
  }
  const q = at((lo + hi) / 2);
  return { i: clamp(Math.round(q.u * N), 0, N), j: clamp(Math.round(q.w * N), 0, N),
           u: q.u, w: q.w, on: !!q.inside };
}
/* Can the rig stand where the pointer is? On the cap, with the stack closed:
   a bed held out on its own is a reading posture, and drilling into an
   exploded model would be drilling into a diagram of the ground rather than
   the ground. */
function CanPlace() {
  if (st.mx < 0 || !InBlock([st.vx, st.vy])) return false;
  if (blockCtl.state.selected >= 0) return false;
  const c = PickGround(st.vx, st.vy);
  return !!c && c.on;
}

/* =====================================================================
   THE DRILL GLYPH -- the dock icon and the cursor, one sprite
   ---------------------------------------------------------------------
   Transcribed from the reference rather than approximated. The bit was
   sampled off the artwork at HALF-UNIT resolution and is stored as the
   character grid below -- `L` light steel, `m` mid steel, `.` nothing --
   so the shape is the artwork's shape and not my reading of it. The rest
   of the glyph is measured off the same image in whole units:

     tip           the anchor, and the centre of the ground ring
     ring          15u x 7u ellipse, dashed, open across the top 120 deg
     bit           6.5u tall, three tapering screw bands, from the grid
     marker box    3u square, 1u stroke, bottom 7.25u above the tip
     dashes        five, 1u, on a 2u pitch, from 11u to 20u

   The unit must stay a whole number of pixels or the cells land on
   fractions and the pixel art turns to mush, which is the one thing this
   style cannot survive. u = 4 fixes the glyph at 60 px wide -- and that,
   not a percentage, is what sets the dock size below.
   ===================================================================== */
const GLY_U = 4, GLY_H = GLY_U * 0.5;
const GLY_W = 15 * GLY_U;                      // the ring, and so the icon
const G_LIGHT = "#fafafa", G_MID = "#8595ac", G_DARK = "#4a566b";
/* The tool's standby colour: the cyan's own sibling, hue swung from 192 to
   150 with the saturation and lightness held (100%, 66%), so a rig that is
   standing and a rig that is cutting read as one machine in two states rather
   than as two colours borrowed from elsewhere. Deliberately NOT the panel's
   amber: amber here means "this control wants you", and it is the borehole
   bar that wants you while the rig waits -- a rig wearing it too would be two
   things asking at once. */
const G_STANDBY = [82, 255, 168];
const G_BAD = [226, 96, 78], G_BADDIM = [138, 78, 68];
const BIT_ROWS = [
  "...mLm.....", "...mLm.....", "..mmLm.....", "..LLLmmm...",
  "..LLLLmm...", "...mm......", ".mmmLm.....", "mLLLLmmmm..",
  ".LLLLLmm...", "..mmmm.....", ".mmmmmm....", "mLLLLLmmm..",
  "mLLLLLmmm.."
];
const BIT_AX = 4;                              // the axis column in that grid

/* THE OTHER FOUR TOOLS, on the same grid, in the same two tones, read bottom
   up: r0 is the row that touches the ground and the last row is the one the
   marker box sits over. Each has to say what it DOES from its silhouette
   alone at 22 px wide, so each keeps exactly one idea:

     seismic       a mass over a plate -- a thing that hits the ground
     rover         a body on wheels -- a thing that drives across it
     penetrometer  a needle with a load collar -- a thing pushed into it
     gpr           a sled with a radiating face -- a thing towed over it

   All four end in the same three-cell stem so the lead line meets a shaft
   rather than a corner, exactly as the drill does. */
const SEIS_ROWS = [
  "mmmmmmmmm..", "mLLLLLLLm..", "...mLm.....", "...mLm.....",
  ".mmmmmmm...", "mLLLLLLLm..", "mLLLLLLLm..", "mLLLLLLLm..",
  ".mmmmmmm...", "...mLm.....", "...mLm.....", "...mLm.....",
  "...mLm....."
];
const ROVER_ROWS = [
  "mm.mmm.mm..", "LL.LLL.LL..", "mmmmmmmmm..", "mLLLLLLLm..",
  "mLLLLLLLm..", ".mmLLLmm...", "..mLLLm....", "..mLLLm....",
  "...mLm.....", "...mLm.....", "...mLm.....", "...mLm.....",
  "...mLm....."
];
const PEN_ROWS = [
  "....L......", "...mLm.....", "...mLm.....", "..mLLm.....",
  "..mLLm.....", "..mLLm.....", "..mLLm.....", ".mLLLm.....",
  "mmLLLmm....", "mLLLLLmm...", "mmLLLmm....", "..mLLm.....",
  "..mLLm....."
];
const GPR_ROWS = [
  "L.L.L.L.L..", "mmmmmmmmm..", "mLLLLLLLm..", "mLLLLLLLm..",
  ".mmmmmmm...", "...mLm.....", "...mLm.....", "..mLLLm....",
  "..mLLLm....", "...mLm.....", "...mLm.....", "...mLm.....",
  "...mLm....."
];
/* The sprite's own top row IS a cross-section of the string: mid, light, mid,
   three cells across. So the rig's shaft is not a second drawing of a rod --
   it is this row, continued upward for as far as there is string. */
const SHAFT_ROW = BIT_ROWS[0];

/* The bit itself, cell by cell, tip at (X, Y) and growing upward. Shared: the
   dock icon, the cursor and the planted rig all draw THIS, which is the whole
   point -- the machine you pick up has to be the machine that goes in.

   Its SILHOUETTE never moves; only the tones cycle through it, one cell at a
   time, leftwards. Shifting the sprite itself would slide the tool sideways;
   shifting the shading inside a fixed outline is a helix turning under a
   stationary flute, which is the thing being drawn. */
function DrawBitSprite(X, Y, shift, rows){
  const h = GLY_H;
  rows = rows || BIT_ROWS;
  for (let r = 0; r < rows.length; r++){
    const row = rows[r], y = Y - (r + 1) * h;
    const at = [];
    for (let c = 0; c < row.length; c++) if (row.charAt(c) !== ".") at.push(c);
    if (!at.length) continue;
    for (let n = 0; n < at.length; n++){
      const src = row.charAt(at[(n + shift % at.length + at.length) % at.length]);
      CTX.fillStyle = src === "L" ? G_LIGHT : G_MID;
      CTX.fillRect(Math.round(X + (at[n] - BIT_AX) * h), Math.round(y), h, h);
    }
  }
}
/* One length of string, in the sprite's own three columns. */
function DrawShaft(X, y0, y1){
  if (y1 - y0 < 1) return;
  const h = GLY_H, top = Math.round(y0), ht = Math.round(y1) - top;
  CTX.fillStyle = OUT;
  CTX.fillRect(Math.round(X - h) - 1, top, h * 3 + 2, ht);
  for (let c = 0; c < SHAFT_ROW.length; c++){
    const ch = SHAFT_ROW.charAt(c);
    if (ch === ".") continue;
    CTX.fillStyle = ch === "L" ? G_LIGHT : G_MID;
    CTX.fillRect(Math.round(X + (c - BIT_AX) * h), top, h, ht);
  }
}

/* THE GLYPH RUNNING. Three motions, and all three are quantised to whole
   pixels or whole cells -- a pixel sprite that eases through fractions is a
   smooth sprite with a pixel texture, which is the failure this style cannot
   survive. So the pulses step, the shading steps, and the ring steps.

     lead        the dots swell in turn, top down, and the marker box last:
                 energy running DOWN the line into the tool
     shading     the bit's tones cycle left through the sprite while its
                 silhouette stays put -- a helix turning, not a shape moving
     ring        dashes travel round the full ellipse and vanish into the gap
                 behind the bit, which is what sells it as a ring and not an arc

   All three run anticlockwise, and they run whenever the tool is out.

   `t` is the animation clock; pass a negative number for the still version.

   mode: "idle" | "hover" | "bad". Everything lands on whole pixels. */
const GLY_DASHES = 2;      // the live states in the reference show two, not the
                           // five on the spec sheet -- and two is what keeps the
                           // cursor within a tenth of the button it came out of
/* THE GROUND RING. Open across the top, where the bit stands: the reference
   leaves a gap there, and that gap is what stops the ring reading as a plate
   the bit is stuck through. Measured at 70 degrees, not the 120 it looks --
   the artwork's topmost dashes sit about 31 degrees either side of the top.

   Drawn as separate AXIS-ALIGNED rectangles, not as a dashed stroke. A dashed
   ellipse gives segments rotated to the tangent, and rotated segments are the
   one thing pixel art never has -- they read as smooth vector art wearing a
   pixel costume. Each dash instead takes its width and height from the local
   tangent, so it comes out wide and flat where the curve runs horizontal and
   tall where it runs vertical, exactly as the artwork does it.

   Round the WHOLE ellipse, skipping whatever falls in the gap. Rotating an arc
   would slide its two ends about; rotating a full ring and letting the dashes
   disappear behind the bit is what a turning ring actually does. Anticlockwise
   on screen is DECREASING canvas angle, y being down.

   Shared with the planted rig, which stands in one of these too. */
function DrawGlyphRing(X, Y, spin, col, u){
  const rx = 7 * u, ry = 3.2 * u, GAP = 35 * Math.PI / 180, NR = 16;
  CTX.fillStyle = col;
  for (let k = 0; k < NR; k++){
    let a = (k / NR) * 6.2832 + spin;
    a = ((a + Math.PI) % 6.2832 + 6.2832) % 6.2832 - Math.PI;   // to (-pi, pi]
    if (Math.abs(a + Math.PI / 2) < GAP) continue;              // behind the bit
    const px = X + rx * Math.cos(a), py = Y + ry * Math.sin(a);
    const tx = -rx * Math.sin(a), ty = ry * Math.cos(a);
    const m = Math.max(Math.hypot(tx, ty), 1e-6), len = u * 1.5;
    const dw = Math.max(u, Math.abs(tx) / m * len);
    const dh = Math.max(u, Math.abs(ty) / m * len);
    CTX.fillRect(Math.round(px - dw * 0.5), Math.round(py - dh * 0.5),
                 Math.round(dw), Math.round(dh));
  }
}
/* THE TRAVERSE. What a LINE tool stands on, where a point tool stands in a
   ring. Same dashes, same unit, same colour; a straight run instead of a
   closed one, thinning toward both ends so it reads as going somewhere rather
   than as a fence. The dashes travel along it, which is the whole difference
   between a tool you put down and a tool you drag. */
function DrawGlyphTrack(X, Y, phase, col, u){
  const half = 7 * u, step = 2 * u;
  const off = (((phase * step) % step) + step) % step;
  CTX.fillStyle = col;
  for (let px = X - half + off; px <= X + half; px += step){
    const d = Math.abs(px - X);
    if (d < u * 1.2) continue;                           // under the tool
    const hgt = Math.max(2, Math.round(u * (0.4 + 0.6 * (1 - d / half))));
    CTX.fillRect(Math.round(px - u * 0.5), Math.round(Y - hgt * 0.5), u, hgt);
  }
}
/* One glyph for every tool. `spec` names the sprite and which ground mark it
   stands on; leave it out and it is the drill, which is what every existing
   call site means. */
const GLYPH_DRILL = { rows: BIT_ROWS, mark: "ring" };
function DrawDrillGlyph(cx, tipY, mode, t, spec){
  const u = GLY_U, h = GLY_H;
  const run = t >= 0;
  spec = spec || GLYPH_DRILL;
  /* One three-beat cycle: upper dot, lower dot, box. Quantised to whole
     pixels -- the swell is 0 or 2 px, never 1.37. */
  const CYC = 0.85;
  const ph = run ? (t % CYC) / CYC : -1;
  const beat = ph < 0 ? -1 : Math.floor(ph * (GLY_DASHES + 1));
  const swell = ph < 0 ? 0 : Math.sin((ph * (GLY_DASHES + 1) - beat) * Math.PI);
  const grow = (base, amt, on) =>
    base + (on ? Math.round(swell * amt * base * 0.5) * 2 : 0);
  const bad = mode === "bad", lit = mode === "hover";
  const col = bad ? G_BAD : CY;
  const X = Math.round(cx), Y = Math.round(tipY);
  const R = (x, y, w, ht, f) => { CTX.fillStyle = f;
    CTX.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(ht)); };

  CTX.save();
  if (lit){ CTX.shadowColor = rgb(CY, 0.75); CTX.shadowBlur = 9; }

  const markCol = rgb(bad ? G_BADDIM : CY, 0.95);
  if (spec.mark === "line") DrawGlyphTrack(X, Y, run ? t * 1.1 : 0, markCol, u);
  else DrawGlyphRing(X, Y, run ? -t * 1.9 : 0, markCol, u);

  // The business end. Absent when the spot is refused -- the reference shows
  // no tool at all on an invalid position, which says "not here" far faster
  // than a tool wearing a warning colour.
  if (!bad) DrawBitSprite(X, Y, run ? Math.floor(t * 9) : 0, spec.rows);

  // The marker: a hollow box, or an X where the ground is refused.
  const boxS = grow(3 * u, 0.20, beat === GLY_DASHES);
  const bx = X - boxS * 0.5, by = Y - 10.25 * u - (boxS - 3 * u) * 0.5;
  if (bad){
    CTX.strokeStyle = rgb(G_BAD, 1); CTX.lineWidth = u; CTX.lineCap = "butt";
    CTX.beginPath();
    CTX.moveTo(bx + u * 0.5, by + u * 0.5); CTX.lineTo(bx + u * 2.5, by + u * 2.5);
    CTX.moveTo(bx + u * 2.5, by + u * 0.5); CTX.lineTo(bx + u * 0.5, by + u * 2.5);
    CTX.stroke();
  } else {
    const st2 = Math.round(boxS / 3), hole = boxS - 2 * st2;
    R(bx, by, boxS, st2, rgb(col));
    R(bx, by + st2 + hole, boxS, st2, rgb(col));
    R(bx, by + st2, st2, hole, rgb(col));
    R(bx + st2 + hole, by + st2, st2, hole, rgb(col));
  }

  /* The lead line. The swell runs top down and finishes on the box, so the
     line reads as feeding the tool rather than as decoration. */
  for (let k = 0; k < GLY_DASHES; k++){
    const d = grow(u, 0.40, beat === GLY_DASHES - 1 - k);
    R(X - d * 0.5, Y - (12 + 2 * k) * u - (d - u) * 0.5, d, d, rgb(col));
  }
  if (bad)
    for (let k = 0; k < 3; k++)
      R(X - h, Y - (2.2 + 1.7 * k) * u, u, u, rgb(G_BAD, 0.9));
  CTX.restore();
}

/* =====================================================================
   9b. THE DRILL RIG, THE DOCK, AND THE SPATTER
   ---------------------------------------------------------------------
   The rig is drawn side-on in screen space, not projected: in this iso
   the world's vertical axis IS screen vertical, so a vertical drill is a
   vertical drawing.

   IT IS THE CURSOR, PLANTED. Not a rig drawn in the cursor's spirit --
   the same bit sprite on the same shading cycle, the same three-cell
   string, the same marker box, the same turning ring, at the same size.
   Nothing is redrawn, so nothing can drift.

   That matters most where there is no pointer at all. On a touch screen
   there is no hover: the aim cursor exists for the instant a finger is
   down and is hidden under that finger, so the only drill a phone player
   ever really sees is this one. A planted rig that is a different, bigger
   machine does not read as "the tool went in" -- it reads as the thing in
   your hand having been a picture of a tool.

   The only part that changes size is the tail, because the tail is the
   string still to go in, and watching it be used up is the point.
   ===================================================================== */
/* The anatomy, all of it in the glyph's units, because the planted rig IS the
   glyph: the same bit, the same string, the same marker box, the same ring.
   Nothing here is a second drawing of anything the cursor already has.

   What stands out below the box is ONE BITE of ground -- the sprite's own
   height and a little. Everything deeper is bought with the tail, the string
   above the box, which is what the machine actually feeds down and what the
   drill bar has always shown. */
const BIT_PX  = 7.25 * GLY_U;   // 29 -- tip to the marker box's underside
const HEAD_PX = 3 * GLY_U;      // 12 -- the marker box, which is the handle
const TAIL_PX = 5 * 2 * GLY_U;  // 40 -- five dashes' worth of string to feed
const TAIL_STUB = 2 * GLY_U;    // and one dash still standing at the bottom
/* How far the BIT travels while the box stands still. The box is the collar:
   it sits ON the ground and the string is fed THROUGH it, so the depth is
   bought entirely out of the tail, and the tail is exactly as long as the
   travel plus what is left standing at the end of it. */
const SINK_MAX = TAIL_PX - TAIL_STUB;
/* The depth one bite reaches. In metres, because the bar is ruled in metres
   and the two have to agree about where the bit is. */
const SpudM = () => BIT_PX / Math.max(PX_PER_M, 0.01);

/* tipY is the point of the bit. Everything is measured up from it, so the tip
   can be put anywhere -- on the cursor, or sinking into the ground -- and
   `tail` is how much string is standing above the box.

   `s` and `phase` are carried for the call site's sake and no longer used:
   the sprite has one size, being pixel art, and it turns on the panel clock
   the cursor turns on. */
function DrawDrill(cx, tipY, s, phase, lit, tail, feed, headBotY){
  const h = GLY_H, u = GLY_U;
  const X = Math.round(cx), TIP = Math.round(tipY);
  const mid = X + h * 0.5;                    // the string's own centre line
  const R = (x, y, w, ht, f) => { CTX.fillStyle = f;
    CTX.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(ht)); };
  // The box is not carried by the bit. Once the rig is collared it stays on
  // the ground while the string runs down through it, so its position is an
  // argument, not something measured up from the tip.
  const boxBot = Math.round(headBotY === undefined ? TIP - BIT_PX : headBotY);
  const boxTop = boxBot - HEAD_PX;

  // The bit, on the cursor's shading cycle -- stepped, and only while it cuts.
  DrawBitSprite(X, TIP, lit ? Math.floor(st.t * 9) : 0);
  // The string that has gone down through the box. Underground and clipped
  // away in practice, but the rig is not allowed to be drawn in pieces.
  DrawShaft(X, boxTop, TIP - BIT_ROWS.length * h);

  /* THE TAIL. The string still to go in, and the one part of the tool that
     changes size. Its collars are the glyph's own lead dashes, marching DOWN
     it while cutting -- which is the only way a rod of constant width can show
     that it is being fed, and it is the lead line of the icon doing it. */
  const tl = tail || 0;
  if (tl > 1){
    const ty0 = Math.round(boxTop - tl);
    DrawShaft(X, ty0, boxTop);
    const step = 2 * u, off = (((feed || 0) % step) + step) % step;
    for (let yy = ty0 + off; yy < boxTop - u * 0.5; yy += step){
      const y = Math.round(yy);
      R(mid - u * 0.5 - 1, y - 1, u + 2, u + 2, OUT);
      R(mid - u * 0.5, y, u, u, rgb(CY));
    }
  }

  /* THE HANDLE IS THE MARKER BOX. Hollow, so the string is seen running
     through it, which is the thing the rig actually does. It carries the one
     piece of state the tool has: green standing, cyan cutting -- two points on
     the same neon, so it reads as one machine changing state. It leaves the
     amber to the borehole bar, which is the thing actually asking for an
     input while the rig stands there. */
  const col = lit ? CY : G_STANDBY;
  const bx = mid - HEAD_PX * 0.5, by = boxTop;
  const th = Math.round(HEAD_PX / 3), hole = HEAD_PX - 2 * th;
  CTX.save();
  // The glow is the box's alone. Bloomed over the whole rig it eats the
  // sprite's cells, and a pixel tool with soft edges is not a pixel tool.
  CTX.shadowColor = rgb(col, 0.7); CTX.shadowBlur = 7;
  R(bx - 1, by - 1, HEAD_PX + 2, HEAD_PX + 2, OUT);
  R(bx, by, HEAD_PX, th, rgb(col));
  R(bx, by + th + hole, HEAD_PX, th, rgb(col));
  R(bx, by + th, th, hole, rgb(col));
  R(bx + th + hole, by + th, th, hole, rgb(col));
  CTX.restore();
}

/* Spatter. Ejecta leaves the collar on a ballistic arc, in lattice units so
   it lands on the ground it came out of, and it wears the colour of the bed
   the bit is in RIGHT NOW -- which makes the first thing you learn about the
   column a thing you see thrown out of it. */
function SpawnSpatter(i, j, m, n){
  const col = BedColour(clamp(m, 0, COLUMN_M - 0.01));
  for (let k = 0; k < n; k++){
    /* A cone, not a fountain. The launch speed is chosen in SCREEN pixels
       and only then converted into the two very different units the block
       actually moves things in -- lattice cells across, metres of depth up
       -- because it is the picture that has to read as a spray, and those
       two units are scaled by TX and PX_PER_M by wildly different amounts. */
    const az = Math.random() * 6.2832;
    const el = 0.72 + Math.random() * 0.46;           // 41 deg .. 68 deg
    const S  = 78 + Math.random() * 74;               // px/s along the throw
    const up = S * Math.sin(el), out = S * Math.cos(el);
    spatter.push({ i, j, z: 0.6,
      vi: Math.cos(az) * out / TX, vj: Math.sin(az) * out / TX,
      vz: up / PX_PER_M, g: EJECTA_G_PX / PX_PER_M,
      col, sz: 1.8 + Math.random() * 2.4 });
  }
}
function StepSpatter(dt){
  for (let k = spatter.length - 1; k >= 0; k--){
    const p = spatter[k];
    p.i += p.vi * dt; p.j += p.vj * dt;
    p.vz -= p.g * dt; p.z += p.vz * dt;
    if (p.z <= 0 || p.i < -1 || p.j < -1 || p.i > N + 1 || p.j > N + 1) spatter.splice(k, 1);
  }
  if (spatter.length > 420) spatter.splice(0, spatter.length - 420);
}
function DrawSpatter(){
  for (const p of spatter){
    const i = clamp(p.i, 0, N), j = clamp(p.j, 0, N);
    const k = Math.round(j) * STRIDE + Math.round(i);
    const q = Proj(p.i, p.j, SURF[0][k] - p.z);
    const x = q[0], yv = q[1];
    CTX.fillStyle = rgb(scalec(p.col, p.z > 3 ? 1.9 : 1.3));
    CTX.fillRect(x, yv, p.sz, p.sz * 0.8);
  }
}

/* =====================================================================
   THE CYCLE -- and why it is in two halves
   ---------------------------------------------------------------------
   Placing a rig and choosing how deep to go are two different decisions,
   and running them off one click made the second one disappear. So the
   click on the ground only SPUDS the hole: the bit sinks its own length
   and the handle comes to rest on the ground, which is exactly as far as
   a rig can go before anybody decides anything. Then the machine waits,
   the borehole bar takes over as the control -- flashing, because a
   control that has never been used has to say so -- and the depth you
   pick there is what the string is fed down to.

     aim   -> follow the pointer, tip anchored on it
     spud  -> sink one bit length; the handle lands on the ground
     await -> planted. The bar is the input now
     cut   -> feed the tail down to the chosen depth
     out   -> draw the string back up THROUGH the handle, which does not move
     hold  -> a beat, standing in the finished hole
     fade  -> the rig goes, the core barrel is there instead
   ===================================================================== */
function BeginOut(){
  drill.sink0 = drill.sink;
  drill.mode = "out"; drill.t = 0;
}
/* Backing out of a planted rig. It does NOT throw the hole away: the ground
   is already broken and the spoil is already on it, so the shallow column it
   did establish is what you keep. A control that can leave the panel in a
   state with no way forward is worse than one that costs you a bad hole. */
function AbortDrill(){
  if (drill.mode === "await" || drill.mode === "spud"){
    drill.depthM = SpudM() * Math.max(drill.spud, 0.35);
    BeginOut();
  }
}
function StepDrill(dt){
  const m = drill.mode;
  if (m === "aim"){ drill.phase += 2.2 * dt; return; }
  drill.t += dt;
  // Spinning down: cutting, then tripping, then idling in the hole, then off.
  drill.phase += (m === "spud" || m === "cut" ? 13.5
                : m === "out" ? 5.0 : m === "hold" ? 0.7 : 0) * dt;
  const h = holes[holes.length - 1];
  const sm = SpudM();
  if (m === "spud"){
    drill.spud = clamp(drill.t / SPUD_T, 0, 1);
    drill.curM = sm * drill.spud;
    if (h) h.k = 0.55 * drill.spud;
    if (Math.random() < 0.9) SpawnSpatter(drill.i, drill.j, drill.curM, 2 + (Math.random() * 3 | 0));
    if (drill.t >= SPUD_T){ drill.spud = 1; drill.curM = sm; drill.mode = "await"; drill.t = 0; }
  } else if (m === "cut"){
    drill.sink = clamp(drill.t / drill.cutT, 0, 1);
    drill.curM = lerp(sm, drill.depthM, drill.sink);
    drill.feed += 40 * dt;
    // A deeper hole leaves a bigger scar: the spoil is what came out of it.
    if (h) h.k = 0.55 + 0.45 * clamp(drill.depthM / Math.max(COLUMN_M, 1), 0, 1) * drill.sink;
    if (Math.random() < 0.5) SpawnSpatter(drill.i, drill.j, drill.curM, 1 + (Math.random() * 2 | 0));
    if (drill.t >= drill.cutT){ drill.sink = 1; BeginOut(); }
  } else if (m === "out"){
    /* The handle does not come up with it. It is the collar: it stays on the
       ground while the string is drawn back up THROUGH it, exactly the way it
       went down -- so what rises is the tail, back to its full length. */
    const u = clamp(drill.t / OUT_T, 0, 1);
    drill.sink = drill.sink0 * (1 - u);
    drill.curM = lerp(sm, drill.depthM, drill.sink);
    drill.feed -= 40 * dt;
    if (drill.t >= OUT_T){
      drill.sink = 0; drill.curM = sm;
      /* The column is real NOW, and only down to where the bit got. The
         string clearing the collar is the moment you know something: not
         when you aimed, and not one metre deeper than you drilled. */
      reveals.push({ i: drill.i, j: drill.j, m: drill.depthM });
      revealRev++;                      // stage 3 re-fits the model on this
      drill.mode = "hold"; drill.t = 0;
    }
  } else if (m === "hold"){
    /* A beat, with the machine standing in the hole it just finished. The
       column resolving and the rig disappearing are two separate events, and
       run on the same frame neither of them registers. */
    if (drill.t >= HOLD_T){
      bores.push({ i: drill.i, j: drill.j, m: drill.depthM });
      drill.mode = "fade"; drill.t = 0; drill.fade = 0;
    }
  } else if (m === "fade"){
    // Fast, and a cross-fade rather than a cut: the barrel is what the rig
    // leaves behind, so one has to be seen becoming the other.
    drill.fade = clamp(drill.t / FADE_T, 0, 1);
    if (drill.t >= FADE_T){
      drill.mode = "aim"; drill.t = 0;
      drill.spud = drill.sink = drill.feed = drill.fade = 0;
      drill.curM = 0; st.depth = 0;
    }
  }
  StepSpatter(dt);
}
/* Where the tip is, and where the collar it is standing in is. The whole
   assembly descends by `sink`: the tail keeps its length and goes down with
   the handle, which is what buys the depth. At the bottom of its travel a
   stub of tail is still standing out of the ground, and that stub is what
   the bore marker replaces when the rig leaves. */
function DrillPose(){
  if (drill.mode === "aim")
    return { cx: st.vx, tipY: st.vy, collarY: st.vy + 6, live: false,
             head: undefined, tail: TAIL_PX };
  const g = Proj(drill.i, drill.j, SURF[0][drill.j * STRIDE + drill.i]);
  const gx = g[0], gy = g[1];
  const sink = drill.sink * SINK_MAX;
  return { cx: gx, tipY: gy + drill.spud * BIT_PX + sink, collarY: gy + 2, live: true,
           // Spudding in, the handle rides down with the bit until it lands.
           // After that it stays put and the string runs through it.
           head: gy + (drill.spud - 1) * BIT_PX,
           tail: Math.max(TAIL_PX - sink, TAIL_STUB) };
}

/* The mouth. Dark, with a lit lip on the near side and a hair of shadow on
   the far one -- the same implied upper-left key the rest of the panel uses,
   which is what makes a flat ellipse read as a hole rather than a sticker. */
function DrawCollar(cx, cy, k){
  const rw = 10.5 * DRILL_S * (0.55 + 0.45 * k), rh = rw * 0.38;
  CTX.fillStyle = "rgb(10,9,7)";
  CTX.beginPath(); CTX.ellipse(cx, cy, rw, rh, 0, 0, 6.2832); CTX.fill();
  CTX.strokeStyle = "rgba(190,205,220,.22)"; CTX.lineWidth = 1.2;
  CTX.beginPath(); CTX.ellipse(cx, cy, rw, rh, 0, 3.34, 6.08); CTX.stroke();
  CTX.strokeStyle = "rgba(0,0,0,.45)"; CTX.lineWidth = 1.4;
  CTX.beginPath(); CTX.ellipse(cx, cy, rw, rh, 0, 0.2, 2.94); CTX.stroke();
}
/* A FINISHED hole is not a hole. Once the string is out, what is at the
   surface is a collapsed, churned patch of the soil that came out of it --
   loose grain over a mouth that closed on itself. Left as the black ellipse
   the live rig stands in, a finished hole reads as a puncture in the picture:
   nothing else in this panel is a hole through the ground, so the eye takes it
   for a missing pixel rather than for a place.

   Flat, deliberately: no rim, no lip, no shadow. The rim already exists a few
   cells out, where the spoil is, and putting a second raised thing at the
   centre of it turns one landform into two competing ones. This is only
   texture -- freshly broken regolith is brighter and coarser than the ground
   it came from, so it is drawn as a scatter of chips lighter and darker than
   the local rock, with the shading underneath left to show through. */
function DrawCrumbs(cx, cy, k){
  const rw = 11.5 * DRILL_S * (0.62 + 0.38 * k), rh = rw * 0.42;
  const base = ROCK_COL[0], g = TexGain();
  // Barely a fill. The patch must not read as a disc laid ON the ground -- an
  // ellipse of any solidity is just the black hole in another colour -- so the
  // ground keeps its own tone and shading, and the grain does the talking.
  CTX.fillStyle = rgb(scalec(base, 1.04 * g), 0.22);
  CTX.beginPath(); CTX.ellipse(cx, cy, rw, rh, 0, 0, 6.2832); CTX.fill();
  const n = 22 + Math.round(26 * k);
  for (let i = 0; i < n; i++){
    // Density thins outward and a few chips land beyond the mouth, so the
    // edge of the churn is ragged rather than drawn.
    const r = Math.pow(rnd(), 0.62) * 1.22, t = rnd() * 6.2832;
    if (r > 1 && rnd() > 0.45) continue;
    const x = cx + rw * r * Math.cos(t), y = cy + rh * r * Math.sin(t);
    const tone = rnd();
    const c = tone > 0.74 ? scalec(base, 1.52 * g)
            : tone > 0.34 ? scalec(base, 1.12 * g) : scalec(base, 0.55 * g);
    const w = 1.1 + rnd() * 1.6;
    CTX.fillStyle = rgb(c, 0.8);
    CTX.fillRect(x - w * 0.5, y - w * 0.4, w, w * 0.85);
  }
}
/* Holes that have been finished keep their scar, drawn with the ground so the
   block accumulates a record of where you have been. Seeded per hole, so the
   grain is the same grain every frame instead of boiling. */
function DrawHoleMouths(){
  const live = holes[holes.length - 1];
  for (const h of holes){
    if (h.k < 0.05) continue;
    let a = 1;
    if (drill.mode !== "aim" && h === live){
      if (drill.mode !== "fade") continue;   // the rig is standing in it
      a = drill.fade;                        // and now it is leaving
    }
    grainSeed = 1 + h.i * 7919 + h.j * 104729;
    CTX.save(); CTX.globalAlpha = a;
    const g = Proj(h.i, h.j, SURF[0][h.j * STRIDE + h.i]);
    DrawCrumbs(g[0], g[1] + 2, h.k);
    CTX.restore();
  }
}

const BORE_RW = 4.4;
function DrawBores(){
  const last = bores[bores.length - 1];
  for (const b of bores){
    CTX.save();
    if (drill.mode === "fade" && b === last) CTX.globalAlpha = drill.fade;
    const g = Proj(b.i, b.j, SURF[0][b.j * STRIDE + b.i]);
    const cx = g[0], gy = g[1] + 2;
    const deep = clamp(b.m / Math.max(COLUMN_M, 1), 0, 1);
    const top = gy - (16 + 23 * deep);
    const rw = BORE_RW, rh = rw * 0.40;
    const ph = st.t * 2.4 + b.i * 0.7 + b.j * 0.31;
    CTX.setLineDash([3.4, 2.9]);
    for (let g = 0; g < 3; g++){
      const a = ph + g * 2.0944, x = cx + rw * Math.sin(a), c = Math.cos(a);
      CTX.lineDashOffset = -st.t * 15;
      CTX.strokeStyle = rgb(CY, c > 0 ? 0.80 : 0.24);
      CTX.lineWidth = c > 0 ? 1.5 : 1.1;
      CTX.beginPath();
      CTX.moveTo(x, top + rh * c); CTX.lineTo(x, gy + rh * c); CTX.stroke();
    }
    CTX.lineDashOffset = st.t * 11;
    CTX.strokeStyle = rgb(CY, 0.62); CTX.lineWidth = 1.3;
    CTX.beginPath(); CTX.ellipse(cx, top, rw, rh, 0, 0, 6.2832); CTX.stroke();
    CTX.strokeStyle = rgb(CY, 0.28); CTX.lineWidth = 1.1;
    CTX.beginPath(); CTX.ellipse(cx, gy, rw, rh, 0, 0, 6.2832); CTX.stroke();
    CTX.setLineDash([]); CTX.lineDashOffset = 0;
    CTX.fillStyle = rgb(CY, 0.16);
    CTX.beginPath(); CTX.ellipse(cx, top, rw, rh, 0, 0, 6.2832); CTX.fill();
    CTX.restore();
  }
}


function DrawDrillLive(){
  if (!drill.armed) return;
  if (drill.mode === "aim"){
    // The cursor is the glyph, at the icon's own size, and a spot that will
    // be refused says so with the glyph rather than by vanishing.
    if (!drill.onCanvas) return;
    DrawDrillGlyph(st.vx, st.vy, drill.canPlace ? "hover" : "bad", st.t);
    return;
  }
  const p = DrillPose();
  const paint = () => {
    if (p.live){
      DrawCollar(p.cx, p.collarY, 1);
      // The cursor's ring, still round the tool it was carried by, still
      // turning the same way. It is the clearest thing tying the planted
      // machine to the one that was in hand a moment ago.
      DrawGlyphRing(Math.round(p.cx), Math.round(p.collarY),
                    -st.t * 1.9, rgb(CY, 0.7), GLY_U);
    }
    CTX.save();
    CTX.beginPath();
    CTX.rect(p.cx - 46 * DRILL_S, CLIP_TOP(), 92 * DRILL_S, p.collarY - CLIP_TOP());
    CTX.clip();
    DrawDrill(p.cx, p.tipY, DRILL_S, drill.phase,
              drill.mode === "spud" || drill.mode === "cut",
              p.tail, drill.feed, p.head);
    CTX.restore();
  };
  // Composited once, not faded fill by fill -- the same reason the peeled slab
  // is: a rig faded part by part shows its own tail through its own head.
  if (drill.mode === "fade") AsSeenThrough(1 - drill.fade, paint);
  else paint();
}


/* The rig fades through one composite rather than fill by fill -- a rig faded
   part by part shows its own tail through its own head. Sized to the block's
   region, and only ever used during the 0.3 s fade. */
const SCR = document.createElement('canvas'), SCTX = SCR.getContext('2d');
function AsSeenThrough(alpha, draw) {
  const c = LT.block.canvas;
  const w = Math.ceil((c[2] - c[0]) * dpr), h = Math.ceil((c[3] - c[1]) * dpr);
  if (SCR.width !== w || SCR.height !== h) { SCR.width = w; SCR.height = h; }
  SCTX.setTransform(1, 0, 0, 1, 0, 0); SCTX.clearRect(0, 0, w, h);
  SCTX.setTransform(dpr, 0, 0, dpr, -c[0] * dpr, -c[1] * dpr);
  const main = CTX; CTX = SCTX; draw(); CTX = main;
  CTX.save(); CTX.setTransform(1, 0, 0, 1, 0, 0);
  CTX.globalAlpha = alpha; CTX.drawImage(SCR, Math.round(c[0] * dpr), Math.round(c[1] * dpr));
  CTX.restore();
}

/* The scour deepens continuously but the ground is far too expensive to
   rebuild at 60 Hz, so it steps in about ten stages across a cut while the
   drill and its spatter run smooth on top. */
const SpoilRev = () => { let v = 0; for (const h of holes) v += Math.round(h.k * 10) * 31; return v; };
let lastSpoil = 0, lastReveal = -1;
function StepGround() {
  const r = SpoilRev();
  /* A finished hole moves the interfaces -- the error each one carries is
     scaled by 1 - confidence, and confidence has just gone up. The beds
     re-fitting is the whole point of drilling, so it happens on the frame
     the column clears the collar. */
  if (r !== lastSpoil || revealRev !== lastReveal) { lastSpoil = r; BuildModel(); }
}

/* =====================================================================
   6. THE TWO CANVASES
   ---------------------------------------------------------------------
   The frame is static between layout and module changes and is cached;
   only the transient panels are drawn every frame. Same pattern the
   dashboard uses, and the same one the block will use in stage 1.
   ===================================================================== */
const CV = document.getElementById('cv');
/* `let`, not `const`: the drill's fade swaps CTX for an offscreen context so
   the rig composites once instead of fill by fill (AsSeenThrough). Every
   ported drawing function reaches CTX by name, which is the whole reason that
   works -- and the reason this has to be reassignable. */
let CTX = CV.getContext('2d');
const CACHE = document.createElement('canvas'), CCTX = CACHE.getContext('2d');
let staticKey = '';

function Resize() {
  const cssW = document.getElementById('wrap').clientWidth || 1536;
  const next = Layout(cssW);
  const changed = next.mode !== LT.mode;
  LT = next; W = LT.W; H = LT.H;
  dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  for (const c of [CV, CACHE]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  if (changed) {
    const pinned = LT.mode === 'desk' ? 1 : 0;
    ui.rack.open = ui.rack.t = pinned;
    ui.sheet.open = ui.sheet.t = pinned;
  }
  staticKey = ''; frameKey = '';
}
let fullBlit = true;                 // the cached console must reach the canvas again
function EnsureStatic() {
  const key = [LT.mode, W, H, ui.module].join('|');
  if (key === staticKey) return;
  staticKey = key; fullBlit = true;
  CCTX.setTransform(dpr, 0, 0, dpr, 0, 0);
  CCTX.clearRect(0, 0, W, H);
  DrawStatic(CCTX);
}
let last = performance.now(), frameKey = '';
/* Everything the live layer's appearance depends on. If none of it moved,
   the canvas already holds the right pixels and the frame is skipped. */
function FrameKey() {
  const b = blockCtl.state;
  // Anything moving keeps the frame alive: the armed cursor follows the
  // pointer, the rig animates, spatter falls, a bore marker turns.
  const live = drill.armed || spatter.length || bores.length || lockFlash > 0;
  /* The cage crawls, and a crawl at 60 Hz would mean redrawing the block 60
     times a second to move a few faint lines. It is stepped at 6 Hz instead --
     which on an instrument reads as data arriving rather than as judder -- and
     it stops entirely once the block is MEASURED and there is no cage left. */
  const cage = Delineation() < 0.999 ? crawlT.toFixed(3) : 'settled';
  return [staticKey, b.yaw.toFixed(4), b.pitch.toFixed(4), b.explode.toFixed(3),
          b.selected, b.fast, ui.rack.t.toFixed(3), ui.sheet.t.toFixed(3),
          revealRev, cage,
          live ? st.t.toFixed(3) : 'still'].join('|');
}
function Frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  st.t = now / 1000;
  crawlT = Math.floor(st.t * 6) / 6;
  StepUi(dt);
  blockCtl.tick(now);
  ReadCamera();
  StepDrill(dt);
  StepGround();
  if (lockFlash > 0) lockFlash = Math.max(0, lockFlash - dt);
  drill.canPlace = drill.armed && drill.mode === 'aim' && CanPlace();
  drill.onCanvas = drill.canPlace || (drill.armed && drill.mode === 'aim'
                                      && st.mx >= 0 && InBlock([st.vx, st.vy]));
  EnsureStatic();
  const fk = FrameKey();
  if (fk === frameKey) { requestAnimationFrame(Frame); return; }
  frameKey = fk;
  /* Only the part of the frame the live layer dirties is restored. Blitting
     the whole cached console every frame is 6.7 megapixels at dpr 2 and it
     was costing more than rendering the block did -- 47.7 ms a frame against
     the block's own 4.3. The live layer is the block, its HUD, and (on the
     phone, while one is moving) a sheet over everything. */
  const c = LT.block.canvas;
  const sheetMoving = LT.mode === 'phone' && (ui.rack.t > 0.002 || ui.sheet.t > 0.002);
  /* The dirty rect is the block and its HUD -- except when the cached console
     itself has just been rebuilt, or a sheet is sliding over everything, in
     which case the whole canvas is restored. Getting this wrong is quiet: the
     parts of the console outside the rect simply never arrive, and a still
     screenshot of the first frame looks fine. */
  const dirty = (fullBlit || sheetMoving)
    ? [0, 0, W, H]
    : [c[0] - 24, c[1] - 24, c[2] - c[0] + 48, c[3] - c[1] + 48];
  fullBlit = false;
  CTX.setTransform(1, 0, 0, 1, 0, 0);
  const D0 = dirty.map(v => Math.round(v * dpr));
  CTX.clearRect(D0[0], D0[1], D0[2], D0[3]);
  CTX.drawImage(CACHE, D0[0], D0[1], D0[2], D0[3], D0[0], D0[1], D0[2], D0[3]);
  CTX.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!window.__blockOff) DrawBlock(CTX);   // __blockOff: the harness's A/B for what the block costs
  DrawHoleMouths();
  DrawBores();
  DrawDrillLive();
  DrawSpatter();
  // brackets and the base ring only: the reticle belongs to the drill (stage 2)
  // and the callouts to the ruler (stage 5)
  const view = BlockView();
  Holo3D.drawHud(CTX, model, blockCtl.state, view, { reticle: false, callouts: false, base: false });
  DrawBaseRing(CTX, view);
  DrawTransient(CTX);
  requestAnimationFrame(Frame);
}

/* =====================================================================
   7. INPUT
   ===================================================================== */
const inBox = (b, x, y) => b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
function At(e) {
  const r = CV.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}
CV.addEventListener('pointermove', e => {
  const r = CV.getBoundingClientRect();
  st.mx = (e.clientX - r.left) / r.width * W;
  st.my = (e.clientY - r.top) / r.height * H;
  st.vx = st.mx; st.vy = st.my;             // design space IS the drawing space here
});
CV.addEventListener('pointerleave', () => { st.mx = st.my = -1; });
const InBlock = p => {
  const g = LT.block.grab;
  return p[0] >= g[0] && p[0] <= g[2] && p[1] >= g[1] && p[1] <= g[3]
      && !(LT.mode === 'phone' && (ui.rack.t > 0.02 || ui.sheet.t > 0.02));
};
CV.addEventListener('pointerdown', e => {
  const [x, y] = At(e);
  st.mx = x; st.my = y; st.vx = x; st.vy = y;
  if (InBlock([x, y])) {
    if (drill.armed) { e.preventDefault(); DrillClick(x, y); return; }
    return;                                    // otherwise Holo3D's listener has it
  }
  const b = LT.bar;
  if (inBox(b, x, y)) {
    const i = Math.floor((x - b.x) / (b.w / LT.MODULES.length));
    if (i >= 0 && i < LT.MODULES.length) { ui.module = i; staticKey = ''; }
    return;
  }
  for (const tb of LT.tabs || []) if (inBox(tb, x, y)) {
    const p = ui[tb.key];
    p.open = p.open ? 0 : 1;
    if (p.open) for (const k of ['rack', 'sheet']) if (k !== tb.key) ui[k].open = 0;   // one at a time
    return;
  }
  // a tap on the dimmed ground closes whatever is open
  if (LT.mode === 'phone' && (ui.rack.open || ui.sheet.open)) { ui.rack.open = 0; ui.sheet.open = 0; }
});
/* A click on the block while the rig is out. Two decisions, as they have
   always been: where it stands, then how deep it goes.

   THE DEPTH CONTROL IS PROVISIONAL. It belongs to the borehole bar, which is
   stage 6; until then a second click cuts the full column, so the feed, the
   tail, the scour and the trip-out can all be watched. */
function DrillClick(x, y) {
  if (drill.mode === 'await') {
    drill.depthM = COLUMN_M;
    drill.cutT = 0.7 + 2.3 * (drill.depthM - SpudM()) / Math.max(COLUMN_M - SpudM(), 1);
    drill.mode = 'cut'; drill.t = 0; drill.sink = 0; drill.feed = 0;
    return;
  }
  if (drill.mode !== 'aim') return;             // one hole at a time
  if (!CanPlace()) { lockFlash = 1.0; return; }
  const c = PickGround(x, y);
  drill.i = c.i; drill.j = c.j;
  drill.mode = 'spud'; drill.t = 0; drill.spud = 0; drill.sink = 0; drill.feed = 0;
  drill.depthM = SpudM();
  holes.push({ i: c.i, j: c.j, k: 0 });
  if (holes.length > 40) holes.shift();
}
window.__drill = () => ({ armed: drill.armed, mode: drill.mode, i: drill.i, j: drill.j,
  spud: +drill.spud.toFixed(2), sink: +drill.sink.toFixed(2), curM: Math.round(drill.curM),
  depthM: Math.round(drill.depthM), holes: holes.length, bores: bores.length,
  spatter: spatter.length, pxPerM: +PX_PER_M.toFixed(4), tx: +TX.toFixed(2) });
window.__arm = v => { drill.armed = v ? 1 : 0; if (!v) drill.mode = 'aim'; return drill.armed; };
window.__reset = () => { holes.length = 0; bores.length = 0; spatter.length = 0; reveals.length = 0; revealRev++;
  drill.mode = 'aim'; drill.spud = drill.sink = drill.feed = drill.fade = 0; BuildModel(); };
window.__pick = (x, y) => PickGround(x, y);
window.__surf = (i, j) => SURF[0][j * STRIDE + i];
window.__probe = () => ({ mx: Math.round(st.mx), vx: Math.round(st.vx), vy: Math.round(st.vy),
  inBlock: InBlock([st.vx, st.vy]), sel: blockCtl.state.selected, canPlace: CanPlace(),
  grab: LT.block.grab });
window.__col = () => COLUMN_M;
window.__hole = (i, j, k) => { holes.push({ i, j, k }); BuildModel(); return holes.length; };
window.addEventListener('resize', Resize);

/* the harness reads this rather than guessing at geometry */
window.__L = () => ({ mode: LT.mode, W, H, dpr, module: ui.module,
  block: blockCtl ? { yaw: +blockCtl.state.yaw.toFixed(3), pitch: +blockCtl.state.pitch.toFixed(3),
                      sel: blockCtl.state.selected, explode: +blockCtl.state.explode.toFixed(3),
                      auto: blockCtl.state.auto, lattice: N, beds: model ? model.layers.length : 0,
                      grab: LT.block.grab } : null,
  rack: { open: ui.rack.open, t: +ui.rack.t.toFixed(3) },
  sheet: { open: ui.sheet.open, t: +ui.sheet.t.toFixed(3) },
  rects: { bar: LT.bar, survey: LT.survey, stats: LT.stats, layers: LT.layers,
           log: LT.log, drill: LT.drill, dstats: LT.dstats, drawer: LT.drawer, sheetR: LT.sheet },
  tabs: LT.tabs || [] });
window.__blk = () => blockCtl.state;
window.__lattice = n => { P.lattice = n; BuildModel(); return N; };
window.__model = () => model; window.__view = () => BlockView(); window.__render = RenderBlock;
/* what the console knows, as the renderer reads it */
window.__know = (i, j, m) => +KnowAt(i, j, m).toFixed(4);
window.__delin = () => ({ delin: +Delineation().toFixed(4), tier: DelinTier(),
                          reveals: reveals.length, rev: revealRev });
window.__reveal = (i, j, m) => { reveals.push({ i, j, m: m === undefined ? COLUMN_M : m });
                                 revealRev++; BuildModel(); return reveals.length; };
/* profiling seams -- each step of the frame, callable on its own */
window.__renderInto = () => DrawBlock(CTX);
window.__blitCache = () => { const c = LT.block.canvas;
  const D = [c[0]-24, c[1]-24, c[2]-c[0]+48, c[3]-c[1]+48].map(v => Math.round(v*dpr));
  CTX.setTransform(1,0,0,1,0,0); CTX.clearRect(D[0],D[1],D[2],D[3]);
  CTX.drawImage(CACHE, D[0],D[1],D[2],D[3], D[0],D[1],D[2],D[3]); };
window.__blitBlock = () => {};
window.__hud = () => { CTX.setTransform(dpr,0,0,dpr,0,0); const v = BlockView();
  Holo3D.drawHud(CTX, model, blockCtl.state, v, { reticle:false, callouts:false, base:false });
  DrawBaseRing(CTX, v); };
window.__bounds = () => model.bounds && model.bounds.map(v => Math.round(v));
/* Does the block still fit the canvas it is rendered into? A block that grows
   past its own buffer is clipped, and a clipped block at an extreme camera is
   exactly the thing a still frame does not show you. */
window.__fits = () => { const c = LT.block.canvas, b = model.bounds;
  return !b ? null : { fits: b[0] >= c[0] && b[1] >= c[1] && b[2] <= c[2] && b[3] <= c[3],
                       bounds: b.map(Math.round), canvas: c }; };

Resize();
BuildModel();
/* Holo3D.setCanvasFactory is the seam a host without `document` uses for the
   two ghost buffers -- and the one the C++ port will use for render targets.
   Wired now, while it costs nothing, rather than discovered at stage 5. */
Holo3D.setCanvasFactory((w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; });
blockCtl = Holo3D.attach(CV, {
  get width(){ return W; }, get height(){ return H; },   // the design size moves with the breakpoint
  inside: InBlock, keys: false,
  /* A tap picks a bed -- unless the rig is out, in which case the tap is the
     rig's and selecting a bed under it would both steal the click and refuse
     the next one (CanPlace will not drill an exploded model). Dragging still
     turns the block with the tool in hand, which is how the old prototype
     behaved and how you aim. */
  hit: p => (drill.armed ? -1 : Holo3D.hit(model, p[0], p[1])),
  // Still until it is touched. The upstream demo idles by turning the block
  // slowly, which is charming on a demo page and wrong on an instrument: it
  // spends a fifth of the frame budget, forever, saying nothing.
  state: { auto: false },
});
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { staticKey = ''; requestAnimationFrame(Frame); });
})();
</script>
</body>
</html>
