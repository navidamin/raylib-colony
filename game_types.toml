# game_types.toml
# Game Type Definitions for Colony Game
# This file defines all resources, units, and modules used in the game
# Last updated: 2025-11-09

# =============================================================================
# RESOURCE TYPES
# =============================================================================

[resource_types.singular]
# Natural/Raw Resources
H2 = { display_name = "Hydrogen", color = "#9696FF", category = "raw", base_value = 1.0 }
O2 = { display_name = "Oxygen", color = "#FF9696", category = "raw", base_value = 1.0 }
C = { display_name = "Carbon", color = "#646464", category = "raw", base_value = 1.0 }
Fe = { display_name = "Iron", color = "#8B4513", category = "raw", base_value = 1.2 }
Si = { display_name = "Silicon", color = "#90B494", category = "raw", base_value = 1.1 }

# Processed Resources
WATER = { display_name = "Water", color = "#0099FF", category = "processed", base_value = 3.0 }
FOOD = { display_name = "Food", color = "#00FF00", category = "processed", base_value = 4.0 }
BIOFUEL = { display_name = "Biofuel", color = "#AAFF00", category = "processed", base_value = 3.5 }

# Meta Resources
ENERGY = { display_name = "Energy", color = "#FFFF00", category = "meta", base_value = 2.0 }
SCIENCE = { display_name = "Science", color = "#00FFFF", category = "meta", base_value = 5.0 }
MANPOWER = { display_name = "Manpower", color = "#FFA500", category = "meta", base_value = 3.0 }

[resource_types.typed]
# Typed/Artifact Resources (have variants)

[resource_types.typed.MACHINERY]
display_name = "Machinery"
variants = ["HeavyDrill", "Conveyor", "RoboticArm"]
asset_prefix = "assets/machinery/"

[resource_types.typed.MACHINERY.base_cost]
Fe = 10.0
Si = 5.0
ENERGY = 20.0

[resource_types.typed.ELECTRONICS]
display_name = "Electronics"
variants = ["BasicCircuit", "AdvancedProcessor", "QuantumCore"]
asset_prefix = "assets/electronics/"

[resource_types.typed.ELECTRONICS.base_cost]
Si = 15.0
C = 5.0
ENERGY = 30.0

# =============================================================================
# UNIT TYPES
# =============================================================================

[unit_types.Extraction]
display_name = "Extraction Facility"
construction_time = 120.0
modules = ["H2Extractor", "O2Extractor", "MiningDrill"]
asset_directory = "assets/units/Extraction/"
unit_asset_file = "unit.png"
strategy_class = "ExtractionStrategy"

[unit_types.Extraction.base_cost]
Fe = 50.0
ENERGY = 100.0

[unit_types.Farming]
display_name = "Agricultural Complex"
construction_time = 90.0
modules = ["Hydroponics", "Greenhouse", "BioreactorSystem"]
asset_directory = "assets/units/Farming/"
unit_asset_file = "unit.png"
strategy_class = "FarmingStrategy"

[unit_types.Farming.base_cost]
C = 30.0
WATER = 50.0
ENERGY = 80.0

[unit_types.Energy]
display_name = "Power Generation"
construction_time = 150.0
modules = ["SolarArray", "NuclearReactor", "GeothermalPlant"]
asset_directory = "assets/units/Energy/"
unit_asset_file = "unit.png"
strategy_class = "EnergyStrategy"

[unit_types.Energy.base_cost]
Fe = 60.0
Si = 40.0
ENERGY = 50.0

[unit_types.Research]
display_name = "Research Laboratory"
construction_time = 200.0
modules = ["BasicLab", "ComputingCenter", "ExperimentalFacility"]
asset_directory = "assets/units/Research/"
unit_asset_file = "unit.png"
strategy_class = "ResearchStrategy"

[unit_types.Research.base_cost]
Si = 80.0
C = 40.0
ENERGY = 150.0

[unit_types.Manufacture]
display_name = "Manufacturing Plant"
construction_time = 180.0
modules = ["Refinery", "AssemblyLine", "Factory"]
asset_directory = "assets/units/Manufacture/"
unit_asset_file = "unit.png"
strategy_class = "ManufactureStrategy"

[unit_types.Manufacture.base_cost]
Fe = 100.0
Si = 50.0
ENERGY = 120.0

