<style>
/* The game's own near-black plating, so a playtest looks like the thing
   it is testing (docs/design/graphics/dark-plating.md). */
:root{
  --ground:#070b11; --panel:#0d151ecc; --rule:#1c2a39;
  --text:#c9d8e8; --dim:#61768a; --dimmer:#3f5163;
  --am:#d9962f; --am-lit:#f4c66a; --cy:#50e1ff;
  --ui:"Chakra Petch",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
html{color-scheme:dark}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--ui);
  overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}

#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}

.hud{position:fixed;font:700 11px/1.5 var(--mono);letter-spacing:.06em;
  background:var(--panel);border:1px solid var(--rule);border-radius:5px;
  padding:8px 10px;backdrop-filter:blur(3px);pointer-events:none;
  -webkit-backdrop-filter:blur(3px)}
#tl{top:12px;left:12px}
#tr{top:12px;right:12px;text-align:right}
#lvl{color:var(--am-lit);font-size:13px;letter-spacing:.14em}
.k{color:var(--dimmer)}
.v{color:var(--cy)}
#busy{color:var(--am);opacity:0}
#busy.on{opacity:1}

#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;
  display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;gap:10px;
  background:var(--panel);border:1px solid var(--rule);border-radius:6px;
  padding:9px 12px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  max-width:calc(100vw - 24px)}
#zoom{width:min(46vw,420px);height:22px;-webkit-appearance:none;appearance:none;
  background:none;cursor:ew-resize;margin:0}
#zoom::-webkit-slider-runnable-track{height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--cy) 0 var(--fill,50%),var(--rule) var(--fill,50%) 100%)}
#zoom::-moz-range-track{height:3px;border-radius:2px;background:var(--rule)}
#zoom::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:11px;height:19px;
  margin-top:-8px;border-radius:2px;background:var(--am-lit);border:1px solid #2a1d08}
#zoom::-moz-range-thumb{width:11px;height:19px;border-radius:2px;
  background:var(--am-lit);border:1px solid #2a1d08}
.btn{font:700 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  padding:8px 10px;border-radius:4px;border:1px solid var(--rule);
  background:#111c28;color:var(--dim);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--am);color:var(--am-lit)}
.btn[aria-pressed=true]{border-color:var(--cy);color:var(--cy);background:#0d2430}
.btn:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.brk{display:none}
#regions{position:fixed;top:12px;left:50%;transform:translateX(-50%);
  display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:min(70vw,760px)}
#help{position:fixed;bottom:14px;right:14px;font:400 10.5px/1.6 var(--mono);
  color:var(--dimmer);text-align:right;pointer-events:none}
#bar{padding-bottom:calc(9px + env(safe-area-inset-bottom,0px))}
@media (max-width:820px){
  /* A phone still needs the regions; it just cannot spare two rows for
     them, so they scroll instead of wrapping. */
  #regions{flex-wrap:nowrap;overflow-x:auto;max-width:calc(100vw - 24px);
    justify-content:flex-start;padding-bottom:2px;-webkit-overflow-scrolling:touch;
    top:auto;bottom:calc(66px + env(safe-area-inset-bottom,0px));scrollbar-width:none}
  #regions::-webkit-scrollbar{display:none}
  #help{display:none}
  #tr{font-size:10px;padding:6px 8px}
  #tl{font-size:10px;padding:6px 8px}
  #zoom{width:38vw}
  /* Only here is there not room for one row of controls. */
  #bar{flex-wrap:wrap}
  /* Two rows, decided rather than fallen into: the zoom and its two
     steppers, then every button. Left to wrap on its own the bar put
     one control on each of four lines. */
  /* The bar is shrink-to-fit, so wrapping inside it was wrapping inside
     about 200 px however much screen there was. */
  #bar{width:calc(100vw - 24px)}
  #zoom{flex:1 1 auto;width:auto;min-width:0}
  .brk{display:block;flex-basis:100%;height:0}
}

<div id="stage"><canvas id="cv"></canvas></div>

<div class="hud" id="tl">

  <div><span class="k">span</span> <span class="v" id="span">5.00 km</span>
       <span class="k">·</span> <span class="v" id="mpp">15.6 m/px</span></div>

</div>

  <button class="btn" id="out" title="Zoom out">&minus;</button>
  <input id="zoom" type="range" min="0" max="1" step="0.0005" value="0"
         list="rungs" aria-label="Zoom">

<script src="regolith_blocks.js"></script>
<script src="regolith_chain.js"></script>
<script src="regolith_gpu.js"></script>
<script>
"use strict";
(function(){
const TC = TerrainChain;
const CV = document.getElementById("cv");
const CTX = CV.getContext("2d");

/* --- what the descent is ---------------------------------------------
   The game's ladder is 100 / 25 / 5 km -- PLANET, COLONY, SECT. This
   walks the bottom three rungs of it and one below: 50 km, wide enough
   that the mosaic still carries the landforms, down to 1 km, where it
   carries nothing at all and every crater and rock you see was made on
   the way in. 1 km is the floor on purpose -- it is a unit's own ground,
   and the scale the game would have to draw if it ever went below the
   sect.
   -------------------------------------------------------------------- */
const LEVELS = [
  { n: 1, span: 25.0, name: "COLONY" },
  { n: 2, span: 5.0,  name: "SECT" },
  { n: 3, span: 1.0,  name: "UNIT" }
];
const SPAN_MAX = 50.0, SPAN_MIN = 1.0;
const LOG_MAX = Math.log(SPAN_MAX), LOG_MIN = Math.log(SPAN_MIN);

const st = {
  region: 0, block: null, lc: null,
  cxKm: 0, cyKm: 0, spanKm: 5.0,           // the view, in km from the origin
  originLat: 0, originLon: 0,
  tile: null, prev: null, fade: 1,
  res: 512, genMs: 0, genCount: 0, busy: false,
  // 0 smooth as it was, 1 smooth but with the chain's softening dropped,
  // 2 hard pixels, 3 hard pixels with banded tone. Split this way because
  // the softening and the filtering turned out to be separate questions:
  // more resolution does NOT fix the softness, since the chain's blurs
  // are scaled by k = res/300 and therefore cover the same GROUND however
  // many pixels you give them. Only dropping them does.
  style: 1, px: 3,
  drag: null, pinch: null, dirty: true, mini: null,
  // The refine pass and its supersample ratio. See SUPER_STEPS.
  super: 1.6, gpu: -1, base: null, epoch: 0, reqId: 0, fineMs: 0, fineRes: 0, fining: false
};

/* --- the imagery ------------------------------------------------------ */
const REGIONS = WAC_BLOCKS.regions;
function LoadRegion(i, then){
  const r = REGIONS[i], img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = c.height = WAC_BLOCKS.size;
    const g = c.getContext("2d", { willReadFrequently: true });
    g.drawImage(img, 0, 0);
    const px = g.getImageData(0, 0, WAC_BLOCKS.size, WAC_BLOCKS.size).data;
    const data = new Uint8Array(WAC_BLOCKS.size * WAC_BLOCKS.size);
    for (let k = 0; k < data.length; k++) data[k] = px[k * 4];
    st.block = { data, w: WAC_BLOCKS.size, h: WAC_BLOCKS.size,
                 x0: r.x0, y0: r.y0, wacW: WAC_BLOCKS.wacW, wacH: WAC_BLOCKS.wacH };
    // Copied, not transferred: there are two workers and the page keeps
    // its own for the no-worker path. It is 64 kB.
    if (WORK){ WORK.fast.postMessage({ cmd: "block", block: st.block });
               EachFine(w => w.postMessage({ cmd: "block", block: st.block })); }
    then();
  };
  img.src = "data:image/png;base64," + r.png;
}

/* --- the workers ------------------------------------------------------
   Why this exists, in one paragraph, because it is the answer to a
   question worth recording.

   Zooming out fast used to show a brief frame that looked far better
   than the one that replaced it. That frame was not a cheap renderer:
   it was the PREVIOUS tile -- built for the tighter view being left, so
   about twice the ground resolution -- still on screen, and stretched
   1.4x instead of 2.7x. Measured against the 1280 chip at the same
   window it is the same picture (high-frequency energy 2.94 against
   3.15; the tile it replaced, 1.15). So the good frame was the
   EXPENSIVE one, seen for free only because the way in had already paid
   for it.

   There is no cheap way to make it. The chain's cost is close to linear
   in pixels (1381 ms at 640, 5293 at 1280) and spread over a dozen
   stages, so there is no one stage to cut: the only superlinear one is
   CastShadows, at 34% of a 1280 tile, and marching it at half
   resolution saves 22% overall while visibly deepening every small
   crater's shadow -- a different picture, not the same one cheaper.

   What is left is to stop it being in the way. The chain has no DOM in
   it, so it runs here off the main thread: the coarse tile lands at
   once and carries the view, and the fine one replaces it when it
   arrives. Five seconds costs nothing anybody can feel if the page
   never stops.
   -------------------------------------------------------------------- */
/* --- the GPU path -----------------------------------------------------
   The per-pixel half of the chain, as fragment shaders. Profiled, a
   1498 px view is about four seconds of JavaScript and it is four
   seconds of exactly what a GPU is for: octaves of value noise, a
   crater field, a hillshade and a horizon march, none of it dependent
   on its neighbours except through one height field. The game already
   makes this move -- src/TerrainGen/terrain_gpu.cpp -- and picks the
   GPU by timing it rather than by trusting it.

   Same here, because trusting it would be wrong: a browser falling back
   to a software rasteriser reports a working WebGL2 and then runs the
   shader on the CPU, which measured here at roughly what the JavaScript
   costs. So the probe renders a small tile and the GPU only gets the
   work if the extrapolation beats what the workers were going to do.
   -------------------------------------------------------------------- */
let GPU = null, GPU_WHY = "not tried";
let GPU_FIXED = 0, GPU_PER_PX = 0;    // t = fixed + perPx * pixels
// The question is not "is the GPU fast in the abstract", it is "is the
// GPU faster than the workers". A first cut used an absolute 260 ms and
// turned down a real card that estimated 623 ms against a CPU tile of
// 2500 -- four times faster, refused. So: a ceiling only for tiles
// nobody would wait for, and below that, whatever wins.
const GPU_CEILING_MS = 1500;
let CPU_FINE_MS = 0;                  // what the workers last actually took
function StartGPU(){
  if (typeof TerrainGPU === "undefined"){ GPU_WHY = "no module"; return; }
  let g;
  try { g = TerrainGPU.Create(); } catch (e){ GPU_WHY = "create threw"; return; }
  if (!g){ GPU_WHY = "no webgl2 / no float targets"; return; }
  if (g.error){ GPU_WHY = "shader: " + g.error.slice(0, 60); return; }
  // Two sizes, so the fixed cost of a draw -- uploads, state, the
  // readback that forces the pipeline to drain -- can be told apart from
  // the cost per pixel. Scaling one small probe by area counts that
  // fixed part once per pixel and over-estimates a big tile badly.
  const mk = (res) => ({ res, macro: new Float32Array(res * res).fill(0.45),
                  frame: TC.MakeNoiseFrame(26.13, 3.63, res * 0.0015, res, 0),
                  spanKm: res * 0.0015,
                  tune: Tune(), craters: TC.CRATERS,
                  craterParams: TC.DEFAULT_CRATER, originLat: 26.13, originLon: 3.63 });
  const time = (res) => { const p = mk(res); g.Render(p);
                          const t = performance.now(); g.Render(p);
                          return performance.now() - t; };
  let tA, tB;
  try { tA = time(256); tB = time(512); } catch (e){ GPU_WHY = "render threw"; return; }
  const nA = 256 * 256, nB = 512 * 512;
  GPU_PER_PX = Math.max(0, (tB - tA) / (nB - nA));
  GPU_FIXED = Math.max(0, tA - GPU_PER_PX * nA);
  GPU = g;
  GPU_WHY = g.renderer;
}
function GpuEstimate(res){ return GPU_FIXED + GPU_PER_PX * res * res; }
// Crisp only. The shaders drop the softening steps the way `crisp`
// does -- the grit blur, the hillshade smooth, the wide shadow blur --
// so on Smooth they would draw a sharper picture than the CPU does, and
// a path that changes the look is not a fallback. Smooth stays on the
// workers.
// g=1 in the hash overrides the probe, g=0 refuses the GPU outright.
// The override earns its place twice over: it is the only way to
// exercise this path where the probe is right to say no, and if the
// probe is wrong on somebody's machine they can say so.
function GpuWorth(){
  if (st.gpu === 0) return false;
  if (!GPU || !Crisp()) return false;
  if (st.gpu === 1) return true;
  const est = GpuEstimate(FineRes());
  if (est > GPU_CEILING_MS) return false;
  // Until the workers have been timed there is nothing to beat, so the
  // GPU gets the benefit of the doubt at anything quick; after that it
  // has to actually win.
  return CPU_FINE_MS ? est < CPU_FINE_MS * 0.7 : est <= 400;
}

let WORK = null;                      // { fast, fine[] } or null on file://
// How many ways the fine tile is cut. Four pieces on four workers is
// the shape that fits a laptop: nine would need nine cores to be worth
// more, and on four it is three rounds instead of one.
let SPLIT = 1;
function StartWorkers(){
  try {
    const mk = () => {
      const w = new Worker("regolith_worker.js");
      w.onerror = () => { WORK = null; SyncRefine(); };
      w.onmessage = OnWorker;
      return w;
    };
    const cores = navigator.hardwareConcurrency || 2;
    // Four pieces need four cores. The page's own thread is idle while
    // they build -- it is waiting for them -- so it does not need one of
    // its own. Below four the split would just be queueing.
    //
    // Nine pieces is left alone deliberately. The worker handles any n,
    // and n=3 renders correctly, but hardwareConcurrency counts threads
    // rather than cores: a six-core machine says twelve, and nine pieces
    // on six cores is two rounds where four is one. Tried at a faked
    // twelve on a four-core box, x1.6 went 5.4 -> 7.7 s. It needs a
    // machine with nine real cores to pay, and that cannot be detected
    // from here.
    SPLIT = cores >= 4 ? 2 : 1;
    const fine = [];
    for (let i = 0; i < SPLIT * SPLIT; i++) fine.push(mk());
    // The fast worker is its own, because a refine takes seconds and
    // must not sit in front of the tile the hand is waiting for.
    WORK = { fast: mk(), fine };
  } catch (e){ WORK = null; }         // file:// has no origin to load from
}
function EachFine(fn){ WORK.fine.forEach(fn); }

/* --- the supersample ratio --------------------------------------------
   The lever this page is really for.

   Zooming out fast from the floor shows the tile MINIFIED -- measured,
   down to 0.29 destination pixels per tile pixel, so 3.4x supersampled
   -- and that frame looks better than anything the page settles to:
   neither staggered nor vague. It is not an accident of the zoom. The
   chain's finest content is a 3-pixel noise wavelength and a 2.5-pixel
   crater, both right at Nyquist, and drawn one-to-one they alias. Draw
   them into fewer screen pixels than they were made in and the average
   over each screen pixel resolves them instead.

   So the ratio is: tile pixels per screen pixel. 1.0 is one-to-one; 2.0
   builds four times the pixels and lets the browser average them down.
   Cost is the square of it, and that is the whole trade.

   Two alternatives were measured against a converged reference (ratio 3)
   at a 2.5 km window, as RMS distance from what the picture actually is:

     ratio 1.0, as it was          2.6 s    11.07 / 255
     band-limit the octaves at 6px 2.2 s    11.43     <- worse AND vaguer
     ratio 1.3                     4.3 s    10.05
     ratio 1.6                     8.3 s     8.40
     ratio 2.0                    14.8 s     6.05

   Band-limiting -- stopping the octaves further above the pixel, the
   classic cheap answer to aliasing -- trades staggered for vague and
   lands further from the truth, which is exactly the trade to refuse.
   Scaling the chain's own softening (blurScale, tried and removed) did
   nothing at all: 6.45 / 6.47 / 6.48 high-frequency energy at scale
   1.0 / 0.5 / 0.0, images indistinguishable. Supersampling is the only
   lever that moves it, and there is no knee -- you get what you pay for.
   -------------------------------------------------------------------- */
const SUPER_STEPS = [0, 1.0, 1.3, 1.6, 2.0, 2.5];
// The fine tile does not need the coarse one's 18% overhang: the coarse
// tile stays underneath it as a backdrop, so a small pan exposes soft
// ground rather than black. At ratio 2 that margin would have cost 29%
// of a 30-second tile.
const FINE_MARGIN = 1.04;
// Somewhere the wait stops being a playtest. 3400 px is about 11 Mpx and
// the better part of a minute; past that the ratio is quietly clamped
// and the readout says the ratio actually achieved.
const FINE_MAX_PX = 3400, REFINE_MS = 320;
function FineRes(){
  const long = Math.max(CV.width, CV.height) * FINE_MARGIN;
  return Math.min(FINE_MAX_PX, Math.ceil(long * st.super));
}
function FineRatio(){          // what the cap actually left us with
  return FineRes() / (Math.max(CV.width, CV.height) * FINE_MARGIN);
}
// Worth refining unless what is on screen is ALREADY the right fine
// tile for this view. Written as "is the fine tile bigger than the
// current one" it said no whenever the current one happened to be a
// stale fine tile of the same size -- and now that a coarse tile can be
// skipped entirely, that was the difference between a stale view and no
// view at all.
function RefineWorth(){
  if (!WORK || st.super <= 0 || Hard() || !st.tile) return false;
  if (st.tile.fine && st.tile.canvas.width === FineRes() && StillFits(st.tile)) return false;
  // And only if it would actually read the ground more finely than the
  // coarse tile does; on a small window at x1.0 it does not.
  const fineKm = (st.spanKm * FINE_MARGIN) / FineRes();
  const coarseKm = (st.spanKm * TILE_MARGIN) / WantedRes();
  return fineKm < coarseKm * 0.98;
}

// The last few fine tiles, kept. Trying a level, going back and trying
// it again is how anybody looks at a zoom, and the second visit has no
// business costing what the first one did.
const FINE_KEEP = 6;
let fineCache = [];
function CachedFine(){
  const want = FineRes();
  for (let i = fineCache.length - 1; i >= 0; i--){
    const t = fineCache[i];
    if (t.canvas.width === want && StillFits(t)) return t;
  }
  return null;
}
function KeepFine(t){
  fineCache = fineCache.filter(x => x !== t);
  fineCache.push(t);
  while (fineCache.length > FINE_KEEP) fineCache.shift();
}

let fineTimer = null, fineAgain = false;
function ArmRefine(){
  clearTimeout(fineTimer);
  if (!RefineWorth()) return;
  // A tile already built for this view goes up now rather than in
  // fifteen seconds.
  const had = CachedFine();
  if (had){
    st.prev = st.tile; st.tile = had; st.fade = st.prev ? 0 : 1;
    st.fineRes = had.canvas.width; st.fineMs = 0;
    st.dirty = true; KeepFine(had); Hud();
    return;
  }
  fineTimer = setTimeout(() => {
    if (!RefineWorth()) return;
    // One fine tile in flight at a time. It cannot be cancelled once the
    // worker starts -- the chain is a blocking loop -- but it must not
    // have a second queued behind it: measured on a zoom across a rung,
    // that was 31 seconds spent on a tile for a view already left,
    // before the one that mattered even started.
    if (st.fining){ fineAgain = true; return; }
    st.fining = true; Hud();
    AskFine();
  }, REFINE_MS);
}

// One view request. `fine` only marks which reply it is, so the HUD can
// say which picture is on screen.
function Ask(w, res, fine, margin){
  const id = ++st.reqId;
  w.postMessage({ cmd: "view", id, epoch: st.epoch, fine, res, margin,
                  spanKm: Math.max(0.05, st.spanKm * margin),
                  offX: st.cxKm - st.cacheCx, offY: st.cyKm - st.cacheCy,
                  cxKm: st.cxKm, cyKm: st.cyKm });
}

// The fine tile, cut into SPLIT x SPLIT pieces and handed to one worker
// each. The padding has to cover the widest thing the chain reads across
// a pixel: the shadow march, 22*k where k is the PIECE's res over 300.
// cell/10 solves pad >= 22*(cell + 2*pad)/300 with room over.
let fineSet = null;
function AskFine(){
  // On the GPU the tile is one draw, so there is nothing to cut up: the
  // worker is asked only for the macro, which is the rung ladder and the
  // crop, and the shaders do the rest here.
  if (GpuWorth()){
    const id = ++st.reqId;
    fineSet = { id, epoch: st.epoch, gpu: true, dead: false, t0: performance.now() };
    WORK.fine[0].postMessage({ cmd: "macro", id, epoch: st.epoch, fine: true,
                               res: FineRes(), margin: FINE_MARGIN,
                               spanKm: Math.max(0.05, st.spanKm * FINE_MARGIN),
                               offX: st.cxKm - st.cacheCx, offY: st.cyKm - st.cacheCy,
                               cxKm: st.cxKm, cyKm: st.cyKm });
    return;
  }
  const n = SPLIT;
  const cell = Math.ceil(FineRes() / n), res = cell * n;
  const id = ++st.reqId;
  const c = document.createElement("canvas");
  c.width = c.height = res;
  fineSet = { id, epoch: st.epoch, n, cell, res, got: 0, dead: false,
              canvas: c, ctx: c.getContext("2d"), t0: performance.now() };
  const pad = n > 1 ? Math.ceil(cell / 10) : 0;
  const base = { cmd: "view", id, epoch: st.epoch, fine: true, res,
                 margin: FINE_MARGIN,
                 spanKm: Math.max(0.05, st.spanKm * FINE_MARGIN),
                 offX: st.cxKm - st.cacheCx, offY: st.cyKm - st.cacheCy,
                 cxKm: st.cxKm, cyKm: st.cyKm };
  if (n === 1){ WORK.fine[0].postMessage(base); return; }
  let k = 0;
  for (let j = 0; j < n; j++)
    for (let i = 0; i < n; i++, k++)
      WORK.fine[k].postMessage(Object.assign({}, base, { part: { i, j, n, cell, pad } }));
}

// One piece home. The padding is dropped here rather than in the worker
// so the transfer stays a single buffer.
function TakePart(m){
  if (!fineSet.dead){
    const { i, j, cell, pad } = m.part, sub = m.subRes;
    const tmp = document.createElement("canvas");
    tmp.width = tmp.height = sub;
    tmp.getContext("2d").putImageData(new ImageData(m.rgba, sub, sub), 0, 0);
    fineSet.ctx.drawImage(tmp, pad, pad, cell, cell, i * cell, j * cell, cell, cell);
    fineSet.craters = m.craters; fineSet.pop = m.popCraters;
  }
  return ++fineSet.got === fineSet.n * fineSet.n;
}

// A tile that arrives after the view has moved on is not wrong, it is
// late. The test is the one MaybeRegenerate uses to decide a tile still
// fits, so "still good" means the same thing in both places.
function StillFits(m){
  const drift = Math.abs(Math.log(st.spanKm * m.margin / m.spanKm));
  const moved = Math.hypot(st.cxKm - m.cxKm, st.cyKm - m.cyKm);
  return drift <= 0.113 && moved <= st.spanKm * 0.035;
}

function OnWorker(e){
  const m = e.data;
  if (m.cmd === "block" || m.cmd === "place") return;
  if (m.cmd === "mini"){
    if (m.epoch === st.epoch){ st.mini = LumCanvas(m.lum, m.res, m.spanKm); st.dirty = true; }
    return;
  }
  // The macro half is home; the shaders finish it.
  if (m.cmd === "macro"){
    if (!fineSet || m.id !== fineSet.id) return;
    st.fining = false;
    if (fineAgain){ fineAgain = false; ArmRefine(); }
    const set = fineSet; fineSet = null;
    if (m.stale || set.dead || m.epoch !== st.epoch){ Hud(); return; }
    let out;
    try {
      out = GPU.Render({ res: m.res, macro: m.lum, frame: m.frame, spanKm: m.spanKm,
                         tune: Tune(), craters: TC.CRATERS,
                         craterParams: TC.DEFAULT_CRATER,
                         originLat: st.originLat, originLon: st.originLon });
    } catch (e){ GPU = null; GPU_WHY = "render threw"; Hud(); Regenerate(); return; }
    // The GL canvas is reused by the next render, so the tile takes a
    // copy of it rather than a reference.
    const c = document.createElement("canvas");
    c.width = c.height = m.res;
    c.getContext("2d").drawImage(out.canvas, 0, 0);
    const whole = { canvas: c, spanKm: m.spanKm, margin: m.margin,
                    cxKm: m.cxKm, cyKm: m.cyKm, kmPerPx: m.kmPerPx,
                    craters: 0, pop: 0, fine: true };
    if (!StillFits(whole)){ Hud(); return; }
    st.prev = st.tile; st.tile = whole; st.fade = st.prev ? 0 : 1;
    st.dirty = true; KeepFine(whole);
    st.fineMs = performance.now() - set.t0;
    st.fineRes = m.res;
    Hud(); WriteHash();
    return;
  }

  if (m.cmd !== "view") return;

  // A piece of a split tile: nothing is decided until the last one is
  // in. Every piece of the set has to be counted even once the set is
  // known to be worthless, because "still building" is cleared by the
  // last arrival -- abandoning the set on the first stale piece left the
  // page waiting for a tile nobody was going to send, and no refine ever
  // fired again.
  if (m.part){
    if (!fineSet || m.id !== fineSet.id) return;   // a set already retired
    if (!TakePart(m)) return;                      // still missing pieces
    st.fining = false;
    if (fineAgain){ fineAgain = false; ArmRefine(); }
    const set = fineSet; fineSet = null;
    if (set.dead || m.epoch !== st.epoch){ Hud(); return; }
    const whole = { canvas: set.canvas, spanKm: m.spanKm, margin: m.margin,
                    cxKm: m.cxKm, cyKm: m.cyKm, kmPerPx: m.kmPerPx,
                    craters: set.craters, pop: set.pop, fine: true };
    if (!StillFits(whole)){ Hud(); return; }
    st.prev = st.tile; st.tile = whole; st.fade = st.prev ? 0 : 1;
    st.dirty = true; KeepFine(whole);
    // The wall time, not the slowest piece: what was actually waited.
    st.fineMs = performance.now() - set.t0;
    CPU_FINE_MS = st.fineMs;         // the number the GPU has to beat
    st.fineRes = set.res;
    Hud(); WriteHash();
    return;
  }

  // The bookkeeping happens whatever the reply turned out to be worth,
  // or a dropped one leaves the page thinking it is still waiting.
  if (m.fine){
    st.fining = false;
    if (fineAgain){ fineAgain = false; ArmRefine(); }
  } else { genPending = false; Busy(false); }
  if (m.stale || m.epoch !== st.epoch){         // a different place or look
    if (!m.fine && askAgain){ askAgain = false; Regenerate(); }
    return;
  }
  if (!m.fine && askAgain){                     // the view moved while it built
    askAgain = false; Regenerate();
  }
  if (!StillFits(m)){                            // late; the view moved on
    if (!m.fine) MaybeRegenerate();
    Hud();
    return;
  }
  Install(m);
  if (m.fine){ st.fineMs = m.ms; st.fineRes = m.res; }
  else { st.genMs = m.ms; st.genCount++; st.fineRes = 0; ArmRefine(); }
  Hud(); WriteHash();
}

/* --- what may replace what --------------------------------------------
   The flicker this exists to stop: sitting on a supersampled tile,
   zooming in, and watching the view go super -> sharp -> super. The
   middle state is the COARSE tile arriving. It is newer, and it was
   taking the screen for that reason alone, but it samples the ground
   two or three times less finely than the stretched tile it replaced.
   Newer is not better. Finer is better.

   So a tile only takes the front if it reads the ground at least as
   finely as what is already there. Otherwise it goes behind, as the
   backdrop, and the stretched one stays in front until its own
   replacement is ready.
   -------------------------------------------------------------------- */
// How much of the window a tile actually spans, along its worse axis.
function CoverFrac(t){
  if (!t) return 0;
  const half = t.spanKm / 2;
  const fx = (half - Math.abs(st.cxKm - t.cxKm)) / (st.spanKm / 2);
  const fy = (half - Math.abs(st.cyKm - t.cyKm)) / (st.spanKm / 2);
  return Math.max(0, Math.min(fx, fy));
}
// A stretched tile stops being worth keeping once it is a small window
// onto better ground in the middle of coarser ground: that reads as a
// patch, which is its own kind of flicker.
const KEEP_COVER = 0.30;
// Only a SUPERSAMPLED tile is held. Holding one coarse tile in front of
// a newer coarse one is not the point and has no end: with Super off
// there is no finer tile coming, so a zoom-out sat on stale ground
// indefinitely -- measured, 4.61 m/px still on screen at a span that
// wanted 13.6.
function Finer(t){
  return t && t.fine && t.kmPerPx && CoverFrac(t) >= KEEP_COVER;
}

function Install(m){
  const c = document.createElement("canvas");
  c.width = c.height = m.res;
  c.getContext("2d").putImageData(new ImageData(m.rgba, m.res, m.res), 0, 0);
  const t = { canvas: c, spanKm: m.spanKm, cxKm: m.cxKm, cyKm: m.cyKm, margin: m.margin,
              craters: m.craters, pop: m.popCraters, kmPerPx: m.kmPerPx, fine: !!m.fine };
  // The coarse tile stays as a backdrop under whatever is in front,
  // which is what lets the fine one be built barely wider than the
  // window: a pan between tiles exposes soft ground instead of black.
  if (!m.fine) st.base = t; else KeepFine(t);
  if (!m.fine && Finer(st.tile) && m.kmPerPx > st.tile.kmPerPx * 1.02){
    st.dirty = true;              // behind only; the front is still better
    return;
  }
  st.prev = st.tile;
  st.tile = t;
  st.fade = st.prev ? 0 : 1;
  st.dirty = true;
}

/* --- km <-> lat/lon, about the region's own origin -------------------- */
const KMDEG = TC.MOON_KM_PER_DEG, D2R = TC.DEG2RAD;
function LatLonAt(cxKm, cyKm){
  const lat = st.originLat - cyKm / KMDEG;
  const lon = st.originLon + cxKm / (KMDEG * Math.cos(lat * D2R));
  return [lat, lon];
}

/* --- generating -------------------------------------------------------
   Two costs, kept apart. Building the cache walks the wide rungs and is
   paid once per PLACE; a view is one rung and is paid per ZOOM. That is
   the whole reason a zoom can regenerate while it is still moving.
   -------------------------------------------------------------------- */
// Hard pixels only work if the tile is sharp AT ITS OWN RESOLUTION
// first: nearest-neighbour does not create detail, it only stops the
// browser from smearing what is there. `crisp` drops the softening
// steps that exist because the picture was going to be resampled.
// The two questions turned out to be separate, so they are separate
// predicates: whether the chain SOFTENS what it makes, and whether the
// browser softens it again on the way to the screen.
const Crisp = () => st.style >= 1;      // the chain's own blurs dropped
const Hard  = () => st.style >= 2;      // whole-pixel draw, no smoothing
function Tune(){
  return Object.assign({}, TC.DEFAULT_TUNE, {
    crisp: Crisp() ? 1 : 0,
    bands: st.style === 3 ? 9 : 0
  });
}

// In hard mode the tile size is dictated by the window, not chosen: one
// tile pixel has to land on a whole number of screen pixels or some
// become 3 wide and some 4, which shimmers as you move. So the tile is
// however big it needs to be for the block size asked for -- and if that
// would cost too much, the block gets bigger instead of the rule bending.
const RES_CAP = 820;
// Smooth mode's only real answer to softness is more pixels, so it can go
// all the way to one tile pixel per screen pixel -- FIT, no upscale at
// all. It is the honest experiment and it is not free: cost grows faster
// than res^2, because a finer tile also opens more sub-floor octaves.
// Measured here: 640 -> 401 ms, 800 -> 514, 1024 -> 936, 1280 -> 1924.
const FIT_CAP = 1600;
function FitRes(){
  return Math.min(FIT_CAP, Math.ceil(Math.max(CV.width, CV.height) * TILE_MARGIN));
}
function WantedRes(){
  if (!Hard()) return st.res === 0 ? FitRes() : st.res;
  const long = Math.max(CV.width, CV.height) * TILE_MARGIN;
  const f = Math.max(st.px, Math.ceil(long / RES_CAP));
  return Math.ceil(long / f);
}

function BuildCache(then){
  const [lat, lon] = LatLonAt(st.cxKm, st.cyKm);
  st.epoch++;
  clearTimeout(fineTimer); st.fining = false; st.fineRes = 0;
  fineCache = [];
  if (fineSet) fineSet.dead = true;
  if (WORK){
    // Nothing is built here: the chains live in the workers and are made
    // on demand, one rung at a time, for whatever resolution is asked
    // for. The page only waits for pictures.
    const msg = { cmd: "place", epoch: st.epoch, lat, lon, tune: Tune(),
                  originLat: st.originLat, originLon: st.originLon };
    WORK.fast.postMessage(msg); EachFine(w => w.postMessage(msg));
    if (then) then();
    // The locator inset, behind the tile the eye is waiting for.
    WORK.fast.postMessage({ cmd: "mini", epoch: st.epoch,
                            res: WantedRes(), spanKm: 100.0 });
    return;
  }
  Busy(true);
  setTimeout(() => {
    st.lc = TC.MakeLiveChain({
      block: st.block, lat, lon, res: WantedRes(),
      tune: Tune(), craters: TC.CRATERS,
      craterParams: TC.DEFAULT_CRATER,
      originLat: st.originLat, originLon: st.originLon
    });
    st.mini = RungCanvas(st.lc, 100.0);   // wider than any view, so the box always fits
    Busy(false);
    if (then) then();
  }, 16);
}
// One cached rung as a picture, for the inset that says where you are.
function LumCanvas(lum, res, spanKm){
  const c = document.createElement("canvas");
  c.width = c.height = res;
  const g = c.getContext("2d"), img = g.createImageData(res, res);
  // The mare is genuinely dark; the inset is a locator, so it is lifted
  // to be readable rather than left faithful.
  for (let i = 0; i < res * res; i++){
    TC.RampColor(Math.min(1, lum[i] * 1.55 + 0.06), img.data, i * 4);
  }
  g.putImageData(img, 0, 0);
  return { canvas: c, spanKm };
}
function RungCanvas(lc, spanKm){
  let best = lc.rungs[0];
  for (const r of lc.rungs) if (Math.abs(r.spanKm - spanKm) < Math.abs(best.spanKm - spanKm)) best = r;
  return LumCanvas(best.lum, lc.res, best.spanKm);
}

function TileCanvas(view){
  const c = document.createElement("canvas");
  c.width = c.height = view.res;
  c.getContext("2d").putImageData(
    new ImageData(view.rgba, view.res, view.res), 0, 0);
  return c;
}

let genPending = false, askAgain = false;
function Regenerate(){
  if (WORK){
    clearTimeout(fineTimer); fineAgain = false;
    if (fineSet) fineSet.dead = true;
    // One request in flight at a time. A worker is a queue, and a drag
    // that posts on every frame would fill it with tiles for places the
    // view has already left -- each one built in full before the one
    // that matters. So the extra asks collapse into a single "again".
    if (genPending){ askAgain = true; return; }
    genPending = true; Busy(true);
    Ask(WORK.fast, WantedRes(), false, TILE_MARGIN);
    return;
  }
  if (!st.lc || genPending) return;
  genPending = true;
  Busy(true);
  setTimeout(() => {
    // A little wider than the window: a zoom can then drift outward
    // before the next tile lands without opening a gap at the edges.
    // The offset from the cache centre is handed to the view, so panning
    // costs one rung like zooming does instead of a whole rebuild.
    const cx = st.cxKm, cy = st.cyKm;
    const v = st.lc.View(Math.max(0.05, st.spanKm * TILE_MARGIN),
                         cx - st.cacheCx, cy - st.cacheCy);
    st.prev = st.tile;
    st.tile = { canvas: TileCanvas(v), spanKm: v.spanKm, margin: TILE_MARGIN,
                cxKm: cx, cyKm: cy,
                craters: v.craters, pop: v.popCraters, kmPerPx: v.kmPerPx };
    st.base = st.tile;
    st.fade = st.prev ? 0 : 1;
    st.genMs = v.ms; st.genCount++;
    genPending = false; Busy(false); st.dirty = true;
    Hud(); WriteHash();
  }, 0);
}
// Regenerate once the zoom has drifted far enough from the tile it is
// stretching -- about 12% either way, which is where the softening starts
// to read on a dark surface.
function MaybeRegenerate(){
  if (!st.tile){ Regenerate(); return; }
  // Past the widest cached rung there is nothing left to crop from, so
  // that -- and only that -- is what makes a pan rebuild the cache. The
  // test is the one View() itself applies: half the tile plus however far
  // the view has walked, against half the macro. Written with the whole
  // span instead of half, a 50 km window rebuilt the cache on every
  // regeneration while sitting perfectly still.
  const reach = Math.max(Math.abs(st.cxKm - st.cacheCx),
                         Math.abs(st.cyKm - st.cacheCy))
              + st.spanKm * TILE_MARGIN / 2;
  if (reach > TC.LIVE_RUNGS[0] * 0.47){
    clearTimeout(settleTimer);
    settleTimer = setTimeout(() => Recentre(), WantedRes() < HEAVY_RES ? 0 : SETTLE_MS);
    return;
  }
  // Against the tile's own margin: a fine tile is built at 1.04 and
  // comparing it to 1.18 reads as 12% of drift the moment it lands,
  // which had every refine immediately order its own replacement.
  const drift = Math.abs(Math.log(st.spanKm * (st.tile.margin || TILE_MARGIN)
                                  / st.tile.spanKm));
  const moved = Math.hypot(st.cxKm - st.tile.cxKm, st.cyKm - st.tile.cyKm);
  if (drift <= 0.113 && moved <= st.spanKm * 0.035){
    ArmRefine();             // still where it was: sharpen it in place
    return;
  }
  // A coarse tile that would land coarser than what is on screen is not
  // worth building -- it would cost worker time the fine tile needs, to
  // put a worse picture in front of a better one -- but only when the
  // tile on screen COVERS the window. Zooming out it does not, and
  // skipping the coarse one there left black down both sides where the
  // backdrop should have been: the coarse tile is still the thing that
  // fills the frame, it just does it from behind now.
  const wouldBe = (st.spanKm * TILE_MARGIN) / WantedRes();
  if (RefineWorth() && CoverFrac(st.tile) >= 1.0
      && wouldBe > st.tile.kmPerPx * 1.02){
    ArmRefine(); return;         // a better one is coming; skip the worse one
  }
  Schedule();
}

// Generation is synchronous: a big tile freezes the page for as long as it
// takes, and at 1280 that is seconds. Small tiles can be built as the view
// moves and it still feels connected; big ones cannot, so they wait until
// the hand stops. The stretched tile carries the view meanwhile, which is
// the same bargain the whole thing already runs on.
const HEAVY_RES = 760, SETTLE_MS = 380;
let settleTimer = null;
function Schedule(){
  clearTimeout(settleTimer);
  // In a worker nothing freezes, so there is nothing to wait for.
  if (WORK || WantedRes() < HEAVY_RES){ Regenerate(); return; }
  settleTimer = setTimeout(() => Regenerate(), SETTLE_MS);
}

function Busy(on){
  st.busy = on;
  document.getElementById("busy").classList.toggle("on", on);
}

/* --- drawing ----------------------------------------------------------
   The tile is generated a little wider than the window (TILE_MARGIN), so
   a zoom can drift outward before the next one lands without opening a
   gap at the edges. Between regenerations the tile is simply scaled: the
   ground stretches for a fraction of a second and then sharpens, which
   is the honest way to show that it is being made on the way in.
   -------------------------------------------------------------------- */
const TILE_MARGIN = 1.18;
const COL = { text:"#c9d8e8", dim:"#61768a", dimmer:"#3f5163",
              am:"#d9962f", amLit:"#f4c66a", cy:"#50e1ff", rule:"#1c2a39" };
const MONO = (w, s) => `${w} ${s}px "JetBrains Mono", ui-monospace, monospace`;
let DPR = 1;

const COARSE = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
function Resize(){
  // A phone's 3x backing store would ask a 384 tile to cover ~2000 px.
  // The ground is a soft image; 1x there costs nothing anyone can see and
  // saves the fill as well as the upscale.
  DPR = COARSE ? 1 : Math.min(2, window.devicePixelRatio || 1);
  CV.width = Math.round(CV.clientWidth * DPR);
  CV.height = Math.round(CV.clientHeight * DPR);
  st.dirty = true;
}
window.addEventListener("resize", Resize);

function PxPerKm(){ return Math.max(CV.width, CV.height) / st.spanKm; }

/* --- feathering a held tile -------------------------------------------
   A supersampled tile held over a coarse backdrop ends somewhere, and
   on a zoom-out that end is a straight vertical line with sharper
   ground on one side of it. Fading the tile's outer eighth into the
   backdrop turns the line into a gradient nobody reads as an edge.
   Only when it is actually needed: a tile that covers the window has no
   edge on screen to hide.
   -------------------------------------------------------------------- */
let maskCv = null, scratch = null;
function FeatherMask(){
  if (maskCv) return maskCv;
  const N = 128, e = Math.round(N * 0.13);
  maskCv = document.createElement("canvas"); maskCv.width = maskCv.height = N;
  const g = maskCv.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, N, N);
  g.globalCompositeOperation = "destination-out";
  const ramp = (x0, y0, x1, y1) => {
    const gr = g.createLinearGradient(x0, y0, x1, y1);
    gr.addColorStop(0, "rgba(0,0,0,1)"); gr.addColorStop(1, "rgba(0,0,0,0)");
    return gr;
  };
  g.fillStyle = ramp(0, 0, e, 0);     g.fillRect(0, 0, e, N);
  g.fillStyle = ramp(N, 0, N - e, 0); g.fillRect(N - e, 0, e, N);
  g.fillStyle = ramp(0, 0, 0, e);     g.fillRect(0, 0, N, e);
  g.fillStyle = ramp(0, N, 0, N - e); g.fillRect(0, N - e, N, e);
  return maskCv;
}
function Scratch(){
  if (!scratch) scratch = document.createElement("canvas");
  if (scratch.width !== CV.width || scratch.height !== CV.height){
    scratch.width = CV.width; scratch.height = CV.height;
  }
  return scratch;
}

function DrawTile(t, alpha, feather){
  if (!t) return;
  const p = PxPerKm();
  let size = t.spanKm * p;
  let dx = CV.width / 2 + (t.cxKm - st.cxKm) * p - size / 2;
  let dy = CV.height / 2 + (t.cyKm - st.cyKm) * p - size / 2;
  let hard = false;
  if (Hard()){
    // Snap to a whole number of screen pixels per tile pixel, and snap
    // the corner to the pixel grid as well -- a half-pixel origin gives
    // ragged block edges even at an exact scale. If the zoom has drifted
    // too far from a whole number since the last tile, fall back to
    // smoothing until the next one lands: soft for a moment beats
    // shimmering.
    const f = size / t.canvas.width;
    const F = Math.max(1, Math.round(f));
    if (Math.abs(f - F) < 0.06 * F){
      const cx = dx + size / 2, cy = dy + size / 2;
      size = t.canvas.width * F;
      dx = Math.round(cx - size / 2);
      dy = Math.round(cy - size / 2);
      hard = true;
    }
  }
  CTX.globalAlpha = alpha;
  CTX.imageSmoothingEnabled = !hard;
  CTX.imageSmoothingQuality = "high";
  if (feather){
    const sc = Scratch(), sx = sc.getContext("2d");
    sx.clearRect(0, 0, sc.width, sc.height);
    sx.imageSmoothingEnabled = !hard;
    sx.imageSmoothingQuality = "high";
    sx.drawImage(t.canvas, dx, dy, size, size);
    sx.globalCompositeOperation = "destination-in";
    sx.drawImage(FeatherMask(), dx, dy, size, size);
    sx.globalCompositeOperation = "source-over";
    CTX.drawImage(sc, 0, 0);
  } else {
    CTX.drawImage(t.canvas, dx, dy, size, size);
  }
  CTX.globalAlpha = 1;
}

function ScaleBar(){
  const p = PxPerKm() / DPR, W = CV.width / DPR;
  const want = (W * 0.22) / p;                       // km
  const nice = [0.05,0.1,0.2,0.5,1,2,5,10,20].reduce((a,b) =>
    Math.abs(b - want) < Math.abs(a - want) ? b : a);
  const len = nice * p, x = 16, y = CV.height / DPR - 26;
  CTX.save(); CTX.scale(DPR, DPR);
  CTX.strokeStyle = "rgba(5,8,12,.85)"; CTX.lineWidth = 4.5;
  CTX.beginPath(); CTX.moveTo(x, y); CTX.lineTo(x + len, y); CTX.stroke();
  CTX.strokeStyle = COL.text; CTX.lineWidth = 1.7;
  CTX.beginPath();
  CTX.moveTo(x, y - 4.5); CTX.lineTo(x, y + 4.5);
  CTX.moveTo(x, y); CTX.lineTo(x + len, y);
  CTX.moveTo(x + len, y - 4.5); CTX.lineTo(x + len, y + 4.5);
  CTX.stroke();
  const lab = nice < 1 ? Math.round(nice * 1000) + " m" : nice + " km";
  CTX.font = MONO(700, 11); CTX.textBaseline = "bottom";
  const tw = CTX.measureText(lab).width;
  CTX.fillStyle = "rgba(5,8,12,.75)"; CTX.fillRect(x - 2, y - 22, tw + 8, 14);
  CTX.fillStyle = COL.text; CTX.fillText(lab, x + 2, y - 10);
  CTX.restore();
}

// Where you are inside the sect you started in.
function MiniMap(){
  if (!st.mini) return;
  const W = CV.width / DPR, H = CV.height / DPR;
  const narrow = W < 820;                       // the phone layout
  const S = narrow ? 92 : 118, m = 14;
  // Bottom-right on a desktop; under the top-right readout on a phone,
  // where the scrolling region strip is not.
  const x = W - S - m, y = narrow ? 96 : H - S - m - 34;
  CTX.save(); CTX.scale(DPR, DPR);
  CTX.globalAlpha = 0.92;
  CTX.drawImage(st.mini.canvas, x, y, S, S);
  CTX.globalAlpha = 1;
  CTX.strokeStyle = COL.rule; CTX.lineWidth = 1;
  CTX.strokeRect(x + 0.5, y + 0.5, S - 1, S - 1);
  const f = st.spanKm / st.mini.spanKm;
  const bx = x + S / 2 + (st.cxKm - st.cacheCx) / st.mini.spanKm * S;
  const by = y + S / 2 + (st.cyKm - st.cacheCy) / st.mini.spanKm * S;
  const bs = Math.max(3, S * f);
  CTX.strokeStyle = COL.amLit; CTX.lineWidth = 1.4;
  CTX.strokeRect(bx - bs / 2, by - bs / 2, bs, bs);
  CTX.font = MONO(700, 9.5); CTX.fillStyle = COL.dimmer;
  CTX.textBaseline = "top"; CTX.textAlign = "right";
  CTX.fillText(st.mini.spanKm + " KM · WHERE YOU ARE", x + S, y - 12);
  CTX.textAlign = "left";
  CTX.restore();
}

function Draw(){
  CTX.fillStyle = "#05080c";
  CTX.fillRect(0, 0, CV.width, CV.height);
  if (!st.tile){
    CTX.save(); CTX.scale(DPR, DPR);
    CTX.font = MONO(700, 12); CTX.fillStyle = COL.dim;
    CTX.textAlign = "center"; CTX.textBaseline = "middle";
    CTX.fillText("GENERATING THE GROUND",
                 CV.width / DPR / 2, CV.height / DPR / 2);
    CTX.restore();
    return;
  }
  // The backdrop goes down first; anything over it that does not reach
  // the edges of the window is feathered into it.
  const backed = st.base && st.base !== st.tile && st.base !== st.prev;
  if (backed) DrawTile(st.base, 1, false);
  DrawTile(st.prev, 1, backed && CoverFrac(st.prev) < 1.0);
  DrawTile(st.tile, st.fade, backed && CoverFrac(st.tile) < 1.0);
  ScaleBar();
  MiniMap();
}

let last = 0;
function Frame(ts){
  const dt = Math.min(64, ts - last || 16); last = ts;
  if (st.fade < 1){ st.fade = Math.min(1, st.fade + dt / 170); st.dirty = true; }
  else if (st.prev){ st.prev = null; }
  if (st.dirty){ Draw(); st.dirty = false; }
  requestAnimationFrame(Frame);
}

/* --- the readouts ----------------------------------------------------- */
const $ = id => document.getElementById(id);
// The boundaries are the geometric midpoints between the rungs, so a
// level owns the spans it is nearer to than either neighbour.
function LevelOf(span){
  if (span >= Math.sqrt(25.0 * 5.0)) return LEVELS[0];
  if (span >= Math.sqrt(5.0 * 1.0)) return LEVELS[1];
  return LEVELS[2];
}
// The whole-pixel factor this frame would draw at, or 0 if the zoom has
// drifted too far from a whole number since the last tile. Draw() applies
// the same test; this is here so the readout does not lag a frame behind.
function HardFactor(){
  if (!Hard() || !st.tile) return 0;
  const f = (st.tile.spanKm * PxPerKm()) / st.tile.canvas.width;
  const F = Math.max(1, Math.round(f));
  return Math.abs(f - F) < 0.06 * F ? F : 0;
}

// In smooth mode the number that explains the softness is the upscale:
// how many screen pixels each generated pixel is being stretched over.
function SmoothLabel(){
  const tag = Crisp() ? "sharp" : "smooth";
  if (!st.tile) return tag;
  const f = (st.tile.spanKm * PxPerKm()) / st.tile.canvas.width;
  // Below one the tile is being averaged down rather than stretched,
  // which is the state this page exists to reach -- so it gets said, not
  // rounded away into "1:1".
  if (f < 0.94) return `${tag} · ×${(1 / f).toFixed(1)} super`;
  if (f <= 1.06) return `${tag} · 1:1`;
  // A supersampled tile being STRETCHED is still the supersampled tile,
  // and saying only "1.6x up" read as though the coarse one had taken
  // over -- which is exactly the swap this page now refuses to make.
  return `${st.tile.fine ? "super held" : tag} · ${f.toFixed(1)}× up`;
}

function Hud(){
  const L = LevelOf(st.spanKm);
  $("lvl").textContent = `LEVEL ${L.n} · ${L.name}`;
  $("span").textContent = st.spanKm.toFixed(st.spanKm >= 10 ? 1 : 2) + " km";
  const mpp = st.tile ? st.tile.kmPerPx * 1000 : 0;
  $("mpp").textContent = mpp.toFixed(mpp < 10 ? 2 : 1) + " m/px";
  $("place").textContent = REGIONS[st.region].name;
  $("draw").textContent = !Hard() ? SmoothLabel() : HardFactor()
    ? `${HardFactor()}× hard` + (st.style === 3 ? " · banded" : "")
    : "settling…";
  $("gen").textContent = st.genCount
    ? `${st.genMs.toFixed(0)} ms · ${st.genCount}` : "—";
  // A tile over a second is a visible freeze, and the tile size is the
  // player's choice, so the number that says so is worth colouring.
  $("gen").style.color = st.genMs > 1200 ? "var(--am-lit)" : "";
  // The ratio ASKED for and the one the pixel cap left, because on a
  // wide screen at x2.5 they are not the same number.
  const got = FineRatio();
  const asked = st.super > 0 && got < st.super - 0.02 ? ` (of ×${st.super})` : "";
  $("path").textContent = GpuWorth()
    ? `gpu · ${GpuEstimate(FineRes()).toFixed(0)} ms est`
      + (st.gpu === 1 ? " · forced (G)" : "")
    : (GPU ? `cpu · gpu ${GpuEstimate(FineRes()).toFixed(0)} ms est`
             + (CPU_FINE_MS ? ` vs cpu ${(CPU_FINE_MS / 1000).toFixed(1)} s` : "")
             + " · G to force"
           : `cpu · ${GPU_WHY}`);
  $("path").style.color = GpuWorth() ? "var(--cy)" : "var(--dimmer)";
  $("fine").textContent = !WORK ? "no worker"
    : !st.super ? "off"
    : st.fining ? `×${got.toFixed(1)}${asked} · ${FineRes()}…`
    : st.fineRes ? `×${got.toFixed(1)}${asked} · `
        + (st.fineMs ? `${(st.fineMs / 1000).toFixed(1)} s` : "kept")
    : RefineWorth() ? "waiting" : "—";
  $("fine").style.color = st.fineRes ? "var(--cy)" : "var(--dimmer)";
  $("cr").textContent = st.tile ? `${st.tile.craters} + ${st.tile.pop}` : "—";
  const z = (Math.log(st.spanKm) - LOG_MAX) / (LOG_MIN - LOG_MAX);
  const zi = $("zoom");
  zi.value = z; zi.style.setProperty("--fill", (z * 100) + "%");
}

/* --- moving ----------------------------------------------------------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function SetSpan(next, anchorX, anchorY){
  next = clamp(next, SPAN_MIN, SPAN_MAX);
  if (anchorX !== undefined){
    // Keep the ground under the cursor where it is.
    const p = PxPerKm();
    const gx = st.cxKm + (anchorX * DPR - CV.width / 2) / p;
    const gy = st.cyKm + (anchorY * DPR - CV.height / 2) / p;
    const p2 = Math.max(CV.width, CV.height) / next;
    st.cxKm = gx - (anchorX * DPR - CV.width / 2) / p2;
    st.cyKm = gy - (anchorY * DPR - CV.height / 2) / p2;
  }
  st.spanKm = next;
  st.dirty = true; Hud(); MaybeRegenerate();
}

CV.addEventListener("wheel", e => {
  e.preventDefault();
  const r = CV.getBoundingClientRect();
  SetSpan(st.spanKm * Math.exp(e.deltaY * 0.0009), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

const pointers = new Map();
CV.addEventListener("pointerdown", e => {
  CV.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1){ st.drag = { x: e.clientX, y: e.clientY }; CV.classList.add("drag"); }
  else if (pointers.size === 2){
    const [a, b] = [...pointers.values()];
    st.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), span: st.spanKm };
    st.drag = null;
  }
});
CV.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (st.pinch && pointers.size === 2){
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const r = CV.getBoundingClientRect();
    SetSpan(st.pinch.span * st.pinch.d / Math.max(1, d),
            (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
  } else if (st.drag){
    const p = PxPerKm();
    st.cxKm -= (e.clientX - st.drag.x) * DPR / p;
    st.cyKm -= (e.clientY - st.drag.y) * DPR / p;
    st.drag = { x: e.clientX, y: e.clientY };
    st.dirty = true;
    // No tile while the hand is down. Generation is synchronous, so a
    // regeneration mid-drag is a stall in the middle of the gesture that
    // caused it -- measured, a drag across the frame was costing several.
    // The tile is 18% wider than the window precisely so it can carry a
    // drag; the one on pointerup catches up.
  }
});
function EndPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size < 2) st.pinch = null;
  if (pointers.size === 0 && st.drag){ st.drag = null; CV.classList.remove("drag"); }
  if (pointers.size === 0) MaybeRegenerate();
}
CV.addEventListener("pointerup", EndPointer);
CV.addEventListener("pointercancel", EndPointer);

function Recentre(){
  st.cacheCx = st.cxKm; st.cacheCy = st.cyKm;
  BuildCache(() => Regenerate());
}

window.addEventListener("keydown", e => {
  const step = st.spanKm * 0.12;
  if (e.key === "+" || e.key === "=") SetSpan(st.spanKm / 1.25);
  else if (e.key === "-" || e.key === "_") SetSpan(st.spanKm * 1.25);
  else if (e.key === "ArrowLeft"){ st.cxKm -= step; st.dirty = true; MaybeRegenerate(); }
  else if (e.key === "ArrowRight"){ st.cxKm += step; st.dirty = true; MaybeRegenerate(); }
  else if (e.key === "ArrowUp"){ st.cyKm -= step; st.dirty = true; MaybeRegenerate(); }
  else if (e.key === "ArrowDown"){ st.cyKm += step; st.dirty = true; MaybeRegenerate(); }
  else if (e.key === "g" || e.key === "G"){
    st.gpu = st.gpu === 1 ? 0 : 1;
    st.fineRes = 0; SyncRefine(); WriteHash(); ArmRefine();
  }
  else if (e.key === "r" || e.key === "R") GoRegion(st.region);
  else return;
  e.preventDefault();
});

/* --- the bar and the regions ------------------------------------------ */
$("zoom").addEventListener("input", e => {
  const t = parseFloat(e.target.value);
  SetSpan(Math.exp(LOG_MAX + t * (LOG_MIN - LOG_MAX)));
});
$("in").addEventListener("click", () => SetSpan(st.spanKm / 1.6));
$("out").addEventListener("click", () => SetSpan(st.spanKm * 1.6));
$("reset").addEventListener("click", () => GoRegion(st.region));
const RES_STEPS = [384, 512, 640, 900, 1280, 0];   // 0 = one tile pixel per screen pixel
// Only the block sizes this window can actually afford: a 2x block on a
// wide screen needs a tile past RES_CAP, and offering a setting that
// silently becomes a different one is worse than not offering it.
const PX_STEPS_ALL = [2, 3, 4];
function PxSteps(){
  const min = Math.ceil(Math.max(CV.width, CV.height) * TILE_MARGIN / RES_CAP);
  const ok = PX_STEPS_ALL.filter(f => f >= min);
  return ok.length ? ok : [min];
}
const STYLE_NAMES = ["Smooth", "Smooth sharp", "Hard", "Hard + bands"];
// Two of these labels are twice the width of the rest, and on a phone
// that is the difference between two rows of bar and four.
const STYLE_SHORT = ["Smooth", "Sharp", "Hard", "Bands"];
const NARROW = () => window.innerWidth < 820;
function SyncStyle(){
  const steps = PxSteps();
  if (steps.indexOf(st.px) < 0) st.px = steps[0];
  $("style").textContent = (NARROW() ? STYLE_SHORT : STYLE_NAMES)[st.style];
  $("style").setAttribute("aria-pressed", st.style > 0 ? "true" : "false");
  // One button, two meanings: how big the tile is when the picture will be
  // resampled anyway, how big a PIXEL is when it will not.
  $("res").textContent = !Hard()
    ? (st.res === 0 ? "Fit" : String(st.res)) : "×" + st.px;
  $("res").title = Hard() ? "Pixel size" : "Tile detail";
  SyncRefine();
  PlaceRegions();
}
$("style").addEventListener("click", () => {
  st.style = (st.style + 1) % 4;
  SyncStyle(); Recentre();
});
function SyncRefine(){
  const b = $("refine");
  b.textContent = NARROW()
    ? (st.super ? "×" + st.super.toFixed(1) : "×off")
    : (st.super ? "Super ×" + st.super.toFixed(1) : "Super off");
  b.setAttribute("aria-pressed", (WORK && st.super && !Hard()) ? "true" : "false");
  b.disabled = !WORK;
  b.title = !WORK
    ? "Needs a worker — serve the page over http, not file://"
    : Hard()
      ? "Hard pixels pick their own tile size, so there is nothing to supersample"
      : `Tile pixels per screen pixel once you stop moving. Cost is the `
        + `square of it: ×2 is four times the pixels.`;
  Hud();
}
$("refine").addEventListener("click", () => {
  const i = SUPER_STEPS.indexOf(st.super);
  st.super = SUPER_STEPS[(i < 0 ? 0 : i + 1) % SUPER_STEPS.length];
  st.fineRes = 0;
  SyncRefine(); WriteHash();
  if (st.super) ArmRefine(); else { clearTimeout(fineTimer); st.fining = false; }
});
$("res").addEventListener("click", () => {
  if (!Hard())
    st.res = RES_STEPS[(RES_STEPS.indexOf(st.res) + 1) % RES_STEPS.length];
  else {
    const steps = PxSteps();
    const i = steps.indexOf(st.px);
    st.px = steps[(i < 0 ? 0 : i + 1) % steps.length];
  }
  SyncStyle(); Recentre();
});

// Mark where the game's own rungs fall on the zoom.
{
  const dl = $("rungs");
  for (const L of LEVELS){
    const o = document.createElement("option");
    o.value = (Math.log(L.span) - LOG_MAX) / (LOG_MIN - LOG_MAX);
    o.label = L.span + " km";
    dl.appendChild(o);
  }
}

const regionBar = $("regions");
REGIONS.forEach((r, i) => {
  const b = document.createElement("button");
  b.className = "btn"; b.type = "button"; b.textContent = r.name;
  b.addEventListener("click", () => GoRegion(i));
  regionBar.appendChild(b);
});
function PlaceRegions(){
  if (!NARROW()){ regionBar.style.bottom = ""; return; }
  const bar = $("bar");
  regionBar.style.bottom = (bar.offsetHeight + 22) + "px";
}
window.addEventListener("resize", PlaceRegions);
function SyncRegions(){
  [...regionBar.children].forEach((b, i) =>
    b.setAttribute("aria-pressed", i === st.region ? "true" : "false"));
}

let start = { x: 0, y: 0, span: null };
function GoRegion(i){
  st.region = i; SyncRegions();
  const r = REGIONS[i];
  // The crater population is pinned to the region's own origin, exactly
  // as in the bench, so the two show the same ground.
  st.originLat = r.lat - r.sKm / KMDEG;
  st.originLon = r.lon + r.eKm / (KMDEG * Math.cos(st.originLat * D2R));
  st.cxKm = start.x; st.cyKm = start.y;
  st.spanKm = clamp(start.span || LEVELS[0].span, SPAN_MIN, SPAN_MAX);
  st.cacheCx = st.cxKm; st.cacheCy = st.cyKm;
  start = { x: 0, y: 0, span: null };          // only the first landing
  st.tile = null; st.prev = null; st.base = null; st.dirty = true;
  Hud();
  LoadRegion(i, () => BuildCache(() => Regenerate()));
}

/* --- the URL carries the spot -----------------------------------------
   A playtest is worth more if the thing somebody found can be sent to
   somebody else. The hash is written on settle, never pushed, so it
   never fills the back button. */
function ReadHash(){
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  const key = h.get("r");
  const i = REGIONS.findIndex(r => r.key === key);
  const d = parseInt(h.get("d"), 10), px = parseInt(h.get("p"), 10);
  if (d >= 0 && d <= 3) st.style = d;
  if (px >= 2 && px <= 4) st.px = px;
  const sup = parseFloat(h.get("f"));
  if (SUPER_STEPS.indexOf(sup) >= 0) st.super = sup;
  const gp = parseInt(h.get("g"), 10);
  if (gp === 0 || gp === 1) st.gpu = gp;
  return { region: i < 0 ? 0 : i,
           span: parseFloat(h.get("s")) || null,
           x: parseFloat(h.get("x")) || 0,
           y: parseFloat(h.get("y")) || 0 };
}
let hashTimer = null;
function WriteHash(){
  clearTimeout(hashTimer);
  hashTimer = setTimeout(() => {
    const q = `r=${REGIONS[st.region].key}&s=${st.spanKm.toPrecision(4)}`
            + `&x=${st.cxKm.toFixed(3)}&y=${st.cyKm.toFixed(3)}`
            + `&d=${st.style}${st.style ? "&p=" + st.px : ""}`
            + `&f=${st.super}` + (st.gpu >= 0 ? `&g=${st.gpu}` : "");
    try { history.replaceState(null, "", "#" + q); } catch (e) {}
  }, 500);
}

Resize();
StartWorkers();
StartGPU();
// A tile blown up much past 3x reads as mush whatever the synthesis does,
// so the default follows the screen. The chip trades it back for speed.
// A tile blown up much past 3x reads as mush whatever the synthesis
// does, so the default follows the screen -- and a phone gets the small
// one, because a tile there is seconds rather than half of one. The chip
// trades it back either way.
// CSS pixels, not device pixels: a phone's backing store is two or three
// times its screen and picking the tile size off that hands the slowest
// machine the largest tile.
const LONG = Math.max(CV.clientWidth, CV.clientHeight);
st.res = COARSE ? 384 : (LONG >= 1300 ? 640 : (LONG >= 800 ? 512 : 384));
SyncStyle();
// Deployed, the bench sits beside this page as bench.html; in the repo it
// keeps its own name. Either way it is one file over.
$("bench").href = /regolith_playtest\.html$/.test(location.pathname)
  ? "regolith_craters.html" : "bench.html";
const first = ReadHash();
start = { x: first.x, y: first.y, span: first.span };
GoRegion(first.region);
requestAnimationFrame(Frame);
})();
</script>
