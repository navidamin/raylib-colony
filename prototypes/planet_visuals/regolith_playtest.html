<style>
/* The game's own near-black plating, so a playtest looks like the thing
   it is testing (docs/design/graphics/dark-plating.md). */
:root{
  --ground:#070b11; --panel:#0d151ecc; --rule:#1c2a39;
  --text:#c9d8e8; --dim:#61768a; --dimmer:#3f5163;
  --am:#d9962f; --am-lit:#f4c66a; --cy:#50e1ff;
  --ui:"Chakra Petch",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
html{color-scheme:dark}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--ui);
  overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}

#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}

.hud{position:fixed;font:700 11px/1.5 var(--mono);letter-spacing:.06em;
  background:var(--panel);border:1px solid var(--rule);border-radius:5px;
  padding:8px 10px;backdrop-filter:blur(3px);pointer-events:none;
  -webkit-backdrop-filter:blur(3px)}
#tl{top:12px;left:12px}
#tr{top:12px;right:12px;text-align:right}
#lvl{color:var(--am-lit);font-size:13px;letter-spacing:.14em}
.k{color:var(--dimmer)}
.v{color:var(--cy)}
#busy{color:var(--am);opacity:0}
#busy.on{opacity:1}

#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;
  display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;gap:10px;
  background:var(--panel);border:1px solid var(--rule);border-radius:6px;
  padding:9px 12px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  max-width:calc(100vw - 24px)}
#zoom{width:min(46vw,420px);height:22px;-webkit-appearance:none;appearance:none;
  background:none;cursor:ew-resize;margin:0}
#zoom::-webkit-slider-runnable-track{height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--cy) 0 var(--fill,50%),var(--rule) var(--fill,50%) 100%)}
#zoom::-moz-range-track{height:3px;border-radius:2px;background:var(--rule)}
#zoom::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:11px;height:19px;
  margin-top:-8px;border-radius:2px;background:var(--am-lit);border:1px solid #2a1d08}
#zoom::-moz-range-thumb{width:11px;height:19px;border-radius:2px;
  background:var(--am-lit);border:1px solid #2a1d08}
.btn{font:700 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  padding:8px 10px;border-radius:4px;border:1px solid var(--rule);
  background:#111c28;color:var(--dim);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--am);color:var(--am-lit)}
.btn[aria-pressed=true]{border-color:var(--cy);color:var(--cy);background:#0d2430}
.btn:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
#regions{position:fixed;top:12px;left:50%;transform:translateX(-50%);
  display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:min(70vw,760px)}
#help{position:fixed;bottom:14px;right:14px;font:400 10.5px/1.6 var(--mono);
  color:var(--dimmer);text-align:right;pointer-events:none}
#bar{padding-bottom:calc(9px + env(safe-area-inset-bottom,0px))}
@media (max-width:820px){
  /* A phone still needs the regions; it just cannot spare two rows for
     them, so they scroll instead of wrapping. */
  #regions{flex-wrap:nowrap;overflow-x:auto;max-width:calc(100vw - 24px);
    justify-content:flex-start;padding-bottom:2px;-webkit-overflow-scrolling:touch;
    top:auto;bottom:calc(66px + env(safe-area-inset-bottom,0px));scrollbar-width:none}
  #regions::-webkit-scrollbar{display:none}
  #help{display:none}
  #tr{font-size:10px;padding:6px 8px}
  #tl{font-size:10px;padding:6px 8px}
  #zoom{width:38vw}
  /* Only here is there not room for one row of controls. */
  #bar{flex-wrap:wrap}
}

<div id="stage"><canvas id="cv"></canvas></div>

<script src="regolith_blocks.js"></script>
<script src="regolith_chain.js"></script>
<script>
"use strict";
(function(){
const TC = TerrainChain;
const CV = document.getElementById("cv");
const CTX = CV.getContext("2d");

/* --- what the descent is ---------------------------------------------
   The game's ladder is 100 / 25 / 5 km -- PLANET, COLONY, SECT. This
   walks the bottom three rungs of it and one below: 50 km, wide enough
   that the mosaic still carries the landforms, down to 1 km, where it
   carries nothing at all and every crater and rock you see was made on
   the way in. 1 km is the floor on purpose -- it is a unit's own ground,
   and the scale the game would have to draw if it ever went below the
   sect.
   -------------------------------------------------------------------- */
const LEVELS = [
  { n: 1, span: 25.0, name: "COLONY" },
  { n: 2, span: 5.0,  name: "SECT" },
  { n: 3, span: 1.0,  name: "UNIT" }
];
const SPAN_MAX = 50.0, SPAN_MIN = 1.0;
const LOG_MAX = Math.log(SPAN_MAX), LOG_MIN = Math.log(SPAN_MIN);

const st = {
  region: 0, block: null, lc: null,
  cxKm: 0, cyKm: 0, spanKm: 5.0,           // the view, in km from the origin
  originLat: 0, originLon: 0,
  tile: null, prev: null, fade: 1,
  res: 512, genMs: 0, genCount: 0, busy: false,
  // 0 smooth as it was, 1 smooth but with the chain's softening dropped,
  // 2 hard pixels, 3 hard pixels with banded tone. Split this way because
  // the softening and the filtering turned out to be separate questions:
  // more resolution does NOT fix the softness, since the chain's blurs
  // are scaled by k = res/300 and therefore cover the same GROUND however
  // many pixels you give them. Only dropping them does.
  style: 1, px: 3,
  drag: null, pinch: null, dirty: true, mini: null
};

/* --- the imagery ------------------------------------------------------ */
const REGIONS = WAC_BLOCKS.regions;
function LoadRegion(i, then){
  const r = REGIONS[i], img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = c.height = WAC_BLOCKS.size;
    const g = c.getContext("2d", { willReadFrequently: true });
    g.drawImage(img, 0, 0);
    const px = g.getImageData(0, 0, WAC_BLOCKS.size, WAC_BLOCKS.size).data;
    const data = new Uint8Array(WAC_BLOCKS.size * WAC_BLOCKS.size);
    for (let k = 0; k < data.length; k++) data[k] = px[k * 4];
    st.block = { data, w: WAC_BLOCKS.size, h: WAC_BLOCKS.size,
                 x0: r.x0, y0: r.y0, wacW: WAC_BLOCKS.wacW, wacH: WAC_BLOCKS.wacH };
    then();
  };
  img.src = "data:image/png;base64," + r.png;
}

/* --- km <-> lat/lon, about the region's own origin -------------------- */
const KMDEG = TC.MOON_KM_PER_DEG, D2R = TC.DEG2RAD;
function LatLonAt(cxKm, cyKm){
  const lat = st.originLat - cyKm / KMDEG;
  const lon = st.originLon + cxKm / (KMDEG * Math.cos(lat * D2R));
  return [lat, lon];
}

/* --- generating -------------------------------------------------------
   Two costs, kept apart. Building the cache walks the wide rungs and is
   paid once per PLACE; a view is one rung and is paid per ZOOM. That is
   the whole reason a zoom can regenerate while it is still moving.
   -------------------------------------------------------------------- */
// Hard pixels only work if the tile is sharp AT ITS OWN RESOLUTION
// first: nearest-neighbour does not create detail, it only stops the
// browser from smearing what is there. `crisp` drops the softening
// steps that exist because the picture was going to be resampled.
// The two questions turned out to be separate, so they are separate
// predicates: whether the chain SOFTENS what it makes, and whether the
// browser softens it again on the way to the screen.
const Crisp = () => st.style >= 1;      // the chain's own blurs dropped
const Hard  = () => st.style >= 2;      // whole-pixel draw, no smoothing
function Tune(){
  return Object.assign({}, TC.DEFAULT_TUNE, {
    crisp: Crisp() ? 1 : 0,
    bands: st.style === 3 ? 9 : 0
  });
}

// In hard mode the tile size is dictated by the window, not chosen: one
// tile pixel has to land on a whole number of screen pixels or some
// become 3 wide and some 4, which shimmers as you move. So the tile is
// however big it needs to be for the block size asked for -- and if that
// would cost too much, the block gets bigger instead of the rule bending.
const RES_CAP = 820;
// Smooth mode's only real answer to softness is more pixels, so it can go
// all the way to one tile pixel per screen pixel -- FIT, no upscale at
// all. It is the honest experiment and it is not free: cost grows faster
// than res^2, because a finer tile also opens more sub-floor octaves.
// Measured here: 640 -> 401 ms, 800 -> 514, 1024 -> 936, 1280 -> 1924.
const FIT_CAP = 1600;
function FitRes(){
  return Math.min(FIT_CAP, Math.ceil(Math.max(CV.width, CV.height) * TILE_MARGIN));
}
function WantedRes(){
  if (!Hard()) return st.res === 0 ? FitRes() : st.res;
  const long = Math.max(CV.width, CV.height) * TILE_MARGIN;
  const f = Math.max(st.px, Math.ceil(long / RES_CAP));
  return Math.ceil(long / f);
}

function BuildCache(then){
  const [lat, lon] = LatLonAt(st.cxKm, st.cyKm);
  Busy(true);
  setTimeout(() => {
    st.lc = TC.MakeLiveChain({
      block: st.block, lat, lon, res: WantedRes(),
      tune: Tune(), craters: TC.CRATERS,
      craterParams: TC.DEFAULT_CRATER,
      originLat: st.originLat, originLon: st.originLon
    });
    st.mini = RungCanvas(st.lc, 100.0);   // wider than any view, so the box always fits
    Busy(false);
    if (then) then();
  }, 16);
}
// One cached rung as a picture, for the inset that says where you are.
function RungCanvas(lc, spanKm){
  let best = lc.rungs[0];
  for (const r of lc.rungs) if (Math.abs(r.spanKm - spanKm) < Math.abs(best.spanKm - spanKm)) best = r;
  const res = lc.res, c = document.createElement("canvas");
  c.width = c.height = res;
  const g = c.getContext("2d"), img = g.createImageData(res, res);
  // The mare is genuinely dark; the inset is a locator, so it is lifted
  // to be readable rather than left faithful.
  for (let i = 0; i < res * res; i++){
    TC.RampColor(Math.min(1, best.lum[i] * 1.55 + 0.06), img.data, i * 4);
  }
  g.putImageData(img, 0, 0);
  return { canvas: c, spanKm: best.spanKm };
}

function TileCanvas(view){
  const c = document.createElement("canvas");
  c.width = c.height = view.res;
  c.getContext("2d").putImageData(
    new ImageData(view.rgba, view.res, view.res), 0, 0);
  return c;
}

let genPending = false;
function Regenerate(){
  if (!st.lc || genPending) return;
  genPending = true;
  Busy(true);
  setTimeout(() => {
    // A little wider than the window: a zoom can then drift outward
    // before the next tile lands without opening a gap at the edges.
    // The offset from the cache centre is handed to the view, so panning
    // costs one rung like zooming does instead of a whole rebuild.
    const cx = st.cxKm, cy = st.cyKm;
    const v = st.lc.View(Math.max(0.05, st.spanKm * TILE_MARGIN),
                         cx - st.cacheCx, cy - st.cacheCy);
    st.prev = st.tile;
    st.tile = { canvas: TileCanvas(v), spanKm: v.spanKm,
                cxKm: cx, cyKm: cy,
                craters: v.craters, pop: v.popCraters, kmPerPx: v.kmPerPx };
    st.fade = st.prev ? 0 : 1;
    st.genMs = v.ms; st.genCount++;
    genPending = false; Busy(false); st.dirty = true;
    Hud(); WriteHash();
  }, 0);
}
// Regenerate once the zoom has drifted far enough from the tile it is
// stretching -- about 12% either way, which is where the softening starts
// to read on a dark surface.
function MaybeRegenerate(){
  if (!st.tile){ Regenerate(); return; }
  // Past the widest cached rung there is nothing left to crop from, so
  // that -- and only that -- is what makes a pan rebuild the cache. The
  // test is the one View() itself applies: half the tile plus however far
  // the view has walked, against half the macro. Written with the whole
  // span instead of half, a 50 km window rebuilt the cache on every
  // regeneration while sitting perfectly still.
  const reach = Math.max(Math.abs(st.cxKm - st.cacheCx),
                         Math.abs(st.cyKm - st.cacheCy))
              + st.spanKm * TILE_MARGIN / 2;
  if (reach > TC.LIVE_RUNGS[0] * 0.47){
    clearTimeout(settleTimer);
    settleTimer = setTimeout(() => Recentre(), WantedRes() < HEAVY_RES ? 0 : SETTLE_MS);
    return;
  }
  const drift = Math.abs(Math.log(st.spanKm * TILE_MARGIN / st.tile.spanKm));
  const moved = Math.hypot(st.cxKm - st.tile.cxKm, st.cyKm - st.tile.cyKm);
  if (drift > 0.113 || moved > st.spanKm * 0.035) Schedule();
}

// Generation is synchronous: a big tile freezes the page for as long as it
// takes, and at 1280 that is seconds. Small tiles can be built as the view
// moves and it still feels connected; big ones cannot, so they wait until
// the hand stops. The stretched tile carries the view meanwhile, which is
// the same bargain the whole thing already runs on.
const HEAVY_RES = 760, SETTLE_MS = 380;
let settleTimer = null;
function Schedule(){
  clearTimeout(settleTimer);
  if (WantedRes() < HEAVY_RES){ Regenerate(); return; }
  settleTimer = setTimeout(() => Regenerate(), SETTLE_MS);
}

function Busy(on){
  st.busy = on;
  document.getElementById("busy").classList.toggle("on", on);
}

/* --- drawing ----------------------------------------------------------
   The tile is generated a little wider than the window (TILE_MARGIN), so
   a zoom can drift outward before the next one lands without opening a
   gap at the edges. Between regenerations the tile is simply scaled: the
   ground stretches for a fraction of a second and then sharpens, which
   is the honest way to show that it is being made on the way in.
   -------------------------------------------------------------------- */
const TILE_MARGIN = 1.18;
const COL = { text:"#c9d8e8", dim:"#61768a", dimmer:"#3f5163",
              am:"#d9962f", amLit:"#f4c66a", cy:"#50e1ff", rule:"#1c2a39" };
const MONO = (w, s) => `${w} ${s}px "JetBrains Mono", ui-monospace, monospace`;
let DPR = 1;

const COARSE = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
function Resize(){
  // A phone's 3x backing store would ask a 384 tile to cover ~2000 px.
  // The ground is a soft image; 1x there costs nothing anyone can see and
  // saves the fill as well as the upscale.
  DPR = COARSE ? 1 : Math.min(2, window.devicePixelRatio || 1);
  CV.width = Math.round(CV.clientWidth * DPR);
  CV.height = Math.round(CV.clientHeight * DPR);
  st.dirty = true;
}
window.addEventListener("resize", Resize);

function PxPerKm(){ return Math.max(CV.width, CV.height) / st.spanKm; }

function DrawTile(t, alpha){
  if (!t) return;
  const p = PxPerKm();
  let size = t.spanKm * p;
  let dx = CV.width / 2 + (t.cxKm - st.cxKm) * p - size / 2;
  let dy = CV.height / 2 + (t.cyKm - st.cyKm) * p - size / 2;
  let hard = false;
  if (Hard()){
    // Snap to a whole number of screen pixels per tile pixel, and snap
    // the corner to the pixel grid as well -- a half-pixel origin gives
    // ragged block edges even at an exact scale. If the zoom has drifted
    // too far from a whole number since the last tile, fall back to
    // smoothing until the next one lands: soft for a moment beats
    // shimmering.
    const f = size / t.canvas.width;
    const F = Math.max(1, Math.round(f));
    if (Math.abs(f - F) < 0.06 * F){
      const cx = dx + size / 2, cy = dy + size / 2;
      size = t.canvas.width * F;
      dx = Math.round(cx - size / 2);
      dy = Math.round(cy - size / 2);
      hard = true;
    }
  }
  CTX.globalAlpha = alpha;
  CTX.imageSmoothingEnabled = !hard;
  CTX.imageSmoothingQuality = "high";
  CTX.drawImage(t.canvas, dx, dy, size, size);
  CTX.globalAlpha = 1;
}

function ScaleBar(){
  const p = PxPerKm() / DPR, W = CV.width / DPR;
  const want = (W * 0.22) / p;                       // km
  const nice = [0.05,0.1,0.2,0.5,1,2,5,10,20].reduce((a,b) =>
    Math.abs(b - want) < Math.abs(a - want) ? b : a);
  const len = nice * p, x = 16, y = CV.height / DPR - 26;
  CTX.save(); CTX.scale(DPR, DPR);
  CTX.strokeStyle = "rgba(5,8,12,.85)"; CTX.lineWidth = 4.5;
  CTX.beginPath(); CTX.moveTo(x, y); CTX.lineTo(x + len, y); CTX.stroke();
  CTX.strokeStyle = COL.text; CTX.lineWidth = 1.7;
  CTX.beginPath();
  CTX.moveTo(x, y - 4.5); CTX.lineTo(x, y + 4.5);
  CTX.moveTo(x, y); CTX.lineTo(x + len, y);
  CTX.moveTo(x + len, y - 4.5); CTX.lineTo(x + len, y + 4.5);
  CTX.stroke();
  const lab = nice < 1 ? Math.round(nice * 1000) + " m" : nice + " km";
  CTX.font = MONO(700, 11); CTX.textBaseline = "bottom";
  const tw = CTX.measureText(lab).width;
  CTX.fillStyle = "rgba(5,8,12,.75)"; CTX.fillRect(x - 2, y - 22, tw + 8, 14);
  CTX.fillStyle = COL.text; CTX.fillText(lab, x + 2, y - 10);
  CTX.restore();
}

// Where you are inside the sect you started in.
function MiniMap(){
  if (!st.mini) return;
  const W = CV.width / DPR, H = CV.height / DPR;
  const narrow = W < 820;                       // the phone layout
  const S = narrow ? 92 : 118, m = 14;
  // Bottom-right on a desktop; under the top-right readout on a phone,
  // where the scrolling region strip is not.
  const x = W - S - m, y = narrow ? 96 : H - S - m - 34;
  CTX.save(); CTX.scale(DPR, DPR);
  CTX.globalAlpha = 0.92;
  CTX.drawImage(st.mini.canvas, x, y, S, S);
  CTX.globalAlpha = 1;
  CTX.strokeStyle = COL.rule; CTX.lineWidth = 1;
  CTX.strokeRect(x + 0.5, y + 0.5, S - 1, S - 1);
  const f = st.spanKm / st.mini.spanKm;
  const bx = x + S / 2 + (st.cxKm - st.cacheCx) / st.mini.spanKm * S;
  const by = y + S / 2 + (st.cyKm - st.cacheCy) / st.mini.spanKm * S;
  const bs = Math.max(3, S * f);
  CTX.strokeStyle = COL.amLit; CTX.lineWidth = 1.4;
  CTX.strokeRect(bx - bs / 2, by - bs / 2, bs, bs);
  CTX.font = MONO(700, 9.5); CTX.fillStyle = COL.dimmer;
  CTX.textBaseline = "top"; CTX.textAlign = "right";
  CTX.fillText(st.mini.spanKm + " KM · WHERE YOU ARE", x + S, y - 12);
  CTX.textAlign = "left";
  CTX.restore();
}

function Draw(){
  CTX.fillStyle = "#05080c";
  CTX.fillRect(0, 0, CV.width, CV.height);
  if (!st.tile){
    CTX.save(); CTX.scale(DPR, DPR);
    CTX.font = MONO(700, 12); CTX.fillStyle = COL.dim;
    CTX.textAlign = "center"; CTX.textBaseline = "middle";
    CTX.fillText("GENERATING THE GROUND",
                 CV.width / DPR / 2, CV.height / DPR / 2);
    CTX.restore();
    return;
  }
  DrawTile(st.prev, 1);
  DrawTile(st.tile, st.fade);
  ScaleBar();
  MiniMap();
}

let last = 0;
function Frame(ts){
  const dt = Math.min(64, ts - last || 16); last = ts;
  if (st.fade < 1){ st.fade = Math.min(1, st.fade + dt / 170); st.dirty = true; }
  else if (st.prev){ st.prev = null; }
  if (st.dirty){ Draw(); st.dirty = false; }
  requestAnimationFrame(Frame);
}

/* --- the readouts ----------------------------------------------------- */
const $ = id => document.getElementById(id);
// The boundaries are the geometric midpoints between the rungs, so a
// level owns the spans it is nearer to than either neighbour.
function LevelOf(span){
  if (span >= Math.sqrt(25.0 * 5.0)) return LEVELS[0];
  if (span >= Math.sqrt(5.0 * 1.0)) return LEVELS[1];
  return LEVELS[2];
}
// The whole-pixel factor this frame would draw at, or 0 if the zoom has
// drifted too far from a whole number since the last tile. Draw() applies
// the same test; this is here so the readout does not lag a frame behind.
function HardFactor(){
  if (!Hard() || !st.tile) return 0;
  const f = (st.tile.spanKm * PxPerKm()) / st.tile.canvas.width;
  const F = Math.max(1, Math.round(f));
  return Math.abs(f - F) < 0.06 * F ? F : 0;
}

// In smooth mode the number that explains the softness is the upscale:
// how many screen pixels each generated pixel is being stretched over.
function SmoothLabel(){
  const tag = Crisp() ? "sharp" : "smooth";
  if (!st.tile) return tag;
  const f = (st.tile.spanKm * PxPerKm()) / st.tile.canvas.width;
  return f <= 1.06 ? `${tag} · 1:1` : `${tag} · ${f.toFixed(1)}× up`;
}

function Hud(){
  const L = LevelOf(st.spanKm);
  $("lvl").textContent = `LEVEL ${L.n} · ${L.name}`;
  $("span").textContent = st.spanKm.toFixed(st.spanKm >= 10 ? 1 : 2) + " km";
  const mpp = st.tile ? st.tile.kmPerPx * 1000 : 0;
  $("mpp").textContent = mpp.toFixed(mpp < 10 ? 2 : 1) + " m/px";
  $("place").textContent = REGIONS[st.region].name;
  $("draw").textContent = !Hard() ? SmoothLabel() : HardFactor()
    ? `${HardFactor()}× hard` + (st.style === 3 ? " · banded" : "")
    : "settling…";
  $("gen").textContent = st.genCount
    ? `${st.genMs.toFixed(0)} ms · ${st.genCount}` : "—";
  // A tile over a second is a visible freeze, and the tile size is the
  // player's choice, so the number that says so is worth colouring.
  $("gen").style.color = st.genMs > 1200 ? "var(--am-lit)" : "";
  $("cr").textContent = st.tile ? `${st.tile.craters} + ${st.tile.pop}` : "—";
  const z = (Math.log(st.spanKm) - LOG_MAX) / (LOG_MIN - LOG_MAX);
  const zi = $("zoom");
  zi.value = z; zi.style.setProperty("--fill", (z * 100) + "%");
}

/* --- moving ----------------------------------------------------------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function SetSpan(next, anchorX, anchorY){
  next = clamp(next, SPAN_MIN, SPAN_MAX);
  if (anchorX !== undefined){
    // Keep the ground under the cursor where it is.
    const p = PxPerKm();
    const gx = st.cxKm + (anchorX * DPR - CV.width / 2) / p;
    const gy = st.cyKm + (anchorY * DPR - CV.height / 2) / p;
    const p2 = Math.max(CV.width, CV.height) / next;
    st.cxKm = gx - (anchorX * DPR - CV.width / 2) / p2;
    st.cyKm = gy - (anchorY * DPR - CV.height / 2) / p2;
  }
  st.spanKm = next;
  st.dirty = true; Hud(); MaybeRegenerate();
}

CV.addEventListener("wheel", e => {
  e.preventDefault();
  const r = CV.getBoundingClientRect();
  SetSpan(st.spanKm * Math.exp(e.deltaY * 0.0009), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

const pointers = new Map();
CV.addEventListener("pointerdown", e => {
  CV.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1){ st.drag = { x: e.clientX, y: e.clientY }; CV.classList.add("drag"); }
  else if (pointers.size === 2){
    const [a, b] = [...pointers.values()];
    st.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), span: st.spanKm };
    st.drag = null;
  }
});
CV.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (st.pinch && pointers.size === 2){
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const r = CV.getBoundingClientRect();
    SetSpan(st.pinch.span * st.pinch.d / Math.max(1, d),
            (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
  } else if (st.drag){
    const p = PxPerKm();
    st.cxKm -= (e.clientX - st.drag.x) * DPR / p;
    st.cyKm -= (e.clientY - st.drag.y) * DPR / p;
    st.drag = { x: e.clientX, y: e.clientY };
    st.dirty = true;
    // No tile while the hand is down. Generation is synchronous, so a
    // regeneration mid-drag is a stall in the middle of the gesture that
    // caused it -- measured, a drag across the frame was costing several.
    // The tile is 18% wider than the window precisely so it can carry a
    // drag; the one on pointerup catches up.
  }
});
function EndPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size < 2) st.pinch = null;
  if (pointers.size === 0 && st.drag){ st.drag = null; CV.classList.remove("drag"); }
  if (pointers.size === 0) MaybeRegenerate();
}
CV.addEventListener("pointerup", EndPointer);
CV.addEventListener("pointercancel", EndPointer);

function Recentre(){
  st.cacheCx = st.cxKm; st.cacheCy = st.cyKm;
  BuildCache(() => Regenerate());
}

window.addEventListener("keydown", e => {
  const step = st.spanKm * 0.12;
  if (e.key === "+" || e.key === "=") SetSpan(st.spanKm / 1.25);
  else if (e.key === "-" || e.key === "_") SetSpan(st.spanKm * 1.25);
  else if (e.key === "ArrowLeft"){ st.cxKm -= step; st.dirty = true; MaybeRegenerate(); }
  else if (e.key === "ArrowRight"){ st.cxKm += step; st.dirty = true; MaybeRegenerate(); }
  else if (e.key === "ArrowUp"){ st.cyKm -= step; st.dirty = true; MaybeRegenerate(); }
  else if (e.key === "ArrowDown"){ st.cyKm += step; st.dirty = true; MaybeRegenerate(); }
  else if (e.key === "r" || e.key === "R") GoRegion(st.region);
  else return;
  e.preventDefault();
});

/* --- the bar and the regions ------------------------------------------ */
$("zoom").addEventListener("input", e => {
  const t = parseFloat(e.target.value);
  SetSpan(Math.exp(LOG_MAX + t * (LOG_MIN - LOG_MAX)));
});
$("in").addEventListener("click", () => SetSpan(st.spanKm / 1.6));
$("out").addEventListener("click", () => SetSpan(st.spanKm * 1.6));
$("reset").addEventListener("click", () => GoRegion(st.region));
const RES_STEPS = [384, 512, 640, 900, 1280, 0];   // 0 = one tile pixel per screen pixel
// Only the block sizes this window can actually afford: a 2x block on a
// wide screen needs a tile past RES_CAP, and offering a setting that
// silently becomes a different one is worse than not offering it.
const PX_STEPS_ALL = [2, 3, 4];
function PxSteps(){
  const min = Math.ceil(Math.max(CV.width, CV.height) * TILE_MARGIN / RES_CAP);
  const ok = PX_STEPS_ALL.filter(f => f >= min);
  return ok.length ? ok : [min];
}
const STYLE_NAMES = ["Smooth", "Smooth sharp", "Hard", "Hard + bands"];
function SyncStyle(){
  const steps = PxSteps();
  if (steps.indexOf(st.px) < 0) st.px = steps[0];
  $("style").textContent = STYLE_NAMES[st.style];
  $("style").setAttribute("aria-pressed", st.style > 0 ? "true" : "false");
  // One button, two meanings: how big the tile is when the picture will be
  // resampled anyway, how big a PIXEL is when it will not.
  $("res").textContent = !Hard()
    ? (st.res === 0 ? "Fit" : String(st.res)) : "×" + st.px;
  $("res").title = Hard() ? "Pixel size" : "Tile detail";
}
$("style").addEventListener("click", () => {
  st.style = (st.style + 1) % 4;
  SyncStyle(); Recentre();
});
$("res").addEventListener("click", () => {
  if (!Hard())
    st.res = RES_STEPS[(RES_STEPS.indexOf(st.res) + 1) % RES_STEPS.length];
  else {
    const steps = PxSteps();
    const i = steps.indexOf(st.px);
    st.px = steps[(i < 0 ? 0 : i + 1) % steps.length];
  }
  SyncStyle(); Recentre();
});

// Mark where the game's own rungs fall on the zoom.
{
  const dl = $("rungs");
  for (const L of LEVELS){
    const o = document.createElement("option");
    o.value = (Math.log(L.span) - LOG_MAX) / (LOG_MIN - LOG_MAX);
    o.label = L.span + " km";
    dl.appendChild(o);
  }
}

const regionBar = $("regions");
REGIONS.forEach((r, i) => {
  const b = document.createElement("button");
  b.className = "btn"; b.type = "button"; b.textContent = r.name;
  b.addEventListener("click", () => GoRegion(i));
  regionBar.appendChild(b);
});
function SyncRegions(){
  [...regionBar.children].forEach((b, i) =>
    b.setAttribute("aria-pressed", i === st.region ? "true" : "false"));
}

let start = { x: 0, y: 0, span: null };
function GoRegion(i){
  st.region = i; SyncRegions();
  const r = REGIONS[i];
  // The crater population is pinned to the region's own origin, exactly
  // as in the bench, so the two show the same ground.
  st.originLat = r.lat - r.sKm / KMDEG;
  st.originLon = r.lon + r.eKm / (KMDEG * Math.cos(st.originLat * D2R));
  st.cxKm = start.x; st.cyKm = start.y;
  st.spanKm = clamp(start.span || LEVELS[0].span, SPAN_MIN, SPAN_MAX);
  st.cacheCx = st.cxKm; st.cacheCy = st.cyKm;
  start = { x: 0, y: 0, span: null };          // only the first landing
  st.tile = null; st.prev = null; st.dirty = true;
  Hud();
  LoadRegion(i, () => BuildCache(() => Regenerate()));
}

/* --- the URL carries the spot -----------------------------------------
   A playtest is worth more if the thing somebody found can be sent to
   somebody else. The hash is written on settle, never pushed, so it
   never fills the back button. */
function ReadHash(){
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  const key = h.get("r");
  const i = REGIONS.findIndex(r => r.key === key);
  const d = parseInt(h.get("d"), 10), px = parseInt(h.get("p"), 10);
  if (d >= 0 && d <= 3) st.style = d;
  if (px >= 2 && px <= 4) st.px = px;
  return { region: i < 0 ? 0 : i,
           span: parseFloat(h.get("s")) || null,
           x: parseFloat(h.get("x")) || 0,
           y: parseFloat(h.get("y")) || 0 };
}
let hashTimer = null;
function WriteHash(){
  clearTimeout(hashTimer);
  hashTimer = setTimeout(() => {
    const q = `r=${REGIONS[st.region].key}&s=${st.spanKm.toPrecision(4)}`
            + `&x=${st.cxKm.toFixed(3)}&y=${st.cyKm.toFixed(3)}`
            + `&d=${st.style}${st.style ? "&p=" + st.px : ""}`;
    try { history.replaceState(null, "", "#" + q); } catch (e) {}
  }, 500);
}

Resize();
// A tile blown up much past 3x reads as mush whatever the synthesis does,
// so the default follows the screen. The chip trades it back for speed.
// A tile blown up much past 3x reads as mush whatever the synthesis
// does, so the default follows the screen -- and a phone gets the small
// one, because a tile there is seconds rather than half of one. The chip
// trades it back either way.
// CSS pixels, not device pixels: a phone's backing store is two or three
// times its screen and picking the tile size off that hands the slowest
// machine the largest tile.
const LONG = Math.max(CV.clientWidth, CV.clientHeight);
st.res = COARSE ? 384 : (LONG >= 1300 ? 640 : (LONG >= 800 ? 512 : 384));
SyncStyle();
// Deployed, the bench sits beside this page as bench.html; in the repo it
// keeps its own name. Either way it is one file over.
$("bench").href = /regolith_playtest\.html$/.test(location.pathname)
  ? "regolith_craters.html" : "bench.html";
const first = ReadHash();
start = { x: first.x, y: first.y, span: first.span };
GoRegion(first.region);
requestAnimationFrame(Frame);
})();
</script>
