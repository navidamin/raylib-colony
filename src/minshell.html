    <!-- Web Style -->
    <style>
        html, body {
          height: 100%;
        }
        body {
          margin: 0px;
          overflow: hidden;
          background-color: black;
          display: flex;
          align-items: center;
          justify-content: center;
          /* Pinned to the visual viewport rather than sized by the document.
             A body taller than the screen combined with overflow:hidden clips
             the bottom of the game with nothing to indicate it, and leaves the
             canvas rect disagreeing with what is on screen. */
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
        }
        canvas.emscripten {
          border: 0px none;
          background-color: black;
          padding-left: 0;
          padding-right: 0;
          margin-left: auto;
          margin-right: auto;
          display: block;
          /* Scale to fit phones/tablets, preserving aspect ratio.
             !important because Emscripten writes an inline style with the
             framebuffer size (e.g. 1280x720) on the canvas, which would
             otherwise override these rules and crop the page on mobile.
             touch-action: none keeps taps from scrolling/zooming the page. */
          max-width: 100vw !important;
          max-height: 100vh !important;
          width: auto !important;
          height: auto !important;
          touch-action: none;
        }
    </style>
    <script type='text/javascript' src="https://cdn.jsdelivr.net/gh/eligrey/FileSaver.js/dist/FileSaver.min.js"> </script>
    <script type='text/javascript'>
        function saveFileFromMEMFSToDisk(memoryFSname, localFSname)     // This can be called by C/C++ code
        {

            saveAs(blob, localFSname);
        }

    <body>
        <canvas class=emscripten id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas>
        <!-- Live geometry readout for diagnosing mobile fit issues.
             Hidden unless the page is loaded with ?debug=1 -- see
             docs/web-deploy-mobile.md. -->
        <div id="shellDebug" style="display:none;position:fixed;top:4px;left:4px;z-index:9999;
             font:10px monospace;color:rgba(255,255,255,0.65);
             background:rgba(0,0,0,0.55);padding:2px 6px;border-radius:3px;
             pointer-events:none;">SHELL v4 loading...</div>
        <script type='text/javascript'>
            // Fit the fixed-size framebuffer canvas to the device viewport,
            // preserving aspect ratio. Emscripten/raylib write their own
            // inline canvas style at unpredictable times (GL context
            // creation, resizes), so this is a persistent enforcer, not a
            // one-shot: it re-asserts the fitted size with !important
            // priority whenever the canvas size or style changes, and polls
            // as a final fallback.
            (function()
            {
                // Diagnostics are opt-in: load with ?debug=1 to show the badge
                var debugEnabled = /[?&]debug=1(&|$)/.test(window.location.search);
                var debugEl = document.getElementById('shellDebug');
                if (debugEnabled && debugEl) debugEl.style.display = 'block';

                function updateDebug(c)
                {
                    if (!debugEnabled) return;
                    var d = debugEl;
                    if (!d || !c) return;
                    var r = c.getBoundingClientRect();
                    d.textContent = 'SHELL v4'
                        + ' cnv=' + c.width + 'x' + c.height
                        + ' style=' + c.style.getPropertyValue('width') + '/'
                                    + c.style.getPropertyPriority('width')
                        + ' rect=' + Math.round(r.width) + 'x' + Math.round(r.height)
                                   + '@' + Math.round(r.x) + ',' + Math.round(r.y)
                        + ' win=' + window.innerWidth + 'x' + window.innerHeight
                        + ' vv=' + (window.visualViewport
                                    ? Math.round(window.visualViewport.width) + 'x'
                                      + Math.round(window.visualViewport.height)
                                      + '@' + Math.round(window.visualViewport.offsetTop)
                                    : 'none')
                        + ' dpr=' + window.devicePixelRatio
                        + (pointerLine ? '\n' + pointerLine : '');
                }

                // Live pointer mapping. The game is reported to receive
                // (page - rect.topLeft) * framebuffer/rect -- which is the
                // arithmetic emscripten does before handing coordinates to
                // raylib. Showing all three lets a screenshot say whether the
                // game's idea of the cursor matches the real one, and if not,
                // by exactly what factor.
                var pointerLine = '';
                function trackPointer(e)
                {
                    var c = document.getElementById('canvas');
                    if (!c) return;
                    var r = c.getBoundingClientRect();
                    var relX = e.pageX - (window.scrollX + r.left);
                    var relY = e.pageY - (window.scrollY + r.top);
                    pointerLine = 'page=' + Math.round(e.pageX) + ',' + Math.round(e.pageY)
                        + ' rel=' + Math.round(relX) + ',' + Math.round(relY)
                        + ' expect=' + Math.round(relX * (c.width / r.width)) + ','
                                     + Math.round(relY * (c.height / r.height));
                    updateDebug(c);
                }

                // The game renders a fixed-size framebuffer; resize plumbing
                // in the wasm runtime shrinks the canvas attributes to the
                // CSS size on mobile, which crops the game (it keeps
                // rendering at full size). Pin the framebuffer and scale
                // only via CSS.
                var GAME_W = 1280;
                var GAME_H = 720;

                function fitCanvas()
                {
                    var c = document.getElementById('canvas');
                    if (!c) return;

                    // Restore the framebuffer if something shrank it. The
                    // game loop repaints every frame, so the buffer clear
                    // this causes is invisible.
                    if (c.width !== GAME_W) c.width = GAME_W;
                    if (c.height !== GAME_H) c.height = GAME_H;

                    updateDebug(c);

                    // Take the SMALLEST height any source reports, not the
                    // first one that exists. innerHeight and visualViewport
                    // can both exceed what is actually on screen (browser
                    // chrome, a shorter layout viewport), and fitting to a
                    // too-tall figure scales the canvas past the visible
                    // area -- which, with overflow:hidden, silently clips the
                    // bottom of the game rather than showing a scrollbar.
                    var heights = [window.innerHeight];
                    var widths = [window.innerWidth];
                    if (window.visualViewport)
                    {
                        heights.push(window.visualViewport.height);
                        widths.push(window.visualViewport.width);
                    }
                    if (document.documentElement)
                    {
                        if (document.documentElement.clientHeight > 0)
                        {
                            heights.push(document.documentElement.clientHeight);
                        }
                        if (document.documentElement.clientWidth > 0)
                        {
                            widths.push(document.documentElement.clientWidth);
                        }
                    }

                    var vw = Math.min.apply(null, widths);
                    var vh = Math.min.apply(null, heights);
                    var scale = Math.min(vw / c.width, vh / c.height);
                    var w = Math.floor(c.width * scale) + 'px';
                    var h = Math.floor(c.height * scale) + 'px';

                    // Guard: only touch style when wrong, so the observer
                    // below does not loop on our own writes.
                    if (c.style.getPropertyValue('width') !== w ||
                        c.style.getPropertyPriority('width') !== 'important')
                    {
                        c.style.setProperty('width', w, 'important');
                    }
                    if (c.style.getPropertyValue('height') !== h ||
                        c.style.getPropertyPriority('height') !== 'important')
                    {
                        c.style.setProperty('height', h, 'important');
                    }
                }

                if (debugEnabled)
                {
                    window.addEventListener('mousemove', trackPointer);
                    if (debugEl) debugEl.style.whiteSpace = 'pre';
                }

                window.addEventListener('resize', fitCanvas);
                window.addEventListener('orientationchange', function() { setTimeout(fitCanvas, 200); });
                if (window.visualViewport)
                {
                    window.visualViewport.addEventListener('resize', fitCanvas);
                }

                // Re-assert whenever anything rewrites the canvas size/style
                var c = document.getElementById('canvas');
                if (window.MutationObserver && c)
                {
                    new MutationObserver(fitCanvas).observe(c,
                        { attributes: true, attributeFilter: ['style', 'width', 'height'] });
                }

                // Fallback poll: cheap, and covers engines the observer misses
                setInterval(fitCanvas, 500);
                fitCanvas();
            })();
        </script>
        <p id="output" />
        <script>
            var Module = {
                print: (function() {
                    var element = document.getElementById('output');
                    if (element) element.value = ''; // clear browser cache
                    return function(text) {
                        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                        console.log(text);
                        if (element) {
                          element.value += text + "\n";
                          element.scrollTop = element.scrollHeight; // focus on bottom
                        }
                    };
                })(),
                canvas: (function() {
                    var canvas = document.getElementById('canvas');
                    return canvas;
                })()
            };
        </script>
