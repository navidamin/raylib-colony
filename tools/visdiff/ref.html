<!doctype html><html><head><meta charset="utf-8">
<style>
/* LOCAL faces, deliberately. The Google Fonts stylesheet is blocked by the
   agent proxy here, and a blocked webfont does not fail loudly: document.fonts
   .ready resolves, Canvas silently falls back down the stack to whatever
   monospace the box has, and the diff then measures DejaVu against JetBrains
   Mono. That read as a port bug -- the reference's text looked a whole weight
   heavier -- for as long as it took to crop a callout and look at it. These
   are the exact files the port loads, so both halves rasterise the same
   outlines. */
@font-face{font-family:'JetBrains Mono';font-weight:500;font-style:normal;
  src:url('../../src/assets/fonts/JetBrainsMono-Medium.ttf') format('truetype');}
@font-face{font-family:'JetBrains Mono';font-weight:600;font-style:normal;
  src:url('../../src/assets/fonts/JetBrainsMono-SemiBold.ttf') format('truetype');}
@font-face{font-family:'JetBrains Mono';font-weight:700;font-style:normal;
  src:url('../../src/assets/fonts/JetBrainsMono-Bold.ttf') format('truetype');}
html,body{margin:0;background:#010910}canvas{display:block}</style></head><body>
<canvas id="c" width="1600" height="1300"></canvas>
<script src="../../js/holo3d.js"></script>
<script>
/* The reference half of the visual diff (spec 5). One frame, FIXED state --
   several elements pulse on sin(t*3), so time is pinned, not sampled. dpr is
   forced to 1 so the PNG is exactly the design size. */
const q = new URLSearchParams(location.search);
const num = (k, d) => q.has(k) ? parseFloat(q.get(k)) : d;
const W = 1600, H = 1300;
const ctx = document.getElementById('c').getContext('2d');
const model = Holo3D.build();
const view = { cx: num('cx', 640), cy: num('cy', 650), zoom: num('zoom', 0.9) };
const state = { yaw: num('yaw', -0.1), pitch: num('pitch', 0.42),
                explode: num('explode', 0), selected: num('sel', -1),
                time: num('t', 3.0), fast: q.get('fast') === '1' };
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#010910'; ctx.fillRect(0, 0, W, H);
  Holo3D.render(ctx, model, state, view);
  if (q.get('hud') !== '0') Holo3D.drawHud(ctx, model, state, view);
  window.__ready = true;
}
/* Assert the faces really loaded. A silent fallback invalidates the diff, so
   fail the shot rather than produce a plausible wrong reference. */
Promise.all([500, 600, 700].map(w =>
  document.fonts.load(`${w} 20px "JetBrains Mono"`).then(f => {
    if (!f.length) throw new Error(`JetBrains Mono ${w} did not load`);
  })
)).then(() => document.fonts.ready).then(draw).catch(e => {
  window.__fontError = String(e && e.message || e);
});
</script></body></html>
